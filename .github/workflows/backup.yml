name: Supabase Backup

# Nightly-ish safety net for the survivor-fantasy database. Dumps the
# public schema (profiles, picks, weeks, league_settings, games,
# nfl_players, lineup_slots) and saves it as a workflow artifact.
# Does NOT touch auth.users, RLS, functions, cron jobs, or the app itself --
# this only opens a read connection to Postgres via a connection string.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours, UTC
  workflow_dispatch: {}       # lets you trigger a backup manually from the Actions tab

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install a matching PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump the public schema
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H-%M-%SZ')
          echo "BACKUP_FILE=backup-${TIMESTAMP}.sql" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" \
            --schema=public \
            --no-owner \
            --no-privileges \
            --format=plain \
            --file="backup-${TIMESTAMP}.sql"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
