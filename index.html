<!-- Home-screen install metadata. Android/Chrome reads the manifest file for
     its install criteria (name, icons, start_url, display mode) -- iOS
     Safari ignores most of that and instead wants its own apple-* meta
     tags/link, so both are needed side by side. apple-mobile-web-app-title
     is what shows under the icon on an iPhone home screen (kept short,
     separate from the page <title>, which is too long for that spot).
     status-bar-style is black-translucent so the status bar area blends
     into the app's own dark background once launched standalone, instead
     of showing a default opaque bar -- pairs with the safe-area-inset-top
     padding already used by the sticky header (#heroBanner/.app-nav) below. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DKG Fantasy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Font stylesheet loads non-blocking: fetched with media="print" (doesn't
     block rendering) then flipped to media="all" once loaded; display=swap
     shows the fallback font immediately instead of invisible text. The
     Supabase JS bundle lives at the end of <body> instead of here, so
     neither resource delays first paint. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --bg:#0A0B12; --surface:#12131C; --surface-2:#1A1B28;
    --text:#F1F3F8; --text-dim:#8B93A8;
    --alive:#4ADE80; --alive-dim:rgba(74,222,128,0.12);
    --elim:#F76464; --elim-dim:rgba(247,100,100,0.12);
    --pending:#8B5CF6; --pending-dim:rgba(139,92,246,0.12);
    --caution:#FBBF24; --caution-dim:rgba(251,191,36,0.12);
    --purple:#8B5CF6; --purple-rgb:139,92,246; --purple-dim:rgba(var(--purple-rgb),0.12); --accent-ink:#fff;
    --border:#262838;
    --bg-grad-end:#242424;
    --bg-tint:var(--bg-grad-end);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  /* overflow-x:hidden here would clip horizontal overflow too, but -- because CSS treats
     "hidden" on one axis and the other axis's default "visible" as a mismatched pair -- it also
     silently promotes overflow-y to "auto" behind the scenes, which breaks #navMount's
     position:sticky (a sticky element needs the viewport itself to be the scrolling container,
     not an auto-overflow ancestor). overflow-x:clip avoids that promotion (clip and visible are
     treated as the same "doesn't need its own scroll container" category) while still clipping
     horizontal overflow exactly the same as hidden did. */
  html,body{margin:0;padding:0;overflow-x:clip;}
  /* Page background fades from --bg to --bg-tint top-to-bottom -- --bg-tint is what carries the
     current flair team's color (see applyThemeAccent()'s own comment), plain --bg-grad-end with
     no team picked. A diagonal-hairline texture layered on top of this was tried and dropped: on
     desktop, having both the hero banner's own texture and a second body texture visible at once
     read as two busy things competing rather than complementary, and the flair color tint alone
     already reads as more deliberate than a flat dark background without needing a pattern too. */
  body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;min-height:100vh;min-height:100dvh;background-image:linear-gradient(180deg, var(--bg) 0%, var(--bg-tint) 100%);background-attachment:fixed;overscroll-behavior-y:contain;}
  /* #navMount (sticky, full-bleed -- see its own comment below) sits outside .wrap just like
     #heroBanner does, so this top padding is just the breathing room between #navMount's bottom
     edge and .wrap's first real content (the app-header brand logo), not a header-height
     calculation. Bottom padding adds the device's own bottom safe-area inset (home indicator /
     rounded corners) on top of normal breathing room, since nothing's fixed to the bottom of the
     viewport to account for that clearance on its own. */
  .wrap{max-width:640px;margin:0 auto;padding:18px 14px calc(24px + env(safe-area-inset-bottom));width:100%;}
  h1,h2{font-family:'Archivo Black',sans-serif;font-weight:400;letter-spacing:0.2px;margin:0;text-transform:uppercase;}
  h1{font-size:26px;line-height:1.15;}
  h2{font-size:20px;line-height:1.15;}
  h3{font-size:11.5px;line-height:1.2;color:var(--purple);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:0;}
  p{line-height:1.5;color:var(--text-dim);margin:6px 0 0;font-size:14.5px;}
  .scoreboard{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .scoreboard .week{font-family:'Archivo Black',sans-serif;font-size:32px;color:var(--purple);line-height:1;}
  .scoreboard .week-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;width:100%;}
  .card.feature{border-color:var(--alive);background:linear-gradient(135deg, rgba(74,222,128,0.08), rgba(var(--purple-rgb),0.06)), var(--surface);box-shadow:0 0 0 1px rgba(74,222,128,0.15) inset;}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  button{font-family:'Inter',sans-serif;font-weight:700;font-size:14.5px;background:var(--purple);color:var(--accent-ink);border:none;border-radius:8px;padding:12px 14px;cursor:pointer;width:100%;touch-action:manipulation;}
  button.secondary{background:transparent;color:var(--text);border:1px solid var(--border);}
  button.danger{background:var(--elim);color:#1a0505;}
  button.warn{background:var(--caution-dim);color:var(--caution);border:1px solid var(--caution);}
  button.small{width:auto;padding:10px 12px;font-size:13px;}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  button:active{transform:translateY(1px) scale(0.98);}
  input,select{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px;border-radius:8px;font-size:16px;font-family:'Inter',sans-serif;margin-top:5px;}
  select option:disabled{color:var(--text-dim);}
  label{font-size:12.5px;color:var(--text-dim);display:block;margin-top:11px;line-height:1.4;}
  label.checkboxLabel{display:flex;align-items:center;gap:8px;margin-top:14px;}
  label.checkboxLabel input[type=checkbox]{width:auto;margin-top:0;flex:0 0 auto;}
  .pill{font-size:10.5px;padding:4px 9px;border-radius:5px;font-weight:700;white-space:nowrap;text-transform:uppercase;letter-spacing:0.5px;border:1px solid transparent;}
  .pill.alive{background:var(--alive-dim);color:var(--alive);border-color:var(--alive);}
  .pill.elim{background:var(--elim-dim);color:var(--elim);border-color:var(--elim);}
  .pill.pending{background:var(--pending-dim);color:var(--pending);border-color:var(--pending);}
  .pill.caution{background:var(--caution-dim);color:var(--caution);border-color:var(--caution);}
  .sc-icon{width:13px;height:13px;color:var(--pending);vertical-align:-2px;flex:0 0 auto;}
  /* #navMount is the actual sticky/full-bleed element -- position:sticky, not fixed, so it
     starts in normal flow immediately below #heroBanner (flush, no gap) and only pins itself
     once scrolling would otherwise carry it above the viewport's top edge; it un-sticks again
     only once .wrap (its next sibling, containing everything below it) finishes scrolling past,
     which in practice means it stays pinned for the whole rest of the page. Full width (not
     capped at 640px like .wrap/.hero-banner's own content) so its background spans edge-to-edge
     on wide screens -- capping it there left plain body background visible on both sides once
     scrolled past the banner, which read as a stray dark bar rather than part of the app's
     chrome. was fixed to the bottom of the viewport originally, then briefly fixed permanently
     to the top (pinned even while the banner above it was still fully in view, which ate too
     much of a small phone's screen); this is the middle ground -- pinned only once it would
     otherwise scroll out of view. safe-area-inset-top clears the device's own notch/status bar
     in standalone/full-screen mode, on both the sticky offset and the inner padding, since the
     nav can be sitting flush at the very top of the viewport in either its stuck or unstuck
     state depending on scroll position. */
  #navMount{position:sticky;top:0;width:100%;background:var(--surface);border-bottom:1px solid var(--border);z-index:51;}
  .app-nav{display:flex;max-width:640px;margin:0 auto;padding:calc(6px + env(safe-area-inset-top)) 4px 6px;}
  .bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;color:var(--text-dim);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;text-align:center;line-height:1.1;cursor:pointer;touch-action:manipulation;border-radius:8px;transition:transform .1s ease;}
  .bnav-item.active{color:var(--purple);}
  .bnav-item:active{transform:scale(0.92);}
  .bnav-item .icon{line-height:1;}
  .bnav-item .icon svg{width:20px;height:20px;display:block;}
  @media (max-width:360px){ .bnav-item{font-size:8.5px;} .bnav-item .icon svg{width:18px;height:18px;} }
  .slot-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;}
  .slot-label{font-family:'Inter',sans-serif;font-weight:800;font-size:13px;color:var(--purple);text-transform:uppercase;letter-spacing:0.5px;}
  .result-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:14.5px;cursor:pointer;touch-action:manipulation;transition:transform .1s ease,background .1s ease;}
  .result-item:last-child{border-bottom:none;}
  .result-item:active{transform:scale(0.98);background:var(--surface-2);}
  .kickoff-tag{font-size:11.5px;font-weight:700;}
  .lb-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:14.5px;gap:8px;}
  .lb-row:last-child{border-bottom:none;}
  /* Admin tab's Players list: name+pills and the action buttons each get their own full-width row
     below ~480px instead of wrapping into each other mid-line (which used to visually overlap on a
     narrow phone) -- side by side again once there's room. */
  .admin-player-row{flex-wrap:wrap;row-gap:8px;}
  .admin-player-row .name-block{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1 1 100%;min-width:0;}
  .admin-player-row .actions-block{flex:1 1 100%;justify-content:flex-start;}
  @media (min-width:480px){
    .admin-player-row .name-block{flex:1 1 auto;}
    .admin-player-row .actions-block{flex:0 0 auto;justify-content:flex-end;}
  }
  .divider{border:none;border-top:1px solid var(--border);margin:14px 0;}
  .note{font-size:12px;color:var(--text-dim);background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-top:12px;line-height:1.5;border:1px solid var(--border);}
  .banner{background:var(--elim-dim);border:1px solid var(--elim);color:var(--text);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;line-height:1.5;}
  .center{text-align:center;padding:60px 20px;color:var(--text-dim);}
  /* Skeleton shimmer -- shown in place of the standings list / weekly high-score rows while
     their data is still in flight, instead of a blank flash or plain "Loading…" text. Purely
     decorative (aria-hidden wherever it's used) and fully replaced once the real content
     renders -- never left mixed in with real rows. */
  @keyframes skShimmer{0%{background-position:-300px 0;}100%{background-position:300px 0;}}
  .sk{background:linear-gradient(90deg, var(--surface-2) 25%, rgba(var(--purple-rgb),0.16) 37%, var(--surface-2) 63%);background-size:600px 100%;animation:skShimmer 1.3s ease-in-out infinite;border-radius:6px;}
  .sk-row{height:18px;margin:10px 0;}
  .sk-row.short{width:42%;}
  .sk-row.med{width:72%;}
  .stat{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;padding:6px 0;font-size:14px;}
  .stat b{color:var(--text);font-weight:700;}
  .recap-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14.5px;}
  .recap-row:last-child{border-bottom:none;}
  .recap-row .slot-label{flex:0 0 32px;}
  .recap-row .recap-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
  .recap-row .recap-score{flex:0 0 auto;font-weight:700;white-space:nowrap;}
  .estimate-note{font-size:11.5px;color:var(--text-dim);font-style:italic;margin:2px 0 0;}
  .tablewrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:400px;}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--border);}
  th{color:var(--text-dim);font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;}
  .scoring-table{min-width:0;}
  .scoring-table td:last-child, .scoring-table th:last-child{text-align:right;white-space:nowrap;}
  .scores-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  @media (min-width:640px){ .scores-grid{grid-template-columns:1fr 1fr;} }
  .player-score-card{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--surface-2);min-width:0;overflow:hidden;}
  .player-score-head{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0;}
  .player-score-name{font-weight:700;font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .player-score-tag{font-size:12px;font-weight:600;color:var(--text-dim);}
  .player-score-pickers{font-size:11.5px;color:var(--text-dim);margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);line-height:1.4;}
  .scoreInput{width:64px;flex:0 0 auto;margin:0;padding:6px 8px;font-size:13px;text-align:right;}
  .est-pill{font-size:9.5px;padding:2px 7px;border-radius:5px;font-weight:800;white-space:nowrap;text-transform:uppercase;letter-spacing:0.4px;background:var(--pending-dim);color:var(--pending);border:1px solid var(--pending);flex:0 0 auto;}
  /* Standings/weekly-high-score point values: tabular-nums so a column of numbers lines up
     instead of jittering side to side as digit widths change, plus the shared hook (.pts-val)
     that count-up tweening and the brief flash-on-change color animate against -- see
     tweenPoints()/animateStandingsChanges()/animateHighScoreChanges(). .pts-hero reuses the
     scoreboard's big Archivo Black treatment for the single most prominent number in a list
     (the weekly high-scores leader, the Standings #1 row) rather than a second "big number"
     style. */
  .pts-val{color:var(--purple);white-space:nowrap;font-variant-numeric:tabular-nums;transition:color .5s ease;}
  .pts-val.pts-flash-up{color:var(--alive);}
  .pts-val.pts-flash-down{color:var(--elim);}
  .pts-hero{font-family:'Archivo Black',sans-serif;font-size:19px;letter-spacing:0.2px;}
  .recap-row .recap-score, .stat b, .scoreInput{font-variant-numeric:tabular-nums;}
  /* Rank-change arrow: briefly inserted next to a Standings name when that player's position
     moved since the last time this list rendered (tab switch, pull-to-refresh, or any action
     that reloads it) -- removed again once rankPop's animation finishes rather than tracked
     and cleaned up on the next real render. */
  .rank-move{width:12px;height:12px;flex:0 0 auto;color:var(--alive);animation:rankPop 2.4s ease forwards;}
  .rank-move svg{width:100%;height:100%;display:block;}
  .rank-move.rank-move-down{color:var(--elim);}
  @keyframes rankPop{0%{opacity:0;transform:translateY(3px) scale(0.6);}15%{opacity:1;transform:translateY(0) scale(1.15);}30%{transform:scale(1);}78%{opacity:1;}100%{opacity:0;}}
  /* Podium treatment for Standings' top 3 -- a small numbered badge, since the list itself is
     sorted but was never numbered before this. Colored circles rather than medal emoji, same
     reasoning as secondChanceIconHTML()'s SVG wings: stays in the app's own monochrome/flat
     visual language instead of pulling in full-color emoji art. #1 also gets .pts-hero (above)
     for its point value and a faint gold row tint. */
  .rank-badge{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Archivo Black',sans-serif;font-size:10px;flex:0 0 auto;color:#1A1206;}
  .rank-badge.r1{background:#F4C430;}
  .rank-badge.r2{background:#C7CDD6;}
  .rank-badge.r3{background:#D69A5D;}
  .lb-row.podium-1{background:linear-gradient(90deg, rgba(244,196,48,0.1), transparent);border-radius:8px;padding-left:6px;padding-right:6px;margin:0 -6px;}
  /* Pull-to-refresh indicator -- a fixed pill just under the sticky nav that fades/slides in as
     the page is pulled down past scrollY:0, then spins (ptr-spin) while render() re-fetches the
     current tab. Reuses the Picks tab's own football icon (ICON_PATHS.picks) rather than adding
     a second one -- see wirePullToRefresh(). */
  .ptr-indicator{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:50%;width:34px;height:34px;opacity:0;transform:translate(-50%,-36px);transition:opacity .15s ease;z-index:60;pointer-events:none;}
  .ptr-indicator-icon{width:100%;height:100%;padding:7px;box-sizing:border-box;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--purple);}
  .ptr-indicator-icon svg{width:100%;height:100%;display:block;}
  .ptr-indicator.ptr-spin .ptr-indicator-icon{animation:ptrSpin .7s linear infinite;}
  @keyframes ptrSpin{to{transform:rotate(360deg);}}
  /* Contest Home's status card (alive/eliminated) -- a slow breathing glow on the card's own
     border instead of the plain default .card border, so "you're still in it"/"you're out"
     reads at a glance without having to read the heading. Green for alive, red for eliminated,
     using the same --alive/--elim hex values as everywhere else (raw rgb triplets here since
     the animation needs several different alpha stops, not just the one --alive-dim/--elim-dim
     already defines). Applied only to the Contest Home status card, not the near-identical
     status card on the Picks tab -- kept to the one spot it was actually asked for. */
  .pulse-alive{animation:pulseAlive 2.6s ease-in-out infinite;}
  .pulse-elim{animation:pulseElim 2.6s ease-in-out infinite;}
  @keyframes pulseAlive{
    0%,100%{border-color:rgba(74,222,128,.55);box-shadow:0 0 0 0 rgba(74,222,128,.28),0 0 14px 1px rgba(74,222,128,.22);}
    50%{border-color:rgba(74,222,128,.95);box-shadow:0 0 0 5px rgba(74,222,128,.10),0 0 30px 6px rgba(74,222,128,.4);}
  }
  @keyframes pulseElim{
    0%,100%{border-color:rgba(247,100,100,.55);box-shadow:0 0 0 0 rgba(247,100,100,.28),0 0 14px 1px rgba(247,100,100,.22);}
    50%{border-color:rgba(247,100,100,.95);box-shadow:0 0 0 5px rgba(247,100,100,.10),0 0 30px 6px rgba(247,100,100,.4);}
  }
  /* #tabBody's own tab-change transition -- a quick cross-fade + slight rise, played only when
     render() actually navigated to a different screen/contest/tab (navJustChanged), never on a
     same-tab re-render (saving a pick, a search keystroke, pull-to-refresh) -- see render()'s own
     navChanged/lastRenderKey comment, which this reuses rather than tracking separately. #tabBody
     itself is recreated fresh on every render() call regardless, so the class has to be applied
     conditionally rather than left on permanently, or every re-render would replay it too. */
  .tab-fade{animation:tabFade 340ms ease both;}
  @keyframes tabFade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  /* Empty-state illustration -- simple dashed line art in the app's existing monochrome
     stroke-icon style (currentColor, no fill), for the couple of spots that only ever show a
     bare "nothing here" sentence. Kept deliberately minimal (icon + one line) rather than a
     bigger custom illustration per spot. */
  .empty-state{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 10px 8px;text-align:center;}
  .empty-state-icon{width:44px;height:44px;color:var(--text-dim);flex:0 0 auto;}
  .empty-state p{margin:0;color:var(--text-dim);font-size:13px;max-width:280px;}
  /* Player Projections card (Picks tab): .proj-option is one High/Mid/Low
     (or KnightFall's single best) block -- title+total on one line, then a
     single wrapped paragraph of "SLOT Name" entries rather than a row per
     slot, to keep the whole card from running long on mobile. .proj-tag is
     the small inline "X.X proj." badge shown next to a name in search
     results. */
  .proj-option{border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-top:8px;}
  .proj-option-title{font-weight:700;color:var(--text);font-size:13.5px;}
  .proj-option-roster{margin-top:4px;font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  .proj-tag{font-size:11px;font-weight:700;color:var(--text-dim);white-space:nowrap;}
  /* KnightFall's "Other strong options" row (one per position): position label left,
     alternate names+scores right-justified on wide screens -- but right-justified text
     that wraps onto multiple lines (a full position's worth of names on a narrow phone)
     reads badly, so below 480px this drops to a stacked layout instead: position on its
     own line, names below it, left-justified (matching how the text already wraps there,
     just readable instead of ragged-right). */
  .proj-alt-row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:14px;}
  .proj-alt-row .proj-alt-names{text-align:right;}

// Returns a base64-free data URI for the hero banner's repeating sparkle
// texture, contrast-adapted to the given primary_hex so the same "muted
// but visible" effect holds across every team instead of washing out on
// lighter/more saturated primaries. Uses perceived brightness (0-255,
// standard YIQ-style weighting) to pick white-on-dark vs black-on-light
// stars, then scales opacity up the closer that color sits to a mid grey
// (where a fixed-opacity overlay has the least natural contrast) and back
// down toward the extremes (near-black/near-white, where a light touch is
// already plenty visible).
// The floor/scale below are set so that even a team whose primary_hex sits
// at a pure extreme (#000000 for ATL/CAR/CIN/LV/PIT, a saturated
// low-luminance red for KC) still shows a clearly visible, still-subtle
// sparkle, rather than one that rounds down to invisible against a
// same-color background.
function heroTextureDataURI(hex){
  const h = (hex || '').replace('#', '');
  const r = parseInt(h.substring(0, 2), 16) || 0;
  const g = parseInt(h.substring(2, 4), 16) || 0;
  const b = parseInt(h.substring(4, 6), 16) || 0;
  const brightness = (r * 299 + g * 587 + b * 114) / 1000; // 0 (black) - 255 (white)
  const light = brightness > 150;
  const distanceFromExtreme = light ? (255 - brightness) : brightness; // 0-~150
  const opacity = Math.min(0.09 + (distanceFromExtreme / 150) * 0.08, 0.17).toFixed(2);
  const fill = light ? '#000000' : '#ffffff';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><g transform="translate(8,8)" fill="${fill}" fill-opacity="${opacity}"><path d="M12 0L14.2 9.8L24 12L14.2 14.2L12 24L9.8 14.2L0 12L9.8 9.8Z"/></g></svg>`;
  return `data:image/svg+xml,${encodeURIComponent(svg)}`;
}

// Full-width hero banner: a solid block in a primary hex color, a secondary
// hex bottom accent stripe, and a contrast-adaptive sparkle texture (see
// heroTextureDataURI) -- this trio renders always, flair team picked or not.
// With a flair team picked, that team's primary/secondary_hex drive it and a
// right-justified, height-cropped team logo is layered on top when that team
// has a hero_logo_path set (progressive enhancement -- optional, not
// required for the banner to show). With no flair team picked, DKG's own
// dark-gray/star default renders instead -- the banner mount is never empty,
// just plain color/texture with no logo image in either state right now (a
// logo watermark here was tried and rolled back, same as it was for team
// logos -- see "Accepted risks" in the setup doc).
// Lives in the #heroBanner mount just above .wrap (outside its 640px
// max-width, so it's full-bleed on desktop as well as mobile) -- normal
// document flow, not fixed, so it scrolls away like any other content; see
// its CSS comment for how it still lines up flush below the fixed nav.
// Called after profile loads/changes.
function renderHeroBanner(){
  const el = document.getElementById('heroBanner');
  if(!el) return;
  const team = profile && profile.flair_team ? teamByCode(profile.flair_team) : null;
  if(!team){
    // '#242424' is --bg-grad-end's literal value, duplicated here because heroTextureDataURI
    // needs a real hex to compute star brightness/opacity from, not a CSS custom property --
    // keep the two in sync if --bg-grad-end's value ever changes.
    el.innerHTML = `<div class="hero-banner" style="background-color:var(--bg-grad-end);border-bottom-color:var(--border);--hb-texture:url('${heroTextureDataURI('#242424')}');"></div>`;
    return;
  }
  const texture = heroTextureDataURI(team.primary_hex);
  const logoImg = team.hero_logo_path ? `<img src="images/flair/${team.hero_logo_path}" alt="${esc(team.name)}">` : '';
  el.innerHTML = `<div class="hero-banner" style="background-color:${team.primary_hex};border-bottom-color:${team.secondary_hex};--hb-texture:url('${texture}');">${logoImg}</div>`;
}

// Converts a '#rrggbb' hex string into a bare "r, g, b" triplet, for
// building CSS custom properties usable inside rgba(var(--x-rgb), alpha).
function hexToRgbTriplet(hex){
  const h = (hex || '').replace('#', '');
  const r = parseInt(h.substring(0, 2), 16) || 0;
  const g = parseInt(h.substring(2, 4), 16) || 0;
  const b = parseInt(h.substring(4, 6), 16) || 0;
  return `${r}, ${g}, ${b}`;
}

// Blends tintHex into baseHex at the given strength (0-1) and returns the result as a
// '#rrggbb' hex string. Used to compute --bg-tint below: a flat, precomputed blend rather
// than a live CSS mix, since a stacked/computed background caused real rendering problems
// during mockup (see BackgroundVariants.dc.html's own history) and a single solid resulting
// color sidesteps that entirely.
function blendHex(baseHex, tintHex, strength){
  const b = (baseHex || '').replace('#', ''), t = (tintHex || '').replace('#', '');
  const br = parseInt(b.substring(0, 2), 16) || 0, bg = parseInt(b.substring(2, 4), 16) || 0, bb = parseInt(b.substring(4, 6), 16) || 0;
  const tr = parseInt(t.substring(0, 2), 16) || 0, tg = parseInt(t.substring(2, 4), 16) || 0, tb = parseInt(t.substring(4, 6), 16) || 0;
  const mix = (base, tint) => Math.round(base * (1 - strength) + tint * strength);
  const toHex = n => n.toString(16).padStart(2, '0');
  return `#${toHex(mix(br, tr))}${toHex(mix(bg, tg))}${toHex(mix(bb, tb))}`;
}

// Re-themes the app's accent color (buttons, section headers, the week
// counter, FAQ toggle, etc.) to the current flair
// team's secondary_hex, falling back to the original purple when no flair
// is chosen. Deliberately independent of hero_logo_path/renderHeroBanner
// -- every team already has a secondary_hex regardless of banner-image
// rollout, so this works the moment a flair is picked. Does NOT touch
// --pending/--pending-dim, which stay fixed purple: that pair means
// "entry awaiting approval" specifically and must stay visually distinct
// from a team color a player happens to have picked. Sets --accent-ink
// (the button text color) to dark or light based on the accent's own
// brightness, since several teams' secondary colors are near-white and
// white-on-white button text would otherwise be unreadable. Also sets
// --bg-tint (the page background's lower gradient stop, body's own
// diagonal-hairline texture stays neutral white on top regardless): a
// 24%-strength blend of the team's primary_hex into --bg-grad-end's own
// #242424, deliberately using primary_hex rather than secondary_hex here
// since secondary already drives the accent above and primary reads
// darker/more muted for nearly every team. 24% (not the ~14% first shown
// in mockup) per Gabe's call that the first pass read too bright -- some
// teams whose primary sits close to #242424 already (e.g. Seahawks navy)
// will still read as barely-there at this strength; expect to dial
// individual teams' primary_hex values rather than this shared strength
// once specific teams are flagged as too subtle or too strong.
function applyThemeAccent(){
  const team = profile && profile.flair_team ? teamByCode(profile.flair_team) : null;
  const hex = team ? team.secondary_hex : '#8B5CF6';
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16) || 0;
  const g = parseInt(h.substring(2, 4), 16) || 0;
  const b = parseInt(h.substring(4, 6), 16) || 0;
  const brightness = (r * 299 + g * 587 + b * 114) / 1000;
  const root = document.documentElement.style;
  root.setProperty('--purple', hex);
  root.setProperty('--purple-rgb', hexToRgbTriplet(hex));
  root.setProperty('--accent-ink', brightness > 150 ? '#0A0B12' : '#ffffff');
  root.setProperty('--bg-tint', team ? blendHex('#242424', team.primary_hex, 0.24) : '#242424');
}

// Summing float scores (esp. across several weeks) can land on things like
// 289.29999999999995 -- round to 1 decimal for display, drop the .0 when
// it's a whole number.
function fmtPts(n){
  const r = Math.round((Number(n) + Number.EPSILON) * 10) / 10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}

// Count-up/down tween for a .pts-val element's displayed points when its underlying number
// changes between renders (Standings, the weekly high-scores card) -- purely a visual
// transition layered on top of already-correct HTML: the row's real final text is whatever
// survivorsRowsHTML()/weekTop5ListHTML() rendered, this just animates *into* it instead of a
// hard replace, and always finishes on the exact rounded value so it can never drift from what
// a fresh render would show. See animateStandingsChanges()/animateHighScoreChanges() for the
// before/after comparison that decides which rows get tweened.
function tweenPoints(el, from, to){
  el.classList.remove('pts-flash-up', 'pts-flash-down');
  void el.offsetWidth; // restart the flash-color transition if one was still fading out
  el.classList.add(to > from ? 'pts-flash-up' : 'pts-flash-down');
  const duration = 700, start = performance.now();
  function step(now){
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = `${fmtPts(from + (to - from) * eased)} pts`;
    if(t < 1) requestAnimationFrame(step);
    else setTimeout(() => el.classList.remove('pts-flash-up', 'pts-flash-down'), 500);
  }
  requestAnimationFrame(step);
}
// Briefly inserts a small up/down chevron (.rank-move, see its CSS) at the front of a
// Standings row's name group when that player's position moved since the list last rendered.
// Self-removing (rankPop's animation duration below) so it never needs to be tracked or
// cleaned up by the next real render -- each render just calls this again if warranted.
function flashRankMove(rowEl, dir){
  const nameGroup = rowEl.querySelector(':scope > span:first-child');
  if(!nameGroup) return;
  const arrow = document.createElement('span');
  arrow.className = `rank-move rank-move-${dir}`;

  arrow.innerHTML = dir === 'up'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M5 13l7-7 7 7"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13M5 11l7 7 7-7"/></svg>';
  nameGroup.insertBefore(arrow, nameGroup.firstChild);
  setTimeout(() => arrow.remove(), 2500);
}

// Pull-to-refresh -- a plain touch-gesture implementation (no library) wired once, globally,
// the first time the app shell renders (see wirePullToRefresh's ptrWired guard). It reads
// #ptrIndicator fresh on every touch event rather than caching a reference to it, since that
// element is destroyed and recreated on every render() (app.innerHTML is rebuilt wholesale).
// Only arms when the page is already scrolled to the very top (window.scrollY === 0) -- pulling
// down mid-list just scrolls normally. On a successful pull, calls render() to re-fetch
// whichever tab is currently active the same way switching tabs does, rather than duplicating
// each tab's own fetch logic here.
let ptrWired = false;
function wirePullToRefresh(){
  if(ptrWired) return;
  ptrWired = true;
  const THRESHOLD = 64;
  let startY = null, pulling = false, refreshing = false;
  const indicator = () => document.getElementById('ptrIndicator');
  document.addEventListener('touchstart', (e) => {
    const el = indicator();
    if(!el || refreshing || window.scrollY > 0){ startY = null; return; }
    startY = e.touches[0].clientY;
    pulling = false;
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    const el = indicator();
    if(!el || startY === null || refreshing) return;
    const dy = e.touches[0].clientY - startY;
    if(dy <= 0 || window.scrollY > 0){ pulling = false; el.style.opacity = '0'; return; }
    pulling = true;
    const pull = Math.min(dy, THRESHOLD * 1.6);
    el.style.opacity = String(Math.min(1, pull / THRESHOLD));
    el.style.transform = `translate(-50%, ${Math.min(pull, THRESHOLD) - 36}px)`;
  }, { passive: true });
  document.addEventListener('touchend', () => {
    const el = indicator();
    if(!el || !pulling){ startY = null; pulling = false; return; }
    pulling = false;
    const pulledEnough = parseFloat(el.style.opacity || '0') >= 1;
    startY = null;
    if(!pulledEnough){ el.style.opacity = '0'; el.style.transform = 'translate(-50%, -36px)'; return; }
    refreshing = true;
    el.classList.add('ptr-spin');
    el.style.opacity = '1';
    el.style.transform = 'translate(-50%, 20px)';
    render();
    setTimeout(() => {
      refreshing = false;
      const el2 = indicator();
      if(el2){ el2.classList.remove('ptr-spin'); el2.style.opacity = '0'; el2.style.transform = 'translate(-50%, -36px)'; }
    }, 900);
  });
}

function ctDate(iso){
  return new Intl.DateTimeFormat('en-US', {timeZone:'America/Chicago', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date(iso));
}
function ctTime(iso){
  return new Intl.DateTimeFormat('en-US', {timeZone:'America/Chicago', weekday:'short', hour:'numeric', minute:'2-digit'}).format(new Date(iso)) + ' CT';
}
function isSameDayCT(iso){ return ctDate(iso) === ctDate(new Date().toISOString()); }

async function loadWeekProjections(){

// Contest Home's "recap" needs every week the player has picks in *within this contest*
// that has actually STARTED -- its real FIRST kickoff already passed -- independent of
// currentWeek. Gating on "has started", not just "has a pick", is what stops the card from
// flipping to (and mislabeling as a "recap") a future week the moment the player locks in a
// pick for it ahead of time -- see the note on recentWeekNumbers above. This is deliberately
// the week's FIRST kickoff, not its last (weeks.closes_at) -- a week shows up here, tagged
// "Live", the moment there's real live data to show, rather than waiting for the whole week
// (through Monday night) to close out.
// Populates recentWeekNumbers (every such week, ascending) and then loads the one the
// prev/next arrows currently point at (recapWeekIndex, defaulting to the most recent).
async function loadRecentWeek(){
  const { data } = await sb.from('picks_with_scores').select('*')
    .eq('contest_id', currentContestId).eq('player_id', session.user.id)
    .order('week_number', { ascending: false }).limit(50);
  if(!data || !data.length){
    recentWeekNumbers = []; recapWeekIndex = -1; recentWeekNumber = null;
    recentWeekPicks = []; recentWeekRow = null; recentWeekClosesAt = null;
    return;
  }
  const pickedWeekNumbers = [...new Set(data.map(p => p.week_number))];
  const [{ data: weekRows }, { data: gameRows }] = await Promise.all([
    sb.from('weeks').select('week_number, closes_at').in('week_number', pickedWeekNumbers),
    sb.from('games').select('week_number, kickoff_at').in('week_number', pickedWeekNumbers)
  ]);
  const closesAtByWeek = {};
  (weekRows || []).forEach(w => { closesAtByWeek[w.week_number] = w.closes_at; });
  // Earliest kickoff per week -- this (not weeks.closes_at, which is the LAST game + 4h) is
  // what decides whether a week has anything live to show yet.
  const firstKickoffByWeek = {};
  (gameRows || []).forEach(g => {
    const t = new Date(g.kickoff_at);
    if(!firstKickoffByWeek[g.week_number] || t < firstKickoffByWeek[g.week_number]) firstKickoffByWeek[g.week_number] = t;
  });
  const now = new Date();
  recentWeekNumbers = pickedWeekNumbers
    .filter(wk => firstKickoffByWeek[wk] && firstKickoffByWeek[wk] <= now)
    .sort((a,b) => a - b);

  if(!recentWeekNumbers.length){
    recapWeekIndex = -1; recentWeekNumber = null;
    recentWeekPicks = []; recentWeekRow = null; recentWeekClosesAt = null;
    return;
  }
  if(recapWeekIndex < 0 || recapWeekIndex >= recentWeekNumbers.length) recapWeekIndex = recentWeekNumbers.length - 1;
  recentWeekNumber = recentWeekNumbers[recapWeekIndex];
  recentWeekPicks = data.filter(p => p.week_number === recentWeekNumber);
  const { data: cwRow } = await sb.from('contest_weeks').select('*')
    .eq('contest_id', currentContestId).eq('week_number', recentWeekNumber).maybeSingle();
  recentWeekRow = cwRow;
  recentWeekClosesAt = closesAtByWeek[recentWeekNumber] || null;
}
// Which week (if any) is "live" -- open (not yet finalized) but its real FIRST kickoff has
// already passed, i.e. currently being played out / scored. Used by the Home "Weekly high
// scores" card and Standings so they can show real-time/estimated numbers during the weekend
// instead of waiting for the admin to finalize the week. Gated on real kickoff time rather than
// "has at least one pick" -- a pick can exist for a week that hasn't started at all (e.g. a
// player locking in next week's lineup early), which used to flip this on too soon. Same fix
// as loadRecentWeek()'s first-kickoff gate above.
// One query pulls kickoff times for every game in any open week at once, then picks the newest
// week_number whose first kickoff has passed -- avoids a sequential per-week query, which gets
// slow once a contest has several weeks scheduled out.
async function loadFinalizedWeeks(){
  const [{ data: finalizedRows }, { data: openRows }] = await Promise.all([
    sb.from('contest_weeks').select('week_number').eq('contest_id', currentContestId).eq('is_finalized', true).order('week_number'),
    sb.from('contest_weeks').select('week_number').eq('contest_id', currentContestId).eq('is_finalized', false).order('week_number', { ascending: false })
  ]);
  finalizedWeekNumbers = (finalizedRows || []).map(w => w.week_number);
  const openWeekNumbers = (openRows || []).map(w => w.week_number); // already newest-first
  liveWeekNumber = null;
  if(openWeekNumbers.length){
    const { data: gamesInOpenWeeks } = await sb.from('games').select('week_number, kickoff_at')
      .in('week_number', openWeekNumbers);
    const firstKickoffByWeek = {};
    (gamesInOpenWeeks || []).forEach(g => {
      const t = new Date(g.kickoff_at);
      if(!firstKickoffByWeek[g.week_number] || t < firstKickoffByWeek[g.week_number]) firstKickoffByWeek[g.week_number] = t;
    });
    const now = new Date();
    liveWeekNumber = openWeekNumbers.find(w => firstKickoffByWeek[w] && firstKickoffByWeek[w] <= now) ?? null;
  }
  // Default the slider to the most recent displayable week (the live one if there is one,
  // otherwise the most recent finalized week); keep the current position if it's still valid
  // (e.g. after a re-render).
  if(hsWeekIndex < 0 || hsWeekIndex >= displayWeekNumbers().length) hsWeekIndex = displayWeekNumbers().length - 1;
}
// finalizedWeekNumbers plus the live in-progress week (if any and not already finalized) --
// used only by the Home/Standings "high scores" displays, which are fine showing an
// estimate. Cumulative Standings totals and eliminations stay on finalizedWeekNumbers alone.
function displayWeekNumbers(){
  return (liveWeekNumber !== null && !finalizedWeekNumbers.includes(liveWeekNumber))
    ? finalizedWeekNumbers.concat([liveWeekNumber])
    : finalizedWeekNumbers;
}
// Shared by the Contest Home slider, Standings' "latest week" card, and the
// Prizes weekly-history accordion -- one place that turns a week's picks
// into a top-5 [{name,flair_team,total}] list, memoized per contest+week since
// finalized weeks never change once scored.
// bypassCache: pass true for a week that's still live (scores change every ~15 min as
// sync-player-stats runs) so a stale memoized value doesn't stick around across re-renders.
// Finalized weeks never change once scored, so they're safe to cache indefinitely.
async function getWeekTop5(weekNumber, bypassCache){
  const cacheKey = `${currentContestId}:${weekNumber}`;
  if(!bypassCache && weekTop5Cache[cacheKey]) return weekTop5Cache[cacheKey];
  const { data } = await sb.from('picks_with_scores').select('player_id, score, profiles(display_name, flair_team)')
    .eq('contest_id', currentContestId).eq('week_number', weekNumber);
  const totals = {};
  (data || []).forEach(p => {
    if(!totals[p.player_id]) totals[p.player_id] = { id: p.player_id, name: p.profiles?.display_name || '', flair_team: p.profiles?.flair_team || null, total: 0 };
    totals[p.player_id].total += Number(p.score) || 0;
  });
  const top5 = Object.values(totals).sort((a,b) => b.total - a.total).slice(0, 5);
  if(!bypassCache) weekTop5Cache[cacheKey] = top5;
  return top5;
}
// data-pid + .pts-val on each row are what let animateHighScoreChanges() find and tween a
// given entrant's number when this list re-renders with a changed total -- see fmtPts's
// tween/rank-move helpers above. Rank 1 additionally gets .pts-hero, the same big Archivo Black
// treatment the scoreboard's own week counter uses, so the week's actual leader reads as the
// one prominent number in the card rather than sitting the same size as 2nd-5th.
function weekTop5ListHTML(top5){
  return top5.length ? top5.map((t,i) => `<div class="lb-row" data-pid="${t.id}"><span><span${t.flair_team ? ` style="color:${flairNameColor(t.flair_team)};"` : ''}>${esc(t.name)}</span>${t.flair_team ? ' ' + flairPillHTML(t.flair_team) : ''}</span><b class="pts-val${i === 0 ? ' pts-hero' : ''}">${fmtPts(t.total)} pts</b></div>`).join('')
    : '<p>No scores yet.</p>';
}
// Compares a freshly-fetched weekly-high-scores top5 against the last time THIS SAME
// contest+week rendered (module-level prevHighScoreSnapshot, keyed so flipping between weeks
// with the ‹ › arrows never cross-contaminates -- each week keeps its own snapshot) and tweens
// any entrant whose total moved between then and now. No rank-arrow treatment here (unlike
// Standings) since dropping in or out of a top-5 cut line isn't a simple up/down move.
let prevHighScoreSnapshot = {};
let homeHighScoresData = null; // { wk, top5 } | null -- set by renderHighScoresCardHTML(), read by renderHome()
// Standings' own before/after snapshot for animateStandingsChanges() -- null until the first
// real Standings render of a session (so nothing tweens against nothing), then
// { [profileId]: { total, rank } } from then on.
let prevStandingsSnapshot = null;
function animateHighScoreChanges(week, top5){
  if(week === undefined || week === null || !top5) return;
  const key = `${currentContestId}:${week}`;
  const prev = prevHighScoreSnapshot[key];
  const next = {};
  top5.forEach(t => { next[t.id] = t.total; });
  if(prev){
    top5.forEach(t => {
      const before = prev[t.id];
      if(before === undefined || before === t.total) return;
      const rowEl = document.querySelector(`#tabBody .lb-row[data-pid="${t.id}"]`);
      const ptsEl = rowEl && rowEl.querySelector('.pts-val');
      if(ptsEl) tweenPoints(ptsEl, before, t.total);
    });
  }
  prevHighScoreSnapshot[key] = next;
}
// Top 5 individual NFL players (not entrants) for a given week, by that
// player's own score, plus which of this contest's entrants picked them (a
// real NFL player is very often drafted by more than one entrant in the
// same week) -- this is the "Chosen Stars of the Week" card. A real
// player's weekly score is one fact stored once in week_player_scores
// (global, shared across every contest), so `picks_with_scores` already
// carries the right value for every entrant in THIS contest who drafted
// him -- this dedupes by nfl_player_id, collects every picker's display
// name, and takes the top 5 by score. Memoized per contest+week same as
// getWeekTop5 (bypassCache for the live in-progress week -- see there).
async function getWeekTopPlayers(weekNumber, bypassCache){
  const cacheKey = `${currentContestId}:${weekNumber}`;
  if(!bypassCache && weekTopPlayersCache[cacheKey]) return weekTopPlayersCache[cacheKey];
  const { data } = await sb.from('picks_with_scores').select('nfl_player_id, nfl_player_name, position, team, score, profiles(display_name)')
    .eq('contest_id', currentContestId).eq('week_number', weekNumber);
  const byPlayer = {};
  (data || []).forEach(p => {
    if(p.score === null) return;
    if(!byPlayer[p.nfl_player_id]) byPlayer[p.nfl_player_id] = { name: p.nfl_player_name, position: p.position, team: p.team, score: Number(p.score) || 0, pickers: [] };
    byPlayer[p.nfl_player_id].pickers.push(p.profiles?.display_name || '');
  });
  const top5 = Object.values(byPlayer).sort((a,b) => b.score - a.score).slice(0, 5);
  if(!bypassCache) weekTopPlayersCache[cacheKey] = top5;
  return top5;
}
function weekTopPlayersListHTML(top5){
  return top5.length ? top5.map((p,i) => `
    <div class="lb-row" style="align-items:flex-start;">
      <span>
        <div>${esc(p.name)} <span style="color:var(--text-dim);">${p.position}${p.team ? ' · ' + esc(p.team) : ''}</span></div>
        <div class="player-score-pickers" style="margin-top:3px;padding-top:0;border-top:none;">Picked by: ${p.pickers.length ? p.pickers.map(esc).join(', ') : '—'}</div>
      </span>
      <b style="color:var(--purple);white-space:nowrap;">${fmtPts(p.score)} pts</b>
    </div>`).join('')
    : '<p>No scores yet.</p>';
}
// Called once, right after entering (or creating, or re-entering) a
// contest from the Lobby -- loads everything renderHome/renderPicks/etc need.
// loadCurrentContest/refreshCurrentEntry/loadCurrentWeek only depend on
// currentContestId/session (already set by the time this runs), not on each
// other's results, so they run together in one Promise.all round trip.
async function loadContestData(){
  adminScoreWeek = null; // re-derive fresh (defaulting to the oldest unfinalized week) each time a contest is (re-)entered
  await Promise.all([loadCurrentContest(), refreshCurrentEntry(), loadCurrentWeek()]);
  await Promise.all([loadMyPicks(), loadUsedPlayers(), loadMyAllPicks(), loadWeekGames(), loadWeekProjections(), loadRecentWeek(), loadFinalizedWeeks()]);
}

// ---------- NAV PERSISTENCE ----------
// Keeps a page/tab reload from dumping the player back to the Lobby. sessionStorage
// (not localStorage) on purpose -- it survives an in-tab reload but clears once the tab
// is actually closed, so this never resurrects a days-old contest/tab on a fresh visit.
// Written on every render() (cheap: two small fields) and read back once, on load, by
// restoreNavState() below.
const NAV_STATE_KEY = 'dkg_navState';
function saveNavState(){
  try { sessionStorage.setItem(NAV_STATE_KEY, JSON.stringify({ contestId: currentContestId, tab: activeTab })); }
  catch(e){ /* sessionStorage unavailable (e.g. private browsing) -- just won't persist, not fatal */ }
}
// Called once, right after loadAllData(), on both a fresh sign-in and a page reload
// (myEntries is what gates this -- see below). Restores whichever contest/tab this
// browser tab was on, so a refresh lands back where the player was instead of the Lobby.
async function restoreNavState(){
  let saved;
  try { saved = JSON.parse(sessionStorage.getItem(NAV_STATE_KEY)); } catch(e){ return; }
  if(!saved) return;
  if(saved.contestId && myEntries[saved.contestId]){
    // Only restore a contest the player actually has an entry in -- guards against a
    // stale id left over from an archived/deleted contest, or (shared-device edge case)
    // a different account's contest from earlier in this same browser tab.
    currentContestId = saved.contestId;
    activeTab = saved.tab || 'home';
    await loadContestData();
    // Admin is only ever a clickable link for a commissioner (see renderContestShell) --
    // don't let a stale saved tab show it to someone whose admin rights changed since.
    if(activeTab === 'admin' && !currentEntry?.is_commissioner) activeTab = 'home';
  } else if(!saved.contestId && ['legend','faq','platformAdmin'].includes(saved.tab)){
    activeTab = saved.tab;
    if(activeTab === 'platformAdmin' && !profile?.is_platform_admin) activeTab = 'lobby';
  }
}

// ---------- AUTH ----------
// Sign-in is a typed one-time code, not a clickable magic link -- a magic
// link can be silently consumed by an email client's own "link preview"
// prefetch before the player taps it, which looks like a dead/looping
// sign-in with no clear cause. A typed code can't be prefetched.
// sendLoginCode also powers "Resend code" -- same call, a fresh code each
// time. The code's digit count is set server-side (Supabase Auth -> Email
// OTP length), not hardcoded here, so the UI below accepts a range of
// lengths rather than assuming one exact length.
async function sendLoginCode(email, displayName){
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { data: { display_name: displayName } }
  });
  if(error) throw error;
  pendingEmail = email;
  pendingName = displayName;
  otpSent = true;
  otpCooldownUntil = Date.now() + 60000; // matches Supabase's default per-email resend cooldown
  render();
}
async function verifyLoginCode(code){
  const { error } = await sb.auth.verifyOtp({ email: pendingEmail, token: code, type: 'email' });
  if(error) throw error;
  // onAuthStateChange (below) picks up the new session and moves us into the app.
}
async function signOut(){
  await sb.auth.signOut();
  session = null; profile = null; contests = []; myEntries = {};
  currentContestId = null; currentContest = null; currentEntry = null;
  screen = 'auth'; activeTab = 'lobby';
  otpSent = false; pendingEmail = null; pendingName = null; otpCooldownUntil = 0;
  clearInterval(otpResendTimer);
  saveGameModesCollapsed(false); // reset the Lobby's Game Modes card back to expanded for next sign-in
  renderHeroBanner();
  applyThemeAccent();
  render();
}

// ---------- RENDER ----------
// lastRenderKey tracks screen+contest+tab across calls so render() can tell "the player
// switched screens/tabs" (scroll back to top, like a normal page nav would) apart from
// "same screen re-rendered after some data changed" (e.g. a pick was saved -- scrolling
// the player back to the top of the Picks tab mid-edit would be jarring, not helpful).
// navJustChanged mirrors the same navChanged check for renderHubShell()/renderContestShell()
// to read when building #tabBody -- #tabBody is recreated fresh on every single render() call
// regardless (its whole parent's innerHTML is reassigned), so the .tab-fade class has to be
// applied conditionally here rather than left on permanently, or a same-tab re-render (saving
// a pick, a search keystroke, pull-to-refresh) would replay the fade too.
let lastRenderKey = null;
let navJustChanged = false;
function render(){
  const navKey = `${screen}:${currentContestId}:${activeTab}`;
  const navChanged = navKey !== lastRenderKey;
  lastRenderKey = navKey;
  navJustChanged = navChanged;
  saveNavState();
  // Captured before the shell render below, since renderFAQ() clears jumpToDisclaimersFaq
  // as soon as it consumes it -- the flag would already read false by the time we get to
  // the scroll-to-top check otherwise, and this scrollTo(0,0) would stomp the scrollIntoView
  // renderFAQ just did to bring the disclaimers item into view.
  const wasJumpingToFaq = jumpToDisclaimersFaq;
  if(screen === 'loading'){ app.innerHTML = `<div class="center">Loading…</div>`; return; }
  if(screen === 'auth'){ renderAuth(); }
  else if(screen === 'app'){
    if(currentContestId === null) renderHubShell();
    else renderContestShell();
    wirePullToRefresh();
  }
  if(navChanged && !wasJumpingToFaq) window.scrollTo(0, 0);
}

function renderAuth(){
  if(otpSent){ return renderOtpEntry(); }
  app.innerHTML = `
    <div class="app-header"><img class="brand-icon" src="images/degen-king-games-survivor.png" alt="Degen King Games"></div>
    <p>Enter your name and email below and we'll send a one-time code to sign in — no password to remember. Codes expire after 10 minutes, so check your inbox once you hit send (and check your spam folder too — mark it "Not spam" if it lands there instead).</p>
    <div class="card">
      <h3>Sign in / join</h3>
      <label>Display name (shown to other players — your email never is)</label>
      <input id="nameInput" placeholder="e.g. Ace" />
      <label>Email</label>
      <input id="emailInput" type="email" placeholder="you@example.com" />
      <button id="sendBtn" style="margin-top:16px;">Send code</button>
      <div id="authErr" class="note" style="display:none;"></div>
    </div>`;
  document.getElementById('sendBtn').onclick = guard(async () => {
    const name = document.getElementById('nameInput').value.trim();
    const email = document.getElementById('emailInput').value.trim();
    if(!name || !email){ showBanner('Enter both a display name and an email.'); return; }
    await sendLoginCode(email, name);
  });
}

// Code-entry screen shown right after a code is sent (or resent). Keeps
// pendingEmail/pendingName around so "Resend code" doesn't need the player
// to retype anything, and disables the resend button behind a countdown
// matching Supabase's own per-email rate limit so a too-fast resend tap
// doesn't just trade one confusing error for another.
function renderOtpEntry(){
  app.innerHTML = `
    <div class="app-header"><img class="brand-icon" src="images/degen-king-games-survivor.png" alt="Degen King Games"></div>
    <div class="card">
      <h3>Enter your code</h3>
      <p>We sent a one-time code to <strong>${esc(pendingEmail)}</strong>. Check your spam folder and mark it "Not spam" if it's not in your inbox within a minute or two. The code expires in 10 minutes.</p>
      <label>One-time code</label>
      <input id="otpInput" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="Enter code" autocomplete="one-time-code" />
      <button id="verifyBtn" style="margin-top:16px;">Verify &amp; sign in</button>
      <button class="secondary" id="resendBtn" style="margin-top:10px;">Resend code</button>
      <button class="secondary" id="backBtn" style="margin-top:10px;">Use a different email</button>
    </div>`;

  const input = document.getElementById('otpInput');
  const verifyBtn = document.getElementById('verifyBtn');
  const resendBtn = document.getElementById('resendBtn');
  input.focus();
  input.addEventListener('input', () => { input.value = input.value.replace(/\D/g, '').slice(0, 10); });
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter') verifyBtn.click(); });

  clearInterval(otpResendTimer);
  const tickResend = () => {
    const remaining = Math.ceil((otpCooldownUntil - Date.now()) / 1000);
    if(remaining > 0){
      resendBtn.disabled = true;
      resendBtn.textContent = `Resend code (${remaining}s)`;
    } else {
      resendBtn.disabled = false;
      resendBtn.textContent = 'Resend code';
      clearInterval(otpResendTimer);
    }
  };
  tickResend();
  otpResendTimer = setInterval(tickResend, 1000);

  verifyBtn.onclick = guard(async () => {
    const code = input.value.trim();
    if(code.length < 6){ showBanner('Enter the full code from your email.'); return; }
    await verifyLoginCode(code);
  });
  resendBtn.onclick = guard(async () => {
    if(resendBtn.disabled) return;
    await sendLoginCode(pendingEmail, pendingName);
    showBanner('New code sent.');
  });
  document.getElementById('backBtn').onclick = () => {
    clearInterval(otpResendTimer);
    otpSent = false; pendingEmail = null; pendingName = null;
    render();
  };
}

// ---------- HUB (renderHub/renderHubShell -- the Lobby, where all a player's contests are homed) ----------
function renderHubShell(){
  const bottomNavTabs = [
    ['lobby', tabIcon('lobby'), 'Lobby'], ['faq', tabIcon('faq'), 'FAQ'], ['legend', tabIcon('legend'), 'DKG']
  ];
  // Display label only -- the routing key ('platformAdmin'), renderPlatformAdmin(),
  // and every other internal reference keep the original name; only what players
  // see changed (shorter, and matches what this tier actually is -- see "Global
  // Admins" on the Platform Admin page itself).
  if(profile?.is_platform_admin) bottomNavTabs.push(['platformAdmin', tabIcon('admin'), 'Global Admin']);
  if(!['lobby','legend','faq','platformAdmin'].includes(activeTab)) activeTab = 'lobby';

  document.getElementById('navMount').innerHTML = `
    <nav class="app-nav">
      ${bottomNavTabs.map(([id,icon,label]) => `<div class="bnav-item ${activeTab===id?'active':''}" data-tab="${id}"><span class="icon">${icon}</span><span class="label">${label}</span></div>`).join('')}
    </nav>
  `;
  app.innerHTML = `
    <div id="ptrIndicator" class="ptr-indicator" aria-hidden="true"><div class="ptr-indicator-icon">${tabIcon('picks')}</div></div>
    <div class="app-header hub-header"><img class="brand-icon" src="images/degen-king-games-survivor.png" alt="Degen King Games"></div>
    <div id="tabBody" class="${navJustChanged ? 'tab-fade' : ''}"></div>
    <div class="footer-disclaimer">DKG is an independent, unofficial fantasy sports game -- not affiliated with the NFL or any other league, team, or player association.</div>
    ${footerLinksRowHTML('disclaimersLinkHub', [])}
  `;
  document.getElementById('signOutBtn').onclick = signOut;
  document.getElementById('disclaimersLinkHub').onclick = () => { jumpToDisclaimersFaq = true; activeTab = 'faq'; render(); };
  // 'lobby' is special-cased here (not just in the contest shell's copy of this same delegation)
  // so this exact wiring works unchanged wherever a data-tab="lobby" element shows up -- currently
  // just this shell's own Lobby tab (already a same-shell, no-op here since currentContestId is
  // already null), but this keeps both copies of the delegation identical rather than only
  // handling it on one side.
  document.querySelectorAll('[data-tab]').forEach(el => {
    el.onclick = () => {
      if(el.dataset.tab === 'lobby') currentContestId = null;
      activeTab = el.dataset.tab;
      render();
    };
  });

  const body = document.getElementById('tabBody');
  if(activeTab === 'lobby') return renderHub(body);
  if(activeTab === 'legend') return renderLegend(body);
  if(activeTab === 'faq') return renderFAQ(body);
  if(activeTab === 'platformAdmin') return renderPlatformAdmin(body);
}

// Registration open/closed is independent of contest lifecycle (status) --
// a commissioner can close registration to new players at any point (e.g.
// right when the contest starts) via commissioner_set_registration_open,
// without archiving or otherwise touching the contest's status. The Lobby
// card's status line is just that toggle's state, in plain words.
function contestCardHTML(c){
  const entry = myEntries[c.id];
  const currency = currencyForContest(c);
  const feeLabel = c.is_free ? 'Free' : (c.entry_fee ? `${fmtAmt(c.entry_fee)} ${currency.toUpperCase()} entry` : 'Paid');
  const statusLabel = c.registration_open ? 'Open' : 'Closed';
  // Player-reuse tag: most contests don't allow reusing the same NFL player across weeks
  // (unique_players_per_season defaults true) -- this makes that rule visible at a glance on
  // the Lobby card itself, rather than only inside a contest once joined. Sits right after the
  // game mode name since it's a property of how that mode was configured at creation.
  const reuseLabel = c.unique_players_per_season === false ? 'Reuse' : 'No Reuse';
  const pendingApprovalPill = !c.platform_approved ? `<span class="pill pending" style="margin-left:6px;">AWAITING APPROVAL</span>` : '';

  let actionHTML;
  if(entry){
    const statusPill = !entry.is_approved
      ? `<span class="pill pending">PENDING</span>`
      : entry.alive ? `<span class="pill alive">ALIVE</span>` : `<span class="pill elim">OUT WK ${entry.eliminated_week}</span>`;
    actionHTML = `<span class="row" style="gap:8px;width:auto;flex-wrap:nowrap;">${statusPill}<button class="small" data-enter="${c.id}">Enter</button></span>`;
  } else if(!c.platform_approved){
    actionHTML = `<button class="small secondary" disabled>Awaiting approval</button>`;
  } else if(c.status !== 'open' || !c.registration_open){
    actionHTML = `<button class="small secondary" disabled>Registration closed</button>`;
  } else {
    actionHTML = `<button class="small" data-join="${c.id}">Join</button>`;
  }

  return `
    <div class="lb-row" style="flex-wrap:wrap;">
      <span>
        <div style="color:var(--text);font-weight:700;">${esc(c.name)}${pendingApprovalPill}</div>
        <div style="color:var(--text-dim);font-size:12px;margin-top:2px;">${esc(String(c.sport).toUpperCase())} · ${esc(gameTypeLabel(c.game_type))} · ${reuseLabel} · ${feeLabel} · ${statusLabel}</div>
      </span>
      ${actionHTML}
    </div>`;
}

// Lobby's "Game Modes" reference card -- sits between "Your contests" and
// "Start a contest" so a player browsing open contests (e.g. seeing
// "Kingmaker Gauntlet" or "KnightFall Guillotine" on a card) has somewhere
// to learn how each mode plays before joining, without leaving the Lobby.
// Collapsed/expanded state persists per-device via localStorage (cleared
// on sign-out in signOut()) so it stays out of the way once someone's
// already read it, but starts expanded the first time. Reuses the same
// .faq-q/.faq-a plus-minus accordion look as the FAQ tab and the Picks
// tab's pick-history accordion, rather than introducing a new icon.
const GAME_MODES_COLLAPSED_KEY = 'dkg_gameModesCollapsed';
function loadGameModesCollapsed(){
  try { return localStorage.getItem(GAME_MODES_COLLAPSED_KEY) === '1'; } catch(e){ return false; }
}
function saveGameModesCollapsed(collapsed){
  try {
    if(collapsed) localStorage.setItem(GAME_MODES_COLLAPSED_KEY, '1');
    else localStorage.removeItem(GAME_MODES_COLLAPSED_KEY);
  } catch(e){ /* localStorage unavailable -- just won't persist, not fatal */ }
}
function gameModesCardHTML(){
  const open = !loadGameModesCollapsed();
  return `
    <div class="card">
      <div class="faq-q ${open ? 'open' : ''}" id="gmToggle">Game Modes</div>
      <div class="faq-a ${open ? 'open' : ''}" id="gmBody">
        ${GAME_TYPES.map(g => `
          <div class="gm-row">
            <img class="gm-icon" src="${g.img}" alt="${esc(g.label)} artwork" loading="lazy">
            <div style="min-width:0;">
              <div style="color:var(--text);font-weight:700;">${esc(g.label)}</div>
              <p style="margin-top:4px;">${esc(g.hubBlurb)}</p>
            </div>
          </div>`).join('')}
        <button class="muted-link" id="gmFaqLink" type="button" style="margin-top:6px;">Full rules in the FAQ →</button>
      </div>
    </div>`;
}
function wireGameModesCard(){
  const toggle = document.getElementById('gmToggle');
  const panel = document.getElementById('gmBody');
  if(toggle && panel){
    toggle.onclick = () => {
      const nowOpen = panel.classList.toggle('open');
      toggle.classList.toggle('open', nowOpen);
      saveGameModesCollapsed(!nowOpen);
    };
  }
  const faqLink = document.getElementById('gmFaqLink');
  if(faqLink) faqLink.onclick = () => { activeTab = 'faq'; render(); };
}

        </label>
      </div>
      <div id="cc_sponsorWrap" style="display:none;">
        <label id="cc_sponsorLabel">Sponsor prize amounts</label>
        <div class="row">
          <input id="cc_sponsorGrand" type="number" step="0.01" min="0" style="width:auto;flex:1;min-width:0;" placeholder="Grand prize"/>
          <input id="cc_sponsorWeekly" type="number" step="0.01" min="0" style="width:auto;flex:1;min-width:0;" placeholder="Weekly prize"/>
        </div>
        <div class="note" id="cc_sponsorNote"></div>
      </div>
      <label>Starts at week / Ends at week</label>
      <div class="row">
        <input id="cc_startWeek" type="number" min="1" max="18" style="width:auto;flex:1;min-width:0;" placeholder="e.g. 1"/>
        <input id="cc_endWeek" type="number" min="1" max="18" style="width:auto;flex:1;min-width:0;" placeholder="e.g. 18"/>
      </div>
      <div class="note">A contest doesn't have to run the whole season — e.g. start at week 8 and run through week 14 for a shorter side pool. Almost any start/end combination is fine as long as it's within weeks 1–18.</div>
      <div id="cc_wpewWrap" style="display:none;">

      <div class="note" id="cc_scWeeksPreview" style="display:none;"></div>

      <div class="note">Everything else uses this app's standard defaults, for now. Entry-fee split percentages, sponsor amounts, and the weekly-prize end week can all still be adjusted afterward from that contest's own Admin tab. Registration starts open — close it any time from the Admin tab once the contest is created.</div>

        <button class="small" id="cc_create" style="flex:1;">Create contest</button>

  const isFreeVal = () => document.getElementById('cc_currency').value === 'free';

  // structure" choice anymore. A Free contest has nothing BUT sponsor
  // money to offer, so its sponsor fields are always shown, optional,
  // left-blank-is-fine. A Paid (DGEN) contest already gets the pool split
  // by default, so its sponsor fields sit behind a checkbox to keep the
  // common no-sponsor case short.
  const updateSponsorVisibility = () => {
    const isFree = isFreeVal();
    document.getElementById('cc_feeWrap').style.display = isFree ? 'none' : 'block';
    document.getElementById('cc_feeLabel').textContent = `Entry fee (${document.getElementById('cc_currency').value.toUpperCase()})`;
    document.getElementById('cc_sponsorToggleWrap').style.display = isFree ? 'none' : 'block';
    const sponsorChecked = document.getElementById('cc_sponsorToggle').checked;
    document.getElementById('cc_sponsorWrap').style.display = (isFree || sponsorChecked) ? 'block' : 'none';
    document.getElementById('cc_sponsorLabel').textContent = isFree
      ? 'Sponsor prize amounts (leave blank if this is just for fun)'
      : 'Sponsor bonus amount (added on top of the entry-fee pool split)';
    document.getElementById('cc_sponsorNote').textContent = isFree
      ? "These are this contest's only prizes, since there's no entry fee -- leave a field at 0 to skip that prize. Adjustable later from the Admin tab."
      : 'Adds a flat bonus on top of whatever the entry-fee pool works out to -- e.g. entry fees fund the pool, and a sponsor also throws in 50,000 DGEN.';
    updateWpewVisibility();
    updateSponsorWeeklyPreview();
  };
  // The "weekly prize paid through week" field is relevant whenever a
  // weekly prize is actually in play: always for a Paid contest (the
  // pool's weekly split defaults on, still adjustable later in Admin),
  // and only for a Free contest once a nonzero sponsor weekly amount is
  // typed in -- a free contest with no sponsor money has nothing for
  // this field to describe. No default value is pre-filled either way;
  // cc_create refuses to submit a relevant-but-blank field rather than
  // silently falling back to the RPC's own default.
  //
  // This value is a real NFL week number (same numbering as Starts/Ends
  // at week above and contest_weeks.week_number in the schema), not a
  // count of weeks from the contest's own start -- a contest starting at
  // week 3 that wants prizes through week 6 enters "6" here, not "4" or
  // "3". Keeping it in the same numbering as start/end week (rather than
  // relative-to-start, the way the second-chance window is) means it can
  // be validated directly against the start/end range below, and the
  // per-week prize split on the Prizes tab can work out the real number
  // of paid weeks correctly for a contest that doesn't start at week 1.
  const updateWpewNote = () => {
    const isFree = isFreeVal();
    const start = parseInt(document.getElementById('cc_startWeek').value);
    const end = parseInt(document.getElementById('cc_endWeek').value);
    const range = (start && end) ? `weeks ${start}–${end}` : 'the start/end week range above';
    const base = isFree
      ? 'This is for the sponsored weekly prize above.'
      : 'Weekly prizes from the entry-fee pool are on by default (adjustable later in Admin) -- this also covers any sponsor weekly bonus above.';
    document.getElementById('cc_wpewNote').textContent =
      `${base} Enter the real NFL week number this contest should stop paying it after -- must fall within ${range}.`;
  };
  const updateWpewVisibility = () => {
    const isFree = isFreeVal();
    const sponsorWeeklyVal = parseFloat(document.getElementById('cc_sponsorWeekly').value) || 0;
    const relevant = !isFree || sponsorWeeklyVal > 0;
    document.getElementById('cc_wpewWrap').style.display = relevant ? 'block' : 'none';
    updateWpewNote();
  };
  // Live preview so "Weekly prize" is never mistaken for a per-week amount
  // -- it's always the TOTAL to be split evenly across the paid weeks. For
  // a Free contest this preview is exact (sponsor money is the only
  // component). For a Paid contest the pool's own weekly cut isn't
  // knowable yet at creation time (it grows as players are approved), so
  // only the sponsor's own per-week slice is previewed here -- the Prizes
  // tab shows the real combined total once entries start coming in.
  const updateSponsorWeeklyPreview = () => {
    const isFree = isFreeVal();
    const sponsorWeeklyVal = parseFloat(document.getElementById('cc_sponsorWeekly').value) || 0;
    const start = parseInt(document.getElementById('cc_startWeek').value);
    const wpew = parseInt(document.getElementById('cc_wpew').value);
    const el = document.getElementById('cc_sponsorWeeklyPreview');
    if(!sponsorWeeklyVal || !start || !wpew || wpew < start){ el.textContent = ''; return; }
    const weeks = wpew - start + 1;
    const perWeek = sponsorWeeklyVal / weeks;
    el.textContent = isFree
      ? `= ${fmtAmt(perWeek)} DGEN per week (weeks ${start}–${wpew}, ${weeks} week${weeks === 1 ? '' : 's'})`
      : `+ ${fmtAmt(perWeek)} DGEN per week from the sponsor, on top of the pool's own weekly cut (weeks ${start}–${wpew})`;
  };
  document.getElementById('cc_currency').onchange = updateSponsorVisibility;
  document.getElementById('cc_sponsorToggle').onchange = updateSponsorVisibility;
  document.getElementById('cc_sponsorWeekly').oninput = () => { updateWpewVisibility(); updateSponsorWeeklyPreview(); };
  document.getElementById('cc_startWeek').oninput = () => { updateWpewNote(); updateSponsorWeeklyPreview(); };
  document.getElementById('cc_endWeek').oninput = updateWpewNote;
  document.getElementById('cc_wpew').oninput = updateSponsorWeeklyPreview;
  // Live resolved range for the second-chance window, once a start week is entered.
  const updateScWeeksPreview = () => {
    const n = parseInt(document.getElementById('cc_scWeeks').value) || 0;
    const start = parseInt(document.getElementById('cc_startWeek').value);
    const el = document.getElementById('cc_scWeeksPreview');
    const weeksText = start ? secondChanceWeeksText(n, start) : '';
    el.style.display = weeksText ? 'block' : 'none';
    el.textContent = weeksText ? `= a one-time rebuy for anyone eliminated in NFL ${weeksText}.` : '';
  };
  document.getElementById('cc_scWeeks').oninput = updateScWeeksPreview;
  document.getElementById('cc_startWeek').addEventListener('input', updateScWeeksPreview);
  updateSponsorVisibility();
  // Eliminator-only fields (player-reuse toggle) and Survivor-only fields
  // (weekly threshold) show/hide based on the game-mode pick -- both are
  // locked in at creation, so this is the only place either one is set.
  // (isEliminator/isEliminator-named fields keep the original code
  // terminology; only the copy shown to players uses the branded names.)
  const updateGameTypeFields = () => {
    const gt = document.getElementById('cc_gameType').value;
    const isEliminator = gt === 'eliminator';
    const mode = GAME_TYPES.find(g => g.value === gt);
    document.getElementById('cc_reuseWrap').style.display = isEliminator ? 'flex' : 'none';
    document.getElementById('cc_thresholdWrap').style.display = isEliminator ? 'none' : 'block';
    // Short reminder only -- the full explanation now lives on the Lobby's
    // Game Modes card (gameModesCardHTML() above), which someone has
    // presumably already seen before reaching this form.
    document.getElementById('cc_gameTypeNote').textContent = mode ? `${mode.label}: ${mode.reminder}` : '';
  };
  document.getElementById('cc_gameType').onchange = updateGameTypeFields;
  updateGameTypeFields();
  document.getElementById('cc_cancel').onclick = () => { area.innerHTML = ''; };
  document.getElementById('cc_create').onclick = guard(async () => {
    const name = document.getElementById('cc_name').value.trim();
    if(!name){ showBanner('Contest name is required.'); return; }
    const sport = document.getElementById('cc_sport').value;
    const gameType = document.getElementById('cc_gameType').value;
    const currencyVal = document.getElementById('cc_currency').value;
    const isFree = currencyVal === 'free';
    const fee = isFree ? null : (parseFloat(document.getElementById('cc_fee').value) || null);
    const sponsorGrand = parseFloat(document.getElementById('cc_sponsorGrand').value) || 0;
    const sponsorWeekly = parseFloat(document.getElementById('cc_sponsorWeekly').value) || 0;
    const threshold = parseFloat(document.getElementById('cc_threshold').value) || 100;
    // No default is pre-filled on either field -- a contest's actual
    // length should always be a conscious choice, not a silent "runs the
    // whole season" assumption for someone who only meant to set one end
    // of a shorter/mid-season pool.
    const startWeek = parseInt(document.getElementById('cc_startWeek').value);
    const endWeek = parseInt(document.getElementById('cc_endWeek').value);
    if(!startWeek || startWeek < 1 || startWeek > 18 || !endWeek || endWeek < 1 || endWeek > 18){
      showBanner('Enter a start week and end week (1–18) for this contest.');
      return;
    }
    if(endWeek < startWeek){ showBanner('End week has to be the same as or after the start week.'); return; }
    const scWeeks = parseInt(document.getElementById('cc_scWeeks').value) || 0;
    const uniqueReuse = gameType === 'eliminator' ? document.getElementById('cc_reuse').checked : true;
    // A weekly prize is in play for every Paid contest (its pool split
    // defaults on) and for any Free contest with a nonzero sponsor weekly
    // amount -- in both cases the commissioner has to pick a last week for
    // it here rather than the app silently defaulting to one. The value is
    // a real NFL week number (see the comment above updateWpewNote), so it
    // also has to actually fall within the contest's own start/end range
    // -- a value outside that range can't mean anything real.
    const wpewRequired = !isFree || sponsorWeekly > 0;
    const wpewRaw = parseInt(document.getElementById('cc_wpew').value);
    if(wpewRequired && (!wpewRaw || wpewRaw < startWeek || wpewRaw > endWeek)){
      showBanner(`Enter the NFL week (between ${startWeek} and ${endWeek}) a weekly prize should be paid through -- or clear the weekly prize amount above if this contest isn't offering one.`);
      return;
    }
    const weeklyPrizeEndWeek = wpewRequired ? wpewRaw : null;
    const { data, error } = await sb.rpc('create_contest', {
      p_name: name,
      p_sport: sport,
      p_game_type: gameType,
      p_is_free: isFree,
      p_entry_fee: fee,
      p_weekly_threshold: threshold,
      p_weekly_prize_end_week: weeklyPrizeEndWeek,
      p_second_chance_window_weeks: scWeeks,
      p_start_week: startWeek,
      p_end_week: endWeek,
      p_currency: 'dgen',
      p_unique_players_per_season: uniqueReuse,
      p_sponsor_grand_prize: sponsorGrand,
      p_sponsor_weekly_prize: sponsorWeekly
    });
    if(error){ showBanner(error.message); return; }
    await Promise.all([loadContests(), loadMyEntries()]);
    currentContestId = data;
    activeTab = 'home';
    await loadContestData();
    showBanner(`"${name}" created — you're its commissioner. It'll be visible to other players once a Global Admin approves it.`);
    render();
  });
}

            <button class="small warn" data-padmin-archive="${c.id}" data-name="${esc(c.name)}">Archive</button>
