async function renderAdmin(body){
  body.innerHTML = `<div class="center">Loading…</div>`;
  const [{ data: contestRow }, { data: entryRows }, { data: contestWeekRows }, { count: approvedCount }] = await Promise.all([
    sb.from('contests').select('*').eq('id', currentContestId).single(),
    sb.from('contest_entries').select('profile_id, is_approved, alive, eliminated_week, second_chance_used, second_chance_requested_at, is_commissioner, profiles!inner(display_name)').eq('contest_id', currentContestId),
    sb.from('contest_weeks').select('week_number, is_finalized').eq('contest_id', currentContestId).order('week_number'),
    // Approved-entrant count, so the settings form below can show a live
    // preview of the actual weekly-prize total (pool cut + sponsor bonus)
    // divided across the paid weeks -- the same math the Prizes tab uses.
    sb.from('contest_entries').select('profile_id', { count: 'exact', head: true }).eq('contest_id', currentContestId).eq('is_approved', true)
  ]);
  currentContest = contestRow;
  const isEliminator = contestRow.game_type === 'eliminator';
  const isFree = contestRow.is_free;
  // weekly_prize_end_week is a real NFL week number (see the Create form's
  // cc_wpew comment), so its valid range is this contest's own start/end
  // week -- read straight off contest_weeks (already fetched above, in
  // order) rather than assuming week 1.
  const contestStartWeek = contestWeekRows?.[0]?.week_number || 1;
  const contestEndWeek = contestWeekRows?.[contestWeekRows.length - 1]?.week_number || 18;
  const players = (entryRows || []).map(p => ({
    id: p.profile_id, display_name: p.profiles.display_name, is_approved: p.is_approved,
    alive: p.alive, eliminated_week: p.eliminated_week, second_chance_used: p.second_chance_used,
    second_chance_requested_at: p.second_chance_requested_at, is_commissioner: p.is_commissioner
  })).sort((a,b) => a.display_name.localeCompare(b.display_name));

  // Which week's score-entry grid to show. Every week this contest has actually reached
  // (<= currentWeek, so no empty future weeks) is selectable via the pill row below, defaulting
  // to the oldest still-unfinalized one (the one that actually needs attention) -- once it's
  // finalized it rolls off that default and
  // the next open week takes its place, per the reset of adminScoreWeek in the finalize handler
  // below. Already-finalized weeks stay reachable too, for fixing a mistake after the fact.
  const reachedWeeks = (contestWeekRows || []).filter(w => !currentWeek || w.week_number <= currentWeek.week_number);
  if(adminScoreWeek === null || !reachedWeeks.some(w => w.week_number === adminScoreWeek)){
    const firstOpen = reachedWeeks.find(w => !w.is_finalized);
    adminScoreWeek = firstOpen ? firstOpen.week_number : (reachedWeeks.length ? reachedWeeks[reachedWeeks.length - 1].week_number : (currentWeek ? currentWeek.week_number : 1));
  }
  const weekForScores = adminScoreWeek;
  const isFinalized = reachedWeeks.find(w => w.week_number === weekForScores)?.is_finalized ?? false;

  let scoresTableHTML;
  let computedCount = 0;
  if(isFinalized){
    const { data: picksThatWeek } = await sb.from('picks_with_scores')
      .select('player_id, score, result, profiles(display_name)').eq('contest_id', currentContestId).eq('week_number', weekForScores);
    const totals = {};
    (picksThatWeek || []).forEach(p => {
      if(!totals[p.player_id]) totals[p.player_id] = { name: p.profiles?.display_name || '', total: 0, result: p.result };
      totals[p.player_id].total += Number(p.score) || 0;
    });
    const rows = Object.values(totals).sort((a,b) => b.total - a.total);
    scoresTableHTML = `
      <div class="tablewrap"><table>
        <tr><th>Player</th><th>Total</th><th>Result</th></tr>
        ${rows.map(r => `<tr><td>${esc(r.name)}</td><td>${fmtPts(r.total)}</td><td><span class="pill ${r.result==='pass'?'alive':'elim'}">${r.result==='pass'?'PASS':'FAIL'}</span></td></tr>`).join('')}
      </table></div>
      <div class="note">This week is finalized — showing final totals. Editing scores or re-finalizing (after fixing a mistake) is still possible below.</div>`;
  } else {
    // A real NFL player's score for the week is one fact, shared globally
    // across every contest that used him -- not one fact per entrant who
    // drafted him -- so this groups by nfl_player_id, not by entrant, and
    // the admin enters each player's score exactly once no matter how many
    // people in this contest picked him. `commissioner_set_player_score`
    // then applies it to every pick that used him, in any contest.
    // `source` (added for automated scoring) distinguishes a score
    // sync-player-stats auto-filled from nflverse data ('computed', not yet
    // reviewed) from one the admin has actually looked at and set/edited
    // ('manual') -- see survivor-fantasy-setup.md's automated-scoring notes.
    const [{ data: picksForWeek }, { data: weekScores }] = await Promise.all([
      sb.from('picks').select('nfl_player_id, nfl_player_name, position, team, profiles(display_name)').eq('contest_id', currentContestId).eq('week_number', weekForScores),
      sb.from('week_player_scores').select('nfl_player_id, score, source').eq('week_number', weekForScores)
    ]);
    const scoreByNflId = {};
    (weekScores || []).forEach(s => { scoreByNflId[s.nfl_player_id] = { score: s.score, source: s.source }; });

    const byNflPlayer = {};
    (picksForWeek || []).forEach(pk => {
      if(!byNflPlayer[pk.nfl_player_id]){
        const existing = scoreByNflId[pk.nfl_player_id];
        byNflPlayer[pk.nfl_player_id] = {
          name: pk.nfl_player_name, position: pk.position, team: pk.team,
          score: existing?.score ?? null, source: existing?.source ?? null, pickers: []
        };
      }
      byNflPlayer[pk.nfl_player_id].pickers.push(pk.profiles?.display_name || '');
    });
    const POSITION_ORDER = ['QB','RB','WR','TE'];
    const playerRows = Object.entries(byNflPlayer).map(([nflPlayerId, v]) => ({ nflPlayerId, ...v }))
      .sort((a, b) => (POSITION_ORDER.indexOf(a.position) - POSITION_ORDER.indexOf(b.position)) || a.name.localeCompare(b.name));
    computedCount = playerRows.filter(pr => pr.source === 'computed').length;

    scoresTableHTML = playerRows.length ? `
      <div class="scores-grid">
        ${playerRows.map(pr => `
          <div class="player-score-card">
            <div class="player-score-head">
              <span class="player-score-name">${esc(pr.name)} <span class="player-score-tag">${pr.position}${pr.team ? ' · ' + esc(pr.team) : ''}</span></span>
              <span class="row" style="gap:6px;width:auto;flex-wrap:nowrap;">
                ${pr.source === 'computed' ? '<span class="est-pill" title="Auto-filled from nflverse data, not yet reviewed">Est.</span>' : ''}
                <input type="number" step="0.1" class="scoreInput" data-nfl-id="${pr.nflPlayerId}" value="${pr.score ?? ''}"/>
              </span>
            </div>
            <div class="player-score-pickers">Picked by: ${pr.pickers.map(esc).join(', ')}</div>
          </div>`).join('')}
      </div>` : '<p>No picks submitted for this week yet.</p>';
  }

  // Second-chance rebuy requests pending confirmation: a player requests
  // this themselves from their Contest Home tab; this
  // card is the "notice" that surfaces it here so it isn't missed among
  // the rest of the player list. Confirming (below) calls the same
  // commissioner_grant_second_chance RPC as always, which also
  // requires this request to exist server-side.
  const pendingSecondChance = players.filter(p => p.second_chance_requested_at && !p.second_chance_used);
  const pendingSecondChanceHTML = pendingSecondChance.length ? `
    <div class="card" style="border-color:var(--pending);">
      <h3>Pending second-chance requests (${pendingSecondChance.length})</h3>
      <p>Verify they've re-paid the entry fee, then confirm below.</p>
      ${pendingSecondChance.map(p => `
        <div class="lb-row">
          <span>${esc(p.display_name)} <span class="pill elim">OUT WK ${p.eliminated_week}</span></span>
          <button class="small" data-secondchance="${p.id}">Confirm rebuy</button>
        </div>`).join('')}
    </div>` : '';

  const soleEntrant = players.length <= 1;

  body.innerHTML = `
    <div class="card" style="${contestRow.registration_open ? 'border-color:var(--alive);' : 'border-color:var(--elim);'}">
      <div class="row">
        <h3>Registration</h3>
        <span class="pill ${contestRow.registration_open ? 'alive' : 'elim'}">${contestRow.registration_open ? 'OPEN' : 'CLOSED'}</span>
      </div>
      <p>Controls whether new players can join this contest — doesn't affect anyone already in.</p>
      <button class="small ${contestRow.registration_open ? 'secondary' : ''}" id="toggleRegistrationBtn" style="margin-top:10px;">${contestRow.registration_open ? 'Close registration' : 'Open registration'}</button>
    </div>

    <div class="card">
      <h3>Contest settings</h3>
      <div class="note">${esc(String(contestRow.sport).toUpperCase())} · ${esc(gameTypeLabel(contestRow.game_type))}${isEliminator ? (contestRow.unique_players_per_season === false ? ' · players can be reused week to week' : ' · each player usable once all season') : ''} — sport, game mode, weeks, and player-reuse are locked in at creation and can't be changed here. Archive this contest and start a new one to change any of those.</div>
      ${isEliminator ? '' : `
      <label>Weekly point threshold to survive</label>
      <input id="s_threshold" type="number" value="${contestRow.weekly_threshold}" placeholder="Threshold"/>`}
      <label>Weekly prizes through week (NFL week ${contestStartWeek}–${contestEndWeek})</label>
      <input id="s_wpew" type="number" min="${contestStartWeek}" max="${contestEndWeek}" value="${contestRow.weekly_prize_end_week ?? ''}" placeholder="Through wk"/>
      ${!isFree ? `
      <label>Entry fee (DGEN)</label>
      <input id="s_fee" type="number" step="0.01" value="${contestRow.entry_fee ?? ''}" placeholder="Fee"/>
      <label>Entry-fee pool split — Grand % / Weekly % / Organizer %</label>
      <div class="row">
        <input id="s_grand" type="number" value="${contestRow.grand_pct}" style="width:auto;flex:1;min-width:0;" placeholder="Grand %"/>
        <input id="s_week" type="number" value="${contestRow.weekly_pct}" style="width:auto;flex:1;min-width:0;" placeholder="Weekly %"/>
        <input id="s_org" type="number" value="${contestRow.organizer_pct}" style="width:auto;flex:1;min-width:0;" placeholder="Organizer %"/>
      </div>
      <div class="note">Splits the entry-fee pool as it grows with approved entrants. Doesn't include the sponsor bonus below.</div>` : ''}
      <label>${isFree ? 'Sponsor prize amounts (leave a field blank if this is just for fun)' : 'Sponsor bonus amount (added on top of the pool split above)'}</label>
      <div class="row">
        <input id="s_sponsorGrand" type="number" step="0.01" value="${contestRow.sponsor_grand_prize || ''}" style="width:auto;flex:1;min-width:0;" placeholder="Grand prize"/>
        <input id="s_sponsorWeekly" type="number" step="0.01" value="${contestRow.sponsor_weekly_prize || ''}" style="width:auto;flex:1;min-width:0;" placeholder="Weekly prize"/>
      </div>
      <div class="note" id="s_sponsorWeeklyPreview"></div>
      <button id="saveSettings" style="margin-top:14px;">Save contest settings</button>
    </div>

    ${pendingSecondChanceHTML}

    <div class="card">
      <h3>Players</h3>
      ${(() => {
        const commissionerCount = players.filter(x => x.is_commissioner).length;
        return players.map(p => {
          const isLastCommissioner = p.is_commissioner && commissionerCount <= 1;
          // Housekeeping pills (elimination week, pending-rebuy) are deliberately NOT repeated here --
          // they already live on the "Pending second-chance requests" card above and (for elimination)
          // aren't needed to operate this list at all. Keeping this row down to name + used-second-chance
          // icon + Admin tag is what keeps it from overlapping/wrapping badly on a narrow phone screen.
          const nameBits = [esc(p.display_name)];
          if(p.second_chance_used) nameBits.push(secondChanceIconHTML());
          if(p.is_commissioner) nameBits.push('<span class="pill">Admin</span>');
          return `
          <div class="lb-row admin-player-row">
            <span class="name-block">${nameBits.join(' ')}</span>
            <span class="row actions-block" style="gap:6px;width:auto;">
              <button class="small ${p.is_approved ? 'secondary' : ''}" data-approve="${p.id}" data-current="${p.is_approved}">${p.is_approved ? 'Approved' : 'Approve'}</button>
              <button class="small secondary" data-admin="${p.id}" data-current="${p.is_commissioner}" ${isLastCommissioner ? 'disabled title="Can\'t revoke the last remaining admin"' : ''}>${p.is_commissioner ? 'Revoke admin' : 'Make admin'}</button>
            </span>
          </div>`;
        }).join('') || '<p>No players yet.</p>';
      })()}
    </div>

    <div class="card">
      ${reachedWeeks.length > 1 ? `
        <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:10px;">
          ${reachedWeeks.map(w => `<button type="button" class="small ${w.week_number === weekForScores ? '' : 'secondary'}" data-admin-week="${w.week_number}" style="width:auto;">Wk ${w.week_number}${w.is_finalized ? ' ✓' : ''}</button>`).join('')}
        </div>` : ''}
      <div class="row">
        <h3>Week ${weekForScores} scores</h3>
        ${!isFinalized ? '<button class="small secondary" id="refreshScoresBtn" style="width:auto;">Refresh scores now</button>' : ''}
      </div>
      ${!isFinalized && computedCount ? `<p>${computedCount} score${computedCount === 1 ? '' : 's'} below ${computedCount === 1 ? 'is' : 'are'} auto-filled from live NFL stats (tagged "Est.") and haven't been reviewed yet — double-check before finalizing.</p>` : ''}
      ${!isFinalized ? "<p class=\"estimate-note\">A score still blank a while after that player's game has ended usually means we couldn't automatically match them — enter it manually below. (Someone who played but recorded nothing gets auto-filled as 0, not left blank.)</p>" : ''}
      ${scoresTableHTML}
      ${!isFinalized ? '<button id="saveScores" style="margin-top:12px;">Save scores</button>' : ''}
      <button id="finalizeWeek" style="margin-top:10px;">${isFinalized ? 'Re-finalize' : 'Finalize'} week ${weekForScores}</button>
      ${isEliminator ? "<p class=\"estimate-note\">Finalizing works out how many to cut this week automatically (based on who's still alive and how many weeks remain) and cuts whoever has the lowest score(s), breaking ties by cumulative season points.</p>" : ''}
      <div id="finalizeConfirm"></div>
    </div>

    <div class="card" style="border-color:var(--elim);">
      <h3>Danger zone</h3>
      <p>Archiving hides this contest from the Hub for everyone — no data is deleted, and a Global Admin can restore it later. Deleting is only available while nobody besides you has joined or picked in this contest, and permanently erases it.</p>
      <div class="row" style="gap:8px;margin-top:10px;">
        <button class="small warn" id="archiveContestBtn" style="flex:1;">Archive contest</button>
        <button class="small danger" id="deleteContestBtn" style="flex:1;" ${soleEntrant ? '' : 'disabled title="Other players have joined — archive instead"'}>Delete contest</button>
      </div>
      <div id="dangerZoneConfirm"></div>
    </div>
  `;

  // Live preview of the actual per-week prize amount, using this contest's
  // real entry fee/percentages/approved-entrant count (same formula as the
  // Prizes tab) plus whatever sponsor amount is currently typed in -- this
  // is exactly where "Weekly prize" used to read as ambiguous (a per-week
  // amount vs. the total split across weeks); showing the real per-week
  // number live, right here, removes the ambiguity instead of just
  // explaining it in words.
  const updateSponsorWeeklyPreview = () => {
    const wpewRaw = parseInt(document.getElementById('s_wpew').value);
    const weeks = (wpewRaw && wpewRaw >= contestStartWeek) ? (wpewRaw - contestStartWeek + 1) : null;
    const sponsorWeekly = parseFloat(document.getElementById('s_sponsorWeekly').value) || 0;
    let poolWeekly = 0;
    if(!isFree){
      const fee = parseFloat(document.getElementById('s_fee').value) || 0;
      const weekPct = parseFloat(document.getElementById('s_week').value) || 0;
      poolWeekly = fee * (approvedCount || 0) * weekPct / 100;
    }
    const totalWeekly = poolWeekly + sponsorWeekly;
    const el = document.getElementById('s_sponsorWeeklyPreview');
    if(!weeks || totalWeekly <= 0){ el.textContent = ''; return; }
    const perWeek = totalWeekly / weeks;
    el.textContent = isFree
      ? `= ${fmtAmt(perWeek)} DGEN per week (weeks ${contestStartWeek}–${wpewRaw}, ${weeks} week${weeks === 1 ? '' : 's'})`
      : `≈ ${fmtAmt(perWeek)} DGEN per week total (${fmtAmt(poolWeekly)} from the pool at today's ${approvedCount || 0} approved entrant${(approvedCount || 0) === 1 ? '' : 's'} + ${fmtAmt(sponsorWeekly)} sponsor bonus) — the pool portion grows as more players are approved.`;
  };
  document.getElementById('s_wpew').oninput = updateSponsorWeeklyPreview;
  document.getElementById('s_sponsorWeekly').oninput = updateSponsorWeeklyPreview;
  if(!isFree){
    document.getElementById('s_fee').oninput = updateSponsorWeeklyPreview;
    document.getElementById('s_week').oninput = updateSponsorWeeklyPreview;
  }
  updateSponsorWeeklyPreview();

  document.getElementById('toggleRegistrationBtn').onclick = guard(async () => {
    const { error } = await sb.rpc('commissioner_set_registration_open', { p_contest_id: currentContestId, p_open: !contestRow.registration_open });
    if(error){ showBanner(error.message); return; }
    showBanner(contestRow.registration_open ? 'Registration closed.' : 'Registration opened.');
    renderAdmin(body);
  });

  document.querySelectorAll('[data-admin-week]').forEach(btn => {
    btn.onclick = () => { adminScoreWeek = Number(btn.dataset.adminWeek); renderAdmin(body); };
  });

  document.querySelectorAll('[data-secondchance]').forEach(btn => {
    btn.onclick = guard(async () => {
      const { error } = await sb.rpc('commissioner_grant_second_chance', { p_contest_id: currentContestId, p_player_id: btn.dataset.secondchance });
      if(error) throw error;
      showBanner('Second chance granted.');
      renderAdmin(body);
    });
  });

  document.getElementById('saveSettings').onclick = guard(async () => {
    if(!isEliminator){
      await sb.rpc('commissioner_update_weekly_threshold', { p_contest_id: currentContestId, p_threshold: parseFloat(document.getElementById('s_threshold').value) });
    }
    const sponsorWeeklyVal = parseFloat(document.getElementById('s_sponsorWeekly').value) || 0;
    // Same rule as the Create Contest form: a weekly prize is in play for
    // every Paid contest (the pool's weekly split defaults on), or a Free
    // contest with a nonzero sponsor weekly amount, and its "through week"
    // value is a real NFL week number that has to fall within this
    // contest's own start/end range (contestStartWeek/contestEndWeek,
    // computed above from contest_weeks).
    const wpewRequired = !isFree || sponsorWeeklyVal > 0;
    const wpewRaw = parseInt(document.getElementById('s_wpew').value);
    if(wpewRequired && (!wpewRaw || wpewRaw < contestStartWeek || wpewRaw > contestEndWeek)){
      showBanner(`Enter the NFL week (between ${contestStartWeek} and ${contestEndWeek}) a weekly prize should be paid through -- or clear the sponsor weekly amount if this contest isn't offering one.`);
      return;
    }
    await sb.rpc('commissioner_update_prize_settings', {
      p_contest_id: currentContestId,
      p_entry_fee: isFree ? null : (parseFloat(document.getElementById('s_fee').value) || null),
      p_organizer_pct: isFree ? contestRow.organizer_pct : parseFloat(document.getElementById('s_org').value),
      p_weekly_pct: isFree ? contestRow.weekly_pct : parseFloat(document.getElementById('s_week').value),
      p_grand_pct: isFree ? contestRow.grand_pct : parseFloat(document.getElementById('s_grand').value),
      p_weekly_prize_end_week: wpewRequired ? wpewRaw : null,
      p_sponsor_grand_prize: parseFloat(document.getElementById('s_sponsorGrand').value) || 0,
      p_sponsor_weekly_prize: sponsorWeeklyVal
    });
    renderAdmin(body);
  });

  document.querySelectorAll('[data-approve]').forEach(btn => {
    btn.onclick = guard(async () => {
      const id = btn.dataset.approve;
      const current = btn.dataset.current === 'true';
      const { error } = await sb.rpc('commissioner_set_entry_approved', { p_contest_id: currentContestId, p_player_id: id, p_approved: !current });
      if(error) throw error;
      renderAdmin(body);
    });
  });

  document.querySelectorAll('[data-admin]').forEach(btn => {
    btn.onclick = guard(async () => {
      const id = btn.dataset.admin;
      const current = btn.dataset.current === 'true';
      const { error } = await sb.rpc(current ? 'commissioner_revoke_admin' : 'commissioner_grant_admin', { p_contest_id: currentContestId, p_player_id: id });
      if(error) throw error;
      showBanner(current ? 'Admin revoked.' : 'Admin granted.');
      renderAdmin(body);
    });
  });

  const refreshScoresBtn = document.getElementById('refreshScoresBtn');
  if(refreshScoresBtn){
    refreshScoresBtn.onclick = guard(async () => {
      const { error } = await sb.rpc('commissioner_trigger_score_sync');
      if(error) throw error;
      showBanner('Refresh requested — reload this tab in a few seconds to see updated scores.');
    });
  }
  const saveScoresBtn = document.getElementById('saveScores');
  if(saveScoresBtn){
    saveScoresBtn.onclick = guard(async () => {
      const inputs = document.querySelectorAll('.scoreInput');
      for(const inp of inputs){
        const val = inp.value === '' ? null : parseFloat(inp.value);
        const { error } = await sb.rpc('commissioner_set_player_score', { p_week: weekForScores, p_nfl_player_id: inp.dataset.nflId, p_score: val });
        if(error) throw error;
      }
      showBanner('Scores saved.');
      renderAdmin(body);
    });
  }
  const finalizeBtn = document.getElementById('finalizeWeek');
  if(finalizeBtn){
    finalizeBtn.onclick = () => {
      document.getElementById('finalizeConfirm').innerHTML = `
        <div class="confirm-box">
          <p style="color:var(--text);">Finalize week ${weekForScores}? ${isEliminator ? 'This cuts whoever has the lowest score(s) this week, or anyone with an incomplete team.' : 'This eliminates anyone below threshold or with an incomplete team.'}</p>
          <div class="row" style="gap:8px;margin-top:6px;">
            <button class="small secondary" id="cancelFinalize" style="flex:1;">Cancel</button>
            <button class="small danger" id="confirmFinalize" style="flex:1;">Confirm finalize</button>
          </div>
        </div>`;
      document.getElementById('cancelFinalize').onclick = () => { document.getElementById('finalizeConfirm').innerHTML = ''; };
      document.getElementById('confirmFinalize').onclick = guard(async () => {
        const { error } = await sb.rpc('commissioner_finalize_week', { p_contest_id: currentContestId, p_week: weekForScores });
        if(error) throw error;
        showBanner(`Week ${weekForScores} finalized.`);
        await loadContestData();
        render();
      });
    };
  }

  // Archiving from the per-contest Admin tab now asks for confirmation first, same as
  // Delete right next to it -- previously a single click here archived the contest
  // immediately, which was an easy mis-click since it sits right beside the destructive
  // Delete button.
  document.getElementById('archiveContestBtn').onclick = () => {
    document.getElementById('dangerZoneConfirm').innerHTML = `
      <div class="confirm-box">
        <p style="color:var(--text);">Archive "${esc(currentContest?.name || 'this contest')}"? This hides it from the Hub for everyone — no data is deleted, and a Global Admin can restore it later.</p>
        <div class="row" style="gap:8px;margin-top:6px;">
          <button class="small secondary" id="cancelArchive" style="flex:1;">Cancel</button>
          <button class="small warn" id="confirmArchive" style="flex:1;">Archive contest</button>
        </div>
      </div>`;
    document.getElementById('cancelArchive').onclick = () => { document.getElementById('dangerZoneConfirm').innerHTML = ''; };
    document.getElementById('confirmArchive').onclick = guard(async () => {
      const { error } = await sb.rpc('commissioner_archive_contest', { p_contest_id: currentContestId });
      if(error){ showBanner(error.message); return; }
      showBanner("Contest archived — it's hidden from the Hub. A Global Admin can restore it if needed.");
      currentContestId = null; activeTab = 'hub';
      await Promise.all([loadContests(), loadMyEntries()]);
      render();
    });
  };
  const deleteContestBtn = document.getElementById('deleteContestBtn');
  if(deleteContestBtn && !deleteContestBtn.disabled){
    deleteContestBtn.onclick = () => {
      document.getElementById('dangerZoneConfirm').innerHTML = `
        <div class="confirm-box">
          <p style="color:var(--text);">Permanently delete "${esc(currentContest?.name || 'this contest')}"? This can't be undone — all contest data will be erased. This only works if nobody else has joined or picked yet.</p>
          <div class="row" style="gap:8px;margin-top:6px;">
            <button class="small secondary" id="cancelDelete" style="flex:1;">Cancel</button>
            <button class="small danger" id="confirmDelete" style="flex:1;">Delete permanently</button>
          </div>
        </div>`;
      document.getElementById('cancelDelete').onclick = () => { document.getElementById('dangerZoneConfirm').innerHTML = ''; };
      document.getElementById('confirmDelete').onclick = guard(async () => {
        const { error } = await sb.rpc('commissioner_delete_contest', { p_contest_id: currentContestId });
        if(error){ showBanner(error.message); return; }
        showBanner('Contest deleted.');
        currentContestId = null; activeTab = 'hub';
        await Promise.all([loadContests(), loadMyEntries()]);
        render();
      });
    };
  }
}

// ---------- INIT ----------
// Supabase's client re-fires onAuthStateChange for more than a fresh
// sign-in -- also on background token refreshes and tab refocus. Tracking
// which user's data is loaded (lastLoadedUserId) tells "genuinely a new
// sign-in" apart from "same user, session object just refreshed" -- only
// the former resets the screen back to the Hub and reloads everything.
//
// The automatic INITIAL_SESSION event (fired once on subscribe, reflecting
// whatever session was already restored from storage) is skipped here --
// the init IIFE below already handles that case with its own getSession()
// call, so both firing would double the network work before the Hub
// screen replaces "Loading…". Every later, real auth change (sign-in,
// sign-out, token refresh) still reaches this listener as normal.
let lastLoadedUserId = null;
sb.auth.onAuthStateChange(async (event, s) => {
  if(event === 'INITIAL_SESSION') return;
  if(s){
    const isNewUser = s.user.id !== lastLoadedUserId;
    session = s;
    if(isNewUser){
      lastLoadedUserId = s.user.id;
      currentContestId = null; activeTab = 'hub';
      await loadAllData();
      await restoreNavState();
      screen = 'app';
      render();
    }
    // Same user, same session (a token refresh, or the tab regaining focus)
    // -- just keep the refreshed session object, don't touch what's on screen.
  } else {
    lastLoadedUserId = null;
  }
});

(async () => {
  const { data: { session: existing } } = await sb.auth.getSession();
  if(existing){
    session = existing;
    lastLoadedUserId = existing.user.id;
    currentContestId = null; activeTab = 'hub';
    await loadAllData();
    await restoreNavState(); // picks this tab back up where it left off, if a reload is what brought us here
    screen = 'app';
  } else {
    screen = 'auth';
  }
  render();
})();

</script>
