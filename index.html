// ---------- CONTEST SHELL (inside a specific contest) ----------
function renderContestShell(){
  const picksBadge = (currentWeek && currentEntry?.alive && currentEntry?.is_approved && lineupSlots.length)
    ? ` ${myPicks.length}/${lineupSlots.length}` : '';
  // Nav carries the 4 primary, time-sensitive tabs plus Lobby (a way back to where all a
  // player's contests are homed, not a contest tab). Reference material + the account actions
  // that aren't wayfinding stay in the footer-links row further down the page instead -- keeps
  // the nav itself to a size that still fits comfortably on a narrow phone at a legible font size.
  // Lobby is this nav's only way back out of a contest -- the header used to also carry its own
  // "‹ Lobby" back-link pill next to the contest name, but that was dropped as redundant once
  // this persistent Lobby tab existed, and it was eating into the room available for longer
  // contest names before they had to truncate.
  // tabIcon('lobby') is deliberately not tabIcon('home') -- this row already has this contest's
  // own "Home" tab, and two house icons side by side with different labels would read as a
  // mistake rather than two different destinations.
  const bottomNavTabs = [
    ['home',tabIcon('home'),'Home'], ['picks',tabIcon('picks'),`Picks${picksBadge}`],
    ['standings',tabIcon('standings'),'Standings'], ['prizes',tabIcon('prizes'),'Prizes'],
    ['lobby',tabIcon('lobby'),'Lobby']
  ];
  const footerTabs = [];
  if(currentEntry?.is_commissioner) footerTabs.push(['admin','Admin']);
  if(!['home','picks','standings','prizes','admin'].includes(activeTab)) activeTab = 'home';

  document.getElementById('navMount').innerHTML = `
    <nav class="app-nav">
      ${bottomNavTabs.map(([id,icon,label]) => `<div class="bnav-item ${activeTab===id?'active':''}" data-tab="${id}"><span class="icon">${icon}</span><span class="label">${label}</span></div>`).join('')}
    </nav>
  `;
  app.innerHTML = `
    <div id="ptrIndicator" class="ptr-indicator" aria-hidden="true"><div class="ptr-indicator-icon">${tabIcon('picks')}</div></div>
    <div class="app-header">
      <img class="brand-icon" src="images/degen-king-games-survivor.png" alt="Degen King Games">
      <h1 style="margin:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(currentContest?.name || 'Contest')}</h1>
    </div>
    <div id="tabBody" class="${navJustChanged ? 'tab-fade' : ''}"></div>
    <div class="footer-disclaimer">DKG is an independent, unofficial fantasy sports game -- not affiliated with the NFL or any other league, team, or player association.</div>
    ${footerLinksRowHTML('disclaimersLinkContest', footerTabs)}
  `;
  document.getElementById('signOutBtn').onclick = signOut;
  // Disclaimers link jumps back to the Lobby's FAQ tab (this shell has no FAQ tab of
  // its own), unlike the other data-tab links here which stay within this shell.
  document.getElementById('disclaimersLinkContest').onclick = () => { jumpToDisclaimersFaq = true; currentContestId = null; activeTab = 'faq'; render(); };
  // data-tab="lobby" (the nav item above) needs to actually leave this contest, not just
  // switch activeTab within it, so it's special-cased here rather than left to the generic
  // activeTab assignment below.
  document.querySelectorAll('[data-tab]').forEach(el => {
    el.onclick = () => {
      if(el.dataset.tab === 'lobby') currentContestId = null;
      activeTab = el.dataset.tab;
      render();
    };
  });

  const body = document.getElementById('tabBody');
  if(activeTab === 'home') return renderHome(body);
  if(activeTab === 'picks') return renderPicks(body);
  if(activeTab === 'standings') return renderStandings(body);
  if(activeTab === 'prizes') return renderPrizes(body);
  if(activeTab === 'admin') return renderAdmin(body);
}

// Accordion (same expand/collapse pattern as the FAQ tab and the Prizes
// tab's "Weekly high score history") -- one row per position, collapsed by
// default. This list only grows as the season goes on (WR especially,
// with 3 slots/week), so collapsing by position keeps the card short
// while still letting a player open just the position they care about.
// This reflects CURRENT locks, not a full log of every player ever
// searched -- picks are editable up until kickoff (see submit_slot_pick),
// so a player swapped away from before his kickoff simply isn't here
// anymore, and never counted against season-long reuse in the first place.
function renderPickHistoryHTML(){
  const positions = ['QB','RB','WR','TE'];
  const grouped = {};
  positions.forEach(p => grouped[p] = []);
  myAllPicks.forEach(p => { if(grouped[p.position]) grouped[p.position].push(p); });
  const reuseAllowed = currentContest && currentContest.unique_players_per_season === false;

  return `
    <div class="card">
      <h3>Your locked-in picks this contest</h3>
      <p>Below is a list of all the players you've selected, week by week, in this Contest. Keep this as your own reference in case a pick is ever in question.</p>
      ${positions.map(pos => `
        <div class="faq-item">
          <div class="faq-q history-q" data-pos="${pos}">${pos}</div>
          <div class="faq-a" id="history-a-${pos}">
            ${grouped[pos].length ? `<div class="history-text">${grouped[pos].map(p => `${esc(p.nfl_player_name)} <span style="color:var(--text-dim);">(${esc(p.team)})</span> <span class="week-tag">WK ${p.week_number}</span>`).join(' <span class="history-sep">★</span> ')}</div>` : '<div class="history-empty">None yet</div>'}
          </div>
        </div>`).join('')}
    </div>`;
}
function wirePickHistoryAccordion(){
  document.querySelectorAll('.history-q').forEach(el => {
    el.onclick = () => {
      const ans = document.getElementById(`history-a-${el.dataset.pos}`);
      const open = ans.classList.toggle('open');
      el.classList.toggle('open', open);
    };
  });
}

// Contest Home is a status/profile view scoped to the current contest:
// alive state and a "Week N" card for the most recently *started* week
// (independent of whether a new week has opened). Deliberately not
// labeled "recap" -- that word implied the week was over, which isn't
// true the moment it first appears. Instead the heading always carries a
// Live or Final pill (.week-pill, built on --caution/--alive so its color
// never shifts with a player's flair accent -- see the CSS comment) that
// says exactly what state the numbers below are in. A week shows up here
// the moment its first game kicks off, tagged Live, and switches to
// Final once the admin finalizes it -- see loadRecentWeek()'s comment for
// the exact gating. Building this week's lineup, and this contest's pick
// history (so players can see who's already used on the same page where
// they're picking), both live on the Picks tab (see renderPicks below).
async function renderHome(body){
  // First paint while the awaits below are in flight -- see homeSkeletonHTML()'s comment.
  // Fully overwritten by the real body.innerHTML assignment further down; nothing here is ever
  // left mixed in with real content.
  body.innerHTML = homeSkeletonHTML();
  const { data: contestRow } = await sb.from('contests').select('*').eq('id', currentContestId).maybeSingle();
  if(contestRow) currentContest = contestRow;
  // threshold/isEliminator aren't needed here any more -- renderRecapCardHTML() below computes
  // its own copies from currentContest directly, since it has to be independently callable
  // (not just inline in this function) for recapPrev/recapNext's scoped refresh -- see its
  // own comment.
  // Used by the eliminated player's own rebuy-eligibility check below. The Second-chance
  // rebuy status line itself lives on the Week N card, or on the Contest details card before
  // any week has kicked off (see secondChanceStatHTML()).
  const scWindowWeeks = contestRow?.second_chance_window_weeks ?? 0;
  // Player-reuse reminder shown on the "You're alive" card -- unique_players_per_season is
  // locked in at contest creation (see submit_slot_pick's reuse check), but it's easy to
  // forget which way a given contest was set up, especially for KnightFall Guillotine
  // contests where it can go either way. Kingmaker Gauntlet contests are always created with
  // it true (no reuse) today, but this reads the real column value either way rather than
  // assuming that by game mode, so it stays correct if that ever changes.
  const reuseAllowedHome = contestRow?.unique_players_per_season === false;
  const reuseReminderHTML = `<div class="note">${reuseAllowedHome
    ? "Reminder: this contest allows reusing the same player in future weeks, even after they've been chosen and are locked in."
    : "Reminder: this contest does not allow reusing the same player in future weeks once they've been chosen and are locked in."}</div>`;

  let statusHTML = '';
  if(!currentEntry){
    const canJoin = contestRow?.status === 'open' && !!contestRow?.registration_open;
    statusHTML = `
      <div class="card">
        <h3>You haven't joined this contest</h3>
        <p>${canJoin ? "Join below to start picking." : "Registration for this contest isn't currently open."}</p>
        ${canJoin ? '<button id="joinFromHomeBtn" style="margin-top:10px;">Join this contest</button>' : ''}
      </div>`;
  } else if(!currentEntry.alive){
    // Second-chance rebuy: a player who's eliminated can self-serve request
    // a rebuy for one week after their own elimination
    // (eliminated_week + 1), as long as that's still within the contest's
    // own second_chance_window_weeks (0 = not offered at all) -- see
    // request_second_chance() for the exact server-side rule this
    // mirrors. The request just flags it for the commissioner to confirm
    // (Admin tab) once they've verified re-payment -- it doesn't
    // reinstate the player on its own. This is a one-time rebuy per
    // player per contest (second_chance_used is a boolean, not a
    // counter) -- decided, not something more uses will be added to.
    // Two independent checks, both required, mirroring request_second_chance() exactly:
    // (1) the elimination itself has to have happened within the contest's own
    // eligibility window (start week + second_chance_window_weeks - 1) -- this is the
    // "first N weeks" the recap card's status line refers to, and is NOT the same number
    // as scDeadlineWeek below; (2) a personal, one-week grace period after THIS player's
    // own elimination (eliminated_week + 1) to actually request it. A contest-wide
    // eligibility check was previously missing here -- the button could show (and only
    // fail server-side on click) for a player eliminated too late in the season to
    // qualify, even while still inside their own personal grace period.
    const scDeadlineWeek = currentEntry.eliminated_week + 1;
    const scCutoffWeek = currentContestStartWeek !== null ? currentContestStartWeek + scWindowWeeks - 1 : null;
    const scEligibleByCutoff = scCutoffWeek !== null && currentEntry.eliminated_week <= scCutoffWeek;
    const scWindowOpen = scWindowWeeks > 0 && scEligibleByCutoff && !!currentWeek && currentWeek.week_number <= scDeadlineWeek;
    if(currentEntry.second_chance_requested_at){
      statusHTML = `
        <div class="card pulse-elim">
          <h3>You're out</h3>
          <p>Eliminated in week ${currentEntry.eliminated_week}.</p>
          <p>Second-chance rebuy requested — waiting on the admin to confirm your payment.</p>

// Contest Home's "Week N" recap card. Self-contained like renderHighScoresCardHTML() below --
// pulls everything it needs from module-level state (recentWeekNumber/recentWeekRow/

// (wireRecapCard() below) can regenerate just this card's markup after loadRecentWeek() and
// swap only its own mount's innerHTML, instead of re-running the whole renderHome() (which
// shows homeSkeletonHTML() first) just to page to a different week. Synchronous -- everything
// it reads is already-loaded module state, no awaits needed here; the caller awaits
// loadRecentWeek() beforehand to refresh that state. Returns '' when there's no recent week to
// show yet, same as the inline version this replaced.
// Contest Home's pre-kickoff "Contest details" card -- the Week N card below only exists once a
// week the player has picks in has kicked off, so before that point (e.g. a brand-new contest
// in its signup window) nothing on Home said how the contest runs. This fills that gap with the
// same contest-level facts the Week N card carries (weeks, how you survive, second-chance
// rebuy, DK scoring), and renderHome() drops it once the Week N card takes over.
function contestDetailsCardHTML(){
  if(!currentContest) return '';

function renderRecapCardHTML(){
  if(!recentWeekNumber) return '';
  const threshold = currentContest?.weekly_threshold ?? 100;
  const isEliminator = currentContest?.game_type === 'eliminator';
  const scStatHTML = secondChanceStatHTML(currentContest, currentEntry, currentContestStartWeek);

  const isFinal = !!recentWeekRow?.is_finalized;
  const recapSlotsHTML = lineupSlots.map(slot => {
    const pick = recentWeekPicks.find(p => p.slot === slot.slot);
    if(!pick){
      return `<div class="recap-row"><span class="slot-label">${slot.slot}</span><span class="recap-name" style="color:var(--text-dim);">Not filled</span></div>`;
    }
    const scoreColor = pick.result === 'pass' ? 'var(--alive)' : pick.result === 'fail' ? 'var(--elim)' : 'var(--text-dim)';
    const scoreText = pick.score !== null ? `${fmtPts(pick.score)} pts` : 'Pending';
    const estTag = (pick.score !== null && pick.source === 'computed') ? ` <span class="est-pill" title="Auto-filled from live NFL stats — the commissioner hasn't reviewed it yet">Est.</span>` : '';
    return `
      <div class="recap-row">
        <span class="slot-label">${slot.slot}</span>
        <span class="recap-name">${esc(pick.nfl_player_name)} <span style="color:var(--text-dim);">(${esc(pick.team)})</span></span>
        <span class="recap-score" style="color:${scoreColor};">${scoreText}${estTag}</span>
      </div>`;
  }).join('');

  // Reflect scores the moment the admin saves them (picks_with_scores
  // already carries whatever's in week_player_scores), not just once the
  // whole week is finalized -- so this sums whatever's scored so far
  // rather than gating on every slot being done.
  const scoredCount = recentWeekPicks.filter(p => p.score !== null).length;
  const currentTotal = scoredCount > 0 ? recentWeekPicks.reduce((sum,p) => sum + (Number(p.score) || 0), 0) : null;
  const fullyScored = scoredCount === lineupSlots.length && lineupSlots.length > 0;

  // Scores refresh on a 15-minute cron gated to each week's own real game
  // window (see survivor-fantasy-setup.md's automated-scoring notes). This
  // tells players when that window closes for THIS week (closes_at + the
  // sync's 24h post-window buffer) and when a score here last changed,
  // from whichever pick has the newest score_updated_at (picks_with_scores).
  const syncWindowEndIso = recentWeekClosesAt ? new Date(new Date(recentWeekClosesAt).getTime() + 24*60*60*1000).toISOString() : null;
  const lastScoreUpdate = recentWeekPicks.reduce((max,p) => {
    if(!p.score_updated_at) return max;
    const t = new Date(p.score_updated_at);
    return (!max || t > max) ? t : max;
  }, null);

  // Eliminator (KnightFall Guillotine) has no per-week point threshold -- whether that
  // total was "good enough" depends on where it landed relative to everyone else that
  // week, not a fixed number, so the total is shown in a neutral color there instead of
  // the green/red threshold comparison Survivor (Kingmaker Gauntlet) uses. pick.result
  // (pass/fail, set by commissioner_finalize_week for both modes) still drives each
  // slot's own row color either way.
  const totalColor = isEliminator ? 'var(--text)' : (currentTotal >= threshold ? 'var(--alive)' : 'var(--elim)');

  // Always shows one of the two -- Live (yellow, glowing, same as the Caution pill's
  // color on Standings) or Final (green, same as the Alive pill) -- rather than only
  // tagging the not-final case. That's what let "recap" drop from the heading entirely:
  // the pill itself now says what state the week is in, so the heading doesn't need to
  // imply anything about completeness on its own. Uses the dedicated .week-pill classes
  // (not .est-pill) since this is a different, more prominent visual treatment than the
  // small purple "Est." tags used elsewhere on this same card.
  const weekStatusPill = isFinal
    ? ' <span class="week-pill final" title="Finalized by the admin">Final</span>'
    : ' <span class="week-pill live" title="Live and unofficial — updates automatically as games end and finalized stats stream in, not final until the admin finalizes the week">Live</span>';

  return `
    <div class="card">
      <div class="row">
        <h3>Week ${recentWeekNumber}${weekStatusPill}</h3>
        <span class="row" style="gap:6px;width:auto;">
          <button class="small secondary" id="recapPrev" ${recapWeekIndex <= 0 ? 'disabled' : ''}>‹</button>
          <button class="small secondary" id="recapNext" ${recapWeekIndex >= recentWeekNumbers.length - 1 ? 'disabled' : ''}>›</button>
        </span>
      </div>
      ${recapSlotsHTML}
      ${currentTotal !== null ? `
        <div class="stat" style="margin-top:10px;"><span>${isFinal ? 'Total' : 'Current total'}</span><b style="color:${totalColor}">${fmtPts(currentTotal)} pts</b></div>
        ${!isFinal ? `<p class="estimate-note">${fullyScored ? 'Estimated' : 'Projected'} — updates as games end and finalized stats stream in. Last updated ${ctTime(lastScoreUpdate.toISOString())}.</p>` : ''}
      ` : ''}
      ${isEliminator
        ? '<div class="stat" style="margin-top:' + (currentTotal !== null ? '4px' : '10px') + ';"><span>How you survive</span><b>Avoid the lowest score(s)</b></div>'
        : `<div class="stat" style="margin-top:${currentTotal !== null ? '4px' : '10px'};"><span>Threshold to advance</span><b>${threshold}+ pts</b></div>`}
      ${scStatHTML}
      ${dkScoringHTML('recap')}
    </div>`;
}
// Weekly high-scores card, used on Contest Home with prev/next arrows

function wireRecapCard(body){

// Picks is the action tab: building/locking this week's lineup within the
// current contest.
async function loadLineupCandidates(reuseAllowed){
  const positions = [...new Set(lineupSlots.map(s => s.position))];
  const byPosition = {};
  positions.forEach(pos => byPosition[pos] = []);
  if(!positions.length || !currentWeek) return byPosition;
  const { data } = await sb.from('nfl_players').select('id, full_name, team, position')
    .in('position', positions).eq('active', true);
  const now = Date.now();
  (data || []).forEach(p => {
    if(!reuseAllowed && usedPlayerIds.has(p.id)) return;
    const kickoff = weekGamesMap[p.team];
    if(!kickoff || new Date(kickoff).getTime() <= now) return;
    const proj = weekProjections[p.id];
    if(proj === undefined) return; // no projection this week -- left out of lineup building
    byPosition[p.position].push({ id: p.id, full_name: p.full_name, team: p.team, projected_score: proj });
  });
  Object.values(byPosition).forEach(list => list.sort((a,b) => b.projected_score - a.projected_score));
  return byPosition;
}

// Highest Score Projection: the single best available player per slot --
// no target-seeking needed, just the top of each position's sorted list,
// one per slot in lineupSlots order (so two RB slots naturally get the
// top two RBs). Used for both game modes.
function buildHighestLineup(byPosition){
  const takenIdx = {};
  const chosen = lineupSlots.map(slot => {
    const list = byPosition[slot.position] || [];
    const idx = takenIdx[slot.position] || 0;
    takenIdx[slot.position] = idx + 1;
    return { slot: slot.slot, position: slot.position, player: list[idx] || null };
  });
  const complete = chosen.every(c => c.player);
  const total = chosen.reduce((sum,c) => sum + (c.player ? c.player.projected_score : 0), 0);
  return { chosen, total, complete };
}

// Shared target-seeking routine behind Kingmaker's Mid and Low outputs.
// Exact search, not a heuristic -- replaces two failed attempts at a
// step-by-step greedy (one that could get permanently stuck after
// overshooting, one that could cycle back and forth forever without
// progress -- see chat history/commit log if either ever needs revisiting).
// For each position, enumerates every real contiguous "best N of these"
// combination and its total (e.g. 2 RB slots with 5 candidates has exactly
// 4 possible pairs: ranks [0,1], [1,2], [2,3], [3,4]) capped to each
// position's top TARGET_SEARCH_CANDIDATE_CAP candidates -- a target lineup
// never has a real reason to reach deeper than that, since anything past
// the top ~20 at a position is far enough below the best available that it
// essentially never wins a "clear this threshold" or "closest to this
// number" comparison anyway. Then takes the full cartesian product across
// positions (a handful of positions x a bounded handful of windows each is
// at most a few hundred thousand plain additions -- trivial, not a
// performance risk even on a full slate) and picks whichever REAL
// combination actually wins: cheapest that clears target ('atLeast'), or
// nearest to target from either side ('closest').
// A tie on that primary metric (a real tie -- two different windows landing
// on the exact same total, not an epsilon fudge) is broken by avoidIds:
// whichever tied combo reuses fewer players already shown in an earlier
// Player Projections option wins, so High/Mid/Low tend to surface
// different names instead of the same handful every time -- purely a
// tie-break, never lets a worse-total combination win.
const TARGET_SEARCH_CANDIDATE_CAP = 20;
function comboOverlapCount(byPos, avoidIds){
  if(!avoidIds || !avoidIds.size) return 0;
  let n = 0;
  Object.values(byPos).forEach(players => players.forEach(p => { if(avoidIds.has(p.id)) n++; }));
  return n;
}
function buildTargetLineup(byPosition, target, mode, avoidIds){
  const positions = [...new Set(lineupSlots.map(s => s.position))];
  const counts = {};
  lineupSlots.forEach(s => counts[s.position] = (counts[s.position]||0) + 1);

  const perPosition = positions.map(pos => {
    const list = (byPosition[pos] || []).slice(0, TARGET_SEARCH_CANDIDATE_CAP);
    const n = counts[pos];
    if(list.length < n) return null; // not enough candidates to fill this position at all
    const windows = [];
    for(let start = 0; start + n <= list.length; start++){
      const players = list.slice(start, start + n);
      windows.push({ players, sum: players.reduce((s,p) => s + p.projected_score, 0) });
    }
    return { position: pos, windows };
  });
  if(perPosition.some(p => p === null)) return { chosen: null, total: null, reachable: false };

  let combos = [{ total: 0, byPos: {} }];
  for(const p of perPosition){
    const next = [];
    for(const c of combos){
      for(const w of p.windows){
        next.push({ total: c.total + w.sum, byPos: { ...c.byPos, [p.position]: w.players } });
      }
    }
    combos = next;
  }

  let best = null;
  for(const c of combos){
    if(mode === 'atLeast' && c.total < target) continue;
    if(!best) { best = c; continue; }
    const cMetric = mode === 'atLeast' ? c.total : Math.abs(target - c.total);
    const bestMetric = mode === 'atLeast' ? best.total : Math.abs(target - best.total);
    if(cMetric < bestMetric){
      best = c;
    } else if(cMetric === bestMetric && comboOverlapCount(c.byPos, avoidIds) < comboOverlapCount(best.byPos, avoidIds)){
      best = c;
    }
  }
  if(!best){
    const bestPossible = combos.reduce((m,c) => Math.max(m, c.total), -Infinity);
    return { chosen: null, total: bestPossible, reachable: false }; // atLeast only -- nothing clears target
  }

  const takenIdx = {};
  const chosen = lineupSlots.map(slot => {
    const idx = takenIdx[slot.position] || 0;
    takenIdx[slot.position] = idx + 1;
    return { slot: slot.slot, position: slot.position, player: best.byPos[slot.position][idx] };
  });
  return { chosen, total: best.total, reachable: true };
}

const PROJECTIONS_COLLAPSED_KEY = 'dkg_projExpanded';
// Deliberately the opposite default from Game Modes' accordion (which
// starts expanded) -- this card's content is data-heavy and re-derived
// every visit, not a one-time rules read, so it defaults CLOSED and only
// stays open across visits once someone's actually opened it once. Stores
// "expanded" (not "collapsed") so an absent/missing key means closed.
function loadProjCollapsed(){
  try { return localStorage.getItem(PROJECTIONS_COLLAPSED_KEY) !== '1'; } catch(e){ return true; }
}
function saveProjCollapsed(collapsed){
  try {
    if(collapsed) localStorage.removeItem(PROJECTIONS_COLLAPSED_KEY);
    else localStorage.setItem(PROJECTIONS_COLLAPSED_KEY, '1');
  } catch(e){ /* localStorage unavailable -- just won't persist, not fatal */ }
}
function lineupRosterLine(chosen){
  // Each player's own projected score sits in parentheses right after their name -- the
  // option's title already shows the roster's combined total, but a player picking between
  // High/Mid/Low still wants to see what each individual player is expected to contribute.
  return chosen.map(c => c.player ? `${esc(c.slot)} ${esc(c.player.full_name)} (${fmtPts(c.player.projected_score)})` : `${esc(c.slot)} —`).join(', ');
}
// One compact line per option (roster names + a single total) rather than
// one line per slot -- 3 options at 7-8 lines each was taking up a full
// mobile screen before anyone even looked at their own lineup.
function projectionsOptionHTML(title, chosen, total){
  return `<div class="proj-option">
    <div class="proj-option-title">${esc(title)} <span style="float:right;">${fmtPts(total)} pts</span></div>
    <p class="proj-option-roster">${lineupRosterLine(chosen)}</p>
  </div>`;
}
// Kingmaker Gauntlet: High/Mid/Low, all built from the same candidate pool.
// Low targets this contest's own weekly_threshold + a small cushion (not a
// hardcoded number) so it stays meaningful if a commissioner sets a
// different threshold. Mid targets the midpoint between High's actual total
// and Low's target, and is skipped when that midpoint isn't meaningfully
// below High (a thin, late-season player pool) rather than showing a number
// that doesn't mean anything.
const PROJECTION_CUSHION = 5;
function kingmakerProjectionsHTML(byPosition, threshold){
  const high = buildHighestLineup(byPosition);
  if(!high.complete){
    return `<p class="estimate-note">Not enough available, projected players left to fill every slot this week.</p>`;
  }
  const highIds = new Set(high.chosen.filter(c => c.player).map(c => c.player.id));
  const lowTarget = threshold + PROJECTION_CUSHION;
  const low = buildTargetLineup(byPosition, lowTarget, 'atLeast', highIds);
  const midTarget = (high.total + lowTarget) / 2;
  const midMeaningful = low.reachable && midTarget < high.total - 0.5;
  // Mid steers away from whichever players High and Low already used (when a tie leaves
  // room to choose), so all three options offer as many different players as the pool allows.
  const midAvoidIds = low.reachable && low.chosen
    ? new Set([...highIds, ...low.chosen.filter(c => c.player).map(c => c.player.id)])
    : highIds;
  const mid = midMeaningful ? buildTargetLineup(byPosition, midTarget, 'closest', midAvoidIds) : null;
  return `
    ${projectionsOptionHTML('Highest Score Potential', high.chosen, high.total)}
    ${mid && mid.chosen ? projectionsOptionHTML('Middle Ground', mid.chosen, mid.total) : ''}
    ${low.reachable
      ? projectionsOptionHTML(`Just Make the Cut (${lowTarget}+)`, low.chosen, low.total)
      : `<div class="proj-option"><div class="proj-option-title">Just Make the Cut (${lowTarget}+)</div><p class="estimate-note">No available combination clears the threshold this week with who's left to pick from.</p></div>`}
  `;
}
// KnightFall Guillotine: no fixed threshold, so no Mid/Low -- just the
// single best lineup, plus a browsable list of the next-best options at
// each position so there's still something to weigh beyond one number
// (agreed alternative to a k-best-lineups search -- see chat). The alt
// list excludes whoever's already shown in the Highest Score Potential
// lineup above it (so the two sections never repeat a name -- someone
// reading both would otherwise wrongly assume "Other strong options"
// ranks below the top group's own players, when really they're just not
// re-listed) and shows each alternate's own projected score in
// parentheses next to their name, so trimming the overlap doesn't cost
// anyone the ability to compare expected values.
const PROJECTIONS_ALT_COUNT = 3;
function knightfallProjectionsHTML(byPosition){
  const high = buildHighestLineup(byPosition);
  const usedIds = new Set(high.chosen.filter(c => c.player).map(c => c.player.id));
  const positions = [...new Set(lineupSlots.map(s => s.position))];
  const altHTML = positions.map(pos => {
    const list = (byPosition[pos] || []).filter(p => !usedIds.has(p.id)).slice(0, PROJECTIONS_ALT_COUNT);
    if(!list.length) return '';
    const line = list.map(p => `${esc(p.full_name)} (${fmtPts(p.projected_score)})`).join(', ');
    return `<div class="proj-alt-row"><span>${esc(pos)}</span><span class="proj-alt-names">${line}</span></div>`;
  }).join('');
  return `
    ${high.complete ? projectionsOptionHTML('Highest Score Potential', high.chosen, high.total) : `<p class="estimate-note">Not enough available, projected players left to fill every slot this week.</p>`}
    <div style="color:var(--text);font-weight:700;font-size:13px;margin-top:8px;">Other strong options</div>
    ${altHTML || '<p class="estimate-note">No other projected players available this week.</p>'}
  `;
}
function projectionsCardHTML(freshBody, reuseAllowed){
  const open = !loadProjCollapsed();
  // Only ever states "aren't in yet" once, down in freshBody (see
  // renderPicks) -- this used to also say it here in the blurb whenever
  // projectionsUpdatedAt was empty, showing the same sentence twice. When
  // there's real data, this still adds the "as of" freshness note; when
  // there isn't, it just says nothing extra rather than repeating itself.
  const updatedNote = projectionsUpdatedAt ? ` Projections as of ${ctTime(projectionsUpdatedAt)}.` : '';
  return `
    <div class="card">
      <div class="faq-q ${open ? 'open' : ''}" id="projToggle">Player Projections</div>
      <div class="faq-a ${open ? 'open' : ''}" id="projBody">
        <p>These are estimates, not guarantees, of projected player stats from online sources using DK's scoring math. All players listed are available for you to pick.${esc(updatedNote)}</p>
        ${freshBody}
      </div>
    </div>`;
}
function wireProjectionsCard(){
  const toggle = document.getElementById('projToggle');
  const panel = document.getElementById('projBody');
  if(toggle && panel){
    toggle.onclick = () => {
      const nowOpen = panel.classList.toggle('open');
      toggle.classList.toggle('open', nowOpen);
      saveProjCollapsed(!nowOpen);
    };
  }
}

async function renderPicks(body){
  if(!currentWeek){
    body.innerHTML = `
      <div class="card"><h3>No active week</h3><p>There's no open week right now — check back once the next one opens.</p></div>
      ${renderPickHistoryHTML()}
    `;
    wirePickHistoryAccordion();
    return;
  }
  const { data: contestRow } = await sb.from('contests').select('*').eq('id', currentContestId).maybeSingle();
  if(contestRow) currentContest = contestRow;
  // The Picks tab's player search and lineup slots are NFL-specific
  // (nfl_players/games) -- every sport but NFL is still greyed out on the
  // Create Contest form, so this shouldn't be reachable in practice, but
  // it's a real gap if a non-NFL contest ever exists (e.g. seeded
  // directly in the database), so it's guarded here rather than left to
  // silently query the wrong data.
  if(contestRow && contestRow.sport !== 'nfl'){
    body.innerHTML = `<div class="card"><h3>Not available yet</h3><p>Lineup building for ${esc(String(contestRow.sport).toUpperCase())} contests isn't wired up yet — check back once it's supported.</p></div>`;
    return;
  }
  const threshold = contestRow?.weekly_threshold ?? 100;
  const isEliminator = contestRow?.game_type === 'eliminator';
  const now = new Date();
  const windowOpen = now <= new Date(currentWeek.closes_at);

  let statusHTML = '';
  if(!currentEntry){
    statusHTML = `<div class="card"><h3>You haven't joined this contest</h3><p>Join from the Home tab to start picking.</p></div>`;
  } else if(!currentEntry.alive){
    statusHTML = `<div class="card"><h3>You're out</h3><p>Eliminated in week ${currentEntry.eliminated_week}. Thanks for playing — check the standings tab for where things landed.</p></div>`;
  } else if(!currentEntry.is_approved){
    statusHTML = `<div class="card"><h3>Pending approval</h3><p>Your entry hasn't been approved yet — check with this contest's admin.</p></div>`;
  } else if(!windowOpen){
    statusHTML = `<div class="card"><h3>Picks are closed</h3><p>Week ${currentWeek.week_number} closed ${ctTime(currentWeek.closes_at)}.</p></div>`;
  }

  const canPick = !!(currentEntry?.alive && currentEntry?.is_approved && windowOpen);
  // Eliminator's open-pool variant lets a player reuse the same NFL
  // player week to week -- usedPlayerIds (loaded from every pick this
  // player CURRENTLY has locked in this contest -- see loadUsedPlayers)
  // only gates the search results when that's off, so runSearch below
  // needs to know which mode this is.
  const reuseAllowed = contestRow && contestRow.unique_players_per_season === false;

  // Player Projections card body -- built from the same reuseAllowed/
  // usedPlayerIds/weekGamesMap this whole tab already uses, so "already
  // used" and "already kicked off" mean exactly the same thing here as
  // they do in the search box below. See the lineup-building functions
  // above renderPicks for how each output is actually computed.
  let projectionsBodyHTML = `<p class="estimate-note">Projections for this week aren't in yet — check back soon.</p>`;
  if(Object.keys(weekProjections).length > 0){
    const byPosition = await loadLineupCandidates(reuseAllowed);
    projectionsBodyHTML = isEliminator ? knightfallProjectionsHTML(byPosition) : kingmakerProjectionsHTML(byPosition, threshold);
  }

  const slotsHTML = lineupSlots.map(slot => {
    const pick = myPicks.find(p => p.slot === slot.slot);
    if(pick){
      // Match Contest Home's coloring: only a finalized pass/fail result gets
      // alive/elim colors -- a pending or still-computed score (result is
      // null before finalization) stays neutral instead of defaulting to
      // "fail" red, which is what this used to do.
      const scoreColor = pick.result === 'pass' ? 'var(--alive)' : pick.result === 'fail' ? 'var(--elim)' : 'var(--text-dim)';
      const estTag = (pick.score !== null && pick.source === 'computed') ? ` <span class="est-pill" title="Auto-filled from live NFL stats — the commissioner hasn't reviewed it yet">Est.</span>` : '';
      // A slot is still swappable up until the player CURRENTLY in it kicks
      // off -- submit_slot_pick enforces this same gate server-side, this
      // just decides whether to show the search box again or the final,
      // scored version of the slot. Reuses the exact same .slotSearch input
      // (and its shared debounce/runSearch wiring below) an empty slot
      // uses, so swapping and first-time filling are the same code path.
      const pickKickoff = weekGamesMap[pick.team] || null;
      const editable = canPick && pickKickoff && new Date(pickKickoff).getTime() > Date.now();
      if(editable){
        return `
          <div class="slot-card">
            <div class="row"><span class="slot-label">${slot.slot}</span><span class="pill pending">EDITABLE</span></div>
            <p style="color:var(--text);margin-top:4px;">${esc(pick.nfl_player_name)} <span style="color:var(--text-dim)">(${esc(pick.team)})</span></p>
            <p class="estimate-note">You can swap this pick until ${ctTime(pickKickoff)}.</p>
            <input placeholder="Search ${slot.position} to swap..." class="slotSearch" data-slot="${slot.slot}" data-position="${slot.position}" autocomplete="off"/>
            <div class="results" id="results-${slot.slot}"></div>
            <button class="small secondary clearSlotBtn" data-slot="${esc(slot.slot)}" data-name="${esc(pick.nfl_player_name)}" style="margin-top:8px;width:100%;">Clear this pick</button>
          </div>`;
      }
      return `
        <div class="slot-card">
          <div class="row"><span class="slot-label">${slot.slot}</span><span class="pill alive">LOCKED</span></div>
          <p style="color:var(--text);margin-top:4px;">${esc(pick.nfl_player_name)} <span style="color:var(--text-dim)">(${esc(pick.team)})</span></p>
          ${pick.score !== null ? `<p>Score: <strong style="color:${scoreColor};">${fmtPts(pick.score)}</strong>${estTag}</p>` : `<p>Score pending</p>`}
        </div>`;
    }
    if(!canPick){
      return `<div class="slot-card"><span class="slot-label">${slot.slot}</span><p>Not filled</p></div>`;
    }
    return `
      <div class="slot-card">
        <span class="slot-label">${slot.slot}</span>
        <input placeholder="Search ${slot.position}..." class="slotSearch" data-slot="${slot.slot}" data-position="${slot.position}" autocomplete="off"/>
        <div class="results" id="results-${slot.slot}"></div>
      </div>`;
  }).join('');

  const totalScored = myPicks.length && myPicks.every(p => p.score !== null) && myPicks.length === lineupSlots.length
    ? myPicks.reduce((sum,p) => sum + Number(p.score), 0)
    : null;
  const totalColor = isEliminator ? 'var(--text)' : (totalScored >= threshold ? 'var(--alive)' : 'var(--elim)');

  body.innerHTML = `
    <div class="scoreboard">
      <div>${playerNameHeaderHTML()}</div>
      <div style="text-align:right;"><div class="week-label">Week</div><div class="week">${currentWeek.week_number}</div></div>
    </div>
    <div id="nameEditArea"></div>
    <div id="flairEditArea"></div>
    ${projectionsCardHTML(projectionsBodyHTML, reuseAllowed)}
    ${statusHTML}
    <div class="card ${myPicks.length === lineupSlots.length && lineupSlots.length > 0 ? 'feature' : ''}">
      <h3>Your lineup</h3>
      <div class="note">Roster slots are editable up until that player's kickoff time. After that it locks and can't be changed. Each roster slot locks independent so you do not have to fill the entire team at the same time - which adds some additional strategy.${reuseAllowed ? ' This contest allows reusing the same player in a different week.' : ''}</div>
      ${lineupSlots.length > 0 ? (myPicks.length === lineupSlots.length
        ? '<span class="pill alive" style="margin-top:6px;display:inline-block;">Team Roster Complete</span>'
        : '<span class="pill caution" style="margin-top:6px;display:inline-block;">Team Roster Incomplete</span>') : ''}
      ${slotsHTML}
      ${isEliminator
        ? '<div class="stat" style="margin-top:10px;"><span>How you survive</span><b>Avoid the lowest score(s)</b></div>'
        : `<div class="stat" style="margin-top:10px;"><span>Threshold to advance</span><b>${threshold}+ pts</b></div>`}
      ${totalScored !== null ? `<div class="stat"><span>Your total this week</span><b style="color:${totalColor}">${fmtPts(totalScored)} pts</b></div>` : ''}
      ${totalScored !== null && myPicks.some(p => p.source === 'computed') ? '<p class="estimate-note">Includes auto-filled ("Est.") score(s) not yet reviewed by the commissioner.</p>' : ''}
    </div>
    ${renderPickHistoryHTML()}
  `;

  document.querySelectorAll('.slotSearch').forEach(input => {
    let debounce;
    input.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => runSearch(input.dataset.slot, input.dataset.position, input.value, reuseAllowed), 250);
    });
  });
  document.querySelectorAll('.clearSlotBtn').forEach(btn => {
    btn.onclick = () => showClearConfirm(btn.dataset.slot, btn.dataset.name);
  });
  wireNameEdit(body);
  wireFlairPicker(body);
  wireProjectionsCard();
  wirePickHistoryAccordion();
}

async function runSearch(slot, position, query, reuseAllowed){
  const resultsEl = document.getElementById(`results-${slot}`);
  if(!query || query.length < 2){ resultsEl.innerHTML = ''; return; }
  const { data } = await sb.from('nfl_players').select('id, full_name, team')
    .eq('position', position).eq('active', true).ilike('full_name', `%${query}%`).limit(30);
  const now = Date.now();
  const options = (data || [])
    .filter(p => reuseAllowed || !usedPlayerIds.has(p.id))
    .map(p => ({ ...p, kickoff: weekGamesMap[p.team] || null }))
    .filter(p => p.kickoff && new Date(p.kickoff).getTime() > now)
    .sort((a,b) => a.full_name.localeCompare(b.full_name))
    .slice(0, 12);

  if(options.length === 0){
    resultsEl.innerHTML = `<p style="margin-top:8px;">No available, not-yet-started ${position}s match "${esc(query)}".</p>`;
    return;
  }
  resultsEl.innerHTML = options.map(p => {
    const color = isSameDayCT(p.kickoff) ? 'var(--elim)' : 'var(--alive)';
    // weekProjections is already loaded for the whole tab (see
    // loadWeekProjections) -- this is a lookup, not a query, so it adds no
    // extra round trip. A player with no projection this week (thin
    // coverage from the source, or a name Sleeper doesn't have) just shows
    // no score rather than a blank/fake number.
    const proj = weekProjections[p.id];
    const projTag = proj !== undefined ? `<span class="proj-tag" title="Projected score">${fmtPts(proj)} proj.</span>` : '';
    return `<div class="result-item" data-id="${p.id}" data-name="${esc(p.full_name)}" data-team="${esc(p.team)}">
      <span>${esc(p.full_name)} <span style="color:var(--text-dim)">(${esc(p.team)})</span> ${projTag}</span>
      <span class="kickoff-tag" style="color:${color}">${ctTime(p.kickoff)}</span>
    </div>`;
  }).join('');
  resultsEl.querySelectorAll('.result-item').forEach(el => {
    el.onclick = () => {
      const { id, name, team } = el.dataset;
      showPickConfirm(slot, id, name, team);
    };
  });
}

function showPickConfirm(slot, id, name, team){
  const resultsEl = document.getElementById(`results-${slot}`);
  // Wording branches on whether this slot already has a pick in it -- a
  // fresh pick and a swap both end up calling the same submit_slot_pick
  // RPC (it upserts either way), so the only thing that needs to differ
  // is what the confirm copy tells the player to expect.
  const isSwap = myPicks.some(p => p.slot === slot);
  const promptHTML = isSwap
    ? `Swap ${slot} to <strong>${esc(name)}</strong> (${esc(team)})? You can keep swapping this slot until ${esc(name)}'s own kickoff.`
    : `Lock in <strong>${esc(name)}</strong> (${esc(team)}) for ${slot}? You can still swap this pick anytime before ${esc(name)}'s kickoff.`;
  resultsEl.innerHTML = `
    <div class="confirm-box">
      <p style="color:var(--text);">${promptHTML}</p>
      <div class="row" style="gap:8px;margin-top:6px;">
        <button class="small secondary" id="cancelPick" style="flex:1;">Cancel</button>
        <button class="small" id="confirmPick" style="flex:1;">${isSwap ? 'Confirm swap' : 'Confirm pick'}</button>
      </div>
    </div>`;
  document.getElementById('cancelPick').onclick = () => { resultsEl.innerHTML = ''; };
  document.getElementById('confirmPick').onclick = guard(async () => {
    const { error } = await sb.rpc('submit_slot_pick', { p_contest_id: currentContestId, p_week: currentWeek.week_number, p_slot: slot, p_player_ref: id });
    if(error){ showBanner(error.message); return; }
    await Promise.all([loadMyPicks(), loadUsedPlayers(), loadMyAllPicks(), loadRecentWeek()]);
    render();
  });
}

// Clearing is a swap to nothing -- same shared results box, same
// confirm/cancel pattern, same reload sequence as showPickConfirm above,
// just calling clear_slot_pick (a plain delete, server-gated on the same
// before-kickoff check submit_slot_pick uses) instead of submitting a
// replacement. Lets a player back out of a pick (e.g. a late scratch) and
// leave the slot open until they've decided who to fill it with.
function showClearConfirm(slot, name){
  const resultsEl = document.getElementById(`results-${slot}`);
  resultsEl.innerHTML = `
    <div class="confirm-box">
      <p style="color:var(--text);">Clear <strong>${esc(name)}</strong> from ${slot}? The slot goes back to empty — search and lock in someone new whenever you're ready, right up until their kickoff.</p>
      <div class="row" style="gap:8px;margin-top:6px;">
        <button class="small secondary" id="cancelClear" style="flex:1;">Cancel</button>
        <button class="small" id="confirmClear" style="flex:1;">Confirm clear</button>
      </div>
    </div>`;
  document.getElementById('cancelClear').onclick = () => { resultsEl.innerHTML = ''; };
  document.getElementById('confirmClear').onclick = guard(async () => {
    const { error } = await sb.rpc('clear_slot_pick', { p_contest_id: currentContestId, p_week: currentWeek.week_number, p_slot: slot });
    if(error){ showBanner(error.message); return; }
    await Promise.all([loadMyPicks(), loadUsedPlayers(), loadMyAllPicks(), loadRecentWeek()]);
    render();
  });
}

async function renderStandings(body){
  body.innerHTML = standingsSkeletonHTML();
  const [ , { data: contestRow } ] = await Promise.all([
    loadFinalizedWeeks(),
    sb.from('contests').select('*').eq('id', currentContestId).maybeSingle()
  ]);
  if(contestRow) currentContest = contestRow;
  const threshold = contestRow?.weekly_threshold ?? 100;
  const isEliminator = contestRow?.game_type === 'eliminator';
  // The live in-progress week (if any) counts toward the ranking too, same
  // "push real-time scores" idea as the Home tab's high-scores card -- no
  // separate "Week N high scores" card here anymore, that lives on Home.
  const isLive = liveWeekNumber !== null && !finalizedWeekNumbers.includes(liveWeekNumber);
  const rankWeeks = displayWeekNumbers();

  // Caution window: a still-alive player reads as plain ALIVE, not CAUTION, almost all the
  // time -- CAUTION is reserved for the real crunch window: starting 1 hour before the week's
  // last kickoff (in practice, Monday Night Football) and persisting only until the week is
  // actually finalized, at which point the definitive alive/eliminated branch above takes over
  // (green or red). Only meaningful for Survivor's fixed weekly threshold -- Eliminator's "am I
  // safe" question depends on the whole field's scores, not a number this client already has,
  // so Eliminator skips the caution window entirely and just shows plain ALIVE until finalized.
  let cautionWindowOpen = false;
  if(isLive && !isEliminator){
    const { data: liveWeekGames } = await sb.from('games').select('kickoff_at').eq('week_number', liveWeekNumber);
    const lastKickoff = (liveWeekGames || []).reduce((max, g) => {
      const t = new Date(g.kickoff_at);
      return (!max || t > max) ? t : max;
    }, null);
    if(lastKickoff) cautionWindowOpen = new Date() >= new Date(lastKickoff.getTime() - 60 * 60 * 1000);
  }

  // entriesData and allPicks don't depend on each other or on the contest row
  // fetched above, so they're fired together in one Promise.all.
  const [{ data: entriesData }, { data: allPicks }] = await Promise.all([
    sb.from('contest_entries').select('profile_id, alive, eliminated_week, second_chance_used, profiles!inner(display_name, flair_team)')
      .eq('contest_id', currentContestId).eq('is_approved', true),
    rankWeeks.length
      ? sb.from('picks_with_scores').select('player_id, week_number, score')
          .eq('contest_id', currentContestId).in('week_number', rankWeeks)
      : Promise.resolve({ data: null })
  ]);

  // Cumulative points: sum every scored pick across all finalized weeks plus
  // the live in-progress week (if any), per player -- so the ranking moves
  // in real time as scores sync in, not just after each week is finalized.
  // liveTotalsMap tracks just the live week's total per player, which is
  // what decides the Caution/Alive pill below (a weekly threshold check,
  // not a cumulative one) once the caution window above has actually opened.
  let totalsMap = {}, liveTotalsMap = {};
  (allPicks || []).forEach(p => {
    totalsMap[p.player_id] = (totalsMap[p.player_id] || 0) + (Number(p.score) || 0);
    if(isLive && p.week_number === liveWeekNumber){
      liveTotalsMap[p.player_id] = (liveTotalsMap[p.player_id] || 0) + (Number(p.score) || 0);
    }
  });
  const rows = (entriesData || []).map(r => {
    const total = totalsMap[r.profile_id] || 0;
    let statusClass, statusLabel;
    if(!r.alive){
      // Definitive: only ever set by commissioner_finalize_week once a week's scores are locked in.
      // Abbreviated ("ELIM" not "ELIMINATED") to leave more room for a long display name on a
      // narrow phone before the name-truncation below (see survivorsRowsHTML) has to kick in.
      statusClass = 'elim'; statusLabel = `ELIM · WK ${r.eliminated_week}`;
    } else if(isLive && cautionWindowOpen){
      const liveTotal = liveTotalsMap[r.profile_id] || 0;
      statusClass = liveTotal >= threshold ? 'alive' : 'caution';
      statusLabel = liveTotal >= threshold ? 'ALIVE' : 'CAUTION';
    } else {
      statusClass = 'alive'; statusLabel = 'ALIVE';
    }
    return { id: r.profile_id, display_name: r.profiles.display_name, flair_team: r.profiles.flair_team, alive: r.alive, eliminated_week: r.eliminated_week, second_chance_used: r.second_chance_used, total, statusClass, statusLabel };
  }).sort((a,b) => (b.alive - a.alive) || (b.total - a.total) || a.display_name.localeCompare(b.display_name))
    // rank is the entrant's TRUE overall standing, computed once here on the full sorted list --
    // survivorsRowsHTML() below reads r.rank rather than its own array index specifically so the
    // podium badge/hero number stay correct when it's called again with a filtered (searched)
    // subset, where index 0 of the filtered array is very often not actually 1st place.
    .map((r, i) => ({ ...r, rank: i + 1 }));

  // The name group is the one side allowed to shrink (min-width:0 + flex:1 1 auto) --
  // a long display name ellipsizes instead of wrapping or forcing the row wider than the
  // screen, while the points+status side (flex:0 0 auto) always renders in full since
  // "ELIM · WK 12" etc. isn't useful truncated. flair pill/second-chance icon sit outside
  // the truncating inner span so they never get clipped along with a long name.
  // data-pid + .pts-val (and .pts-hero on #1) mirror weekTop5ListHTML's own treatment -- see
  // animateStandingsChanges() below for how they're used, and .rank-badge/.podium-1's CSS
  // comment for why top 3 gets a numbered circle instead of medal emoji.
  function survivorsRowsHTML(list){
    return list.map(r => `
      <div class="lb-row${r.rank <= 3 ? ` podium-${r.rank}` : ''}" data-pid="${r.id}">
        <span style="display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto;">
          ${r.rank <= 3 ? `<span class="rank-badge r${r.rank}">${r.rank}</span>` : ''}
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;${r.flair_team ? `color:${flairNameColor(r.flair_team)};` : ''}">${esc(r.display_name)}</span>
          ${r.flair_team ? flairPillHTML(r.flair_team) : ''}
          ${r.second_chance_used ? secondChanceIconHTML() : ''}
        </span>
        <span class="row" style="gap:8px;width:auto;flex:0 0 auto;flex-wrap:nowrap;">
          <b class="pts-val${r.rank === 1 ? ' pts-hero' : ''}">${fmtPts(r.total)} pts</b>
          <span class="pill ${r.statusClass}">${r.statusLabel}</span>
        </span>
      </div>`).join('') || '<p>No approved players yet.</p>';
  }
  // Compares this render's rows against the last time Standings rendered (module-level
  // prevStandingsSnapshot, null on the very first render of a session so nothing tweens against
  // nothing) and, for any player whose points or rank changed since then, tweens the number
  // and/or pops a brief up/down arrow -- see tweenPoints()/flashRankMove() above. Deliberately
  // NOT called from the search-input handler further down: filtering the list to fewer rows
  // isn't a real data change, and animating every remaining row on each keystroke would look
  // like a bug, not a feature.
  function animateStandingsChanges(){
    const prev = prevStandingsSnapshot;
    const next = {};
    rows.forEach(r => { next[r.id] = { total: r.total, rank: r.rank }; });
    if(prev){
      rows.forEach(r => {
        const before = prev[r.id];
        if(!before) return;
        const rowEl = document.querySelector(`#survivorsList .lb-row[data-pid="${r.id}"]`);
        if(!rowEl) return;
        if(before.total !== r.total){
          const ptsEl = rowEl.querySelector('.pts-val');
          if(ptsEl) tweenPoints(ptsEl, before.total, r.total);
        }
        if(before.rank !== r.rank) flashRankMove(rowEl, before.rank > r.rank ? 'up' : 'down');
      });
    }
    prevStandingsSnapshot = next;
  }

  const liveNote = isLive ? `<p class="estimate-note">Week ${liveWeekNumber} is still in progress — totals update automatically as scores sync in.</p>` : '';
  const standingsDescription = isEliminator
    ? 'Players are ranked by cumulative total points across all weeks. Each week, whoever has the lowest score is cut. The cumulative total is also used for tie breakers on the cut line.'
    : "Ranked by cumulative points across all weeks players are Alive. Total points are irrelevant in this Contest format (Kingmaker Gauntlet) other than bragging rights.";

  body.innerHTML = `
    <div class="card">
      <h3>Standings</h3>
      <p>${standingsDescription}</p>
      ${liveNote}
      <input id="standingsSearch" placeholder="Search players..." style="margin-top:10px;"/>
      <div id="survivorsList" style="margin-top:6px;">${survivorsRowsHTML(rows)}</div>
    </div>`;
  animateStandingsChanges();

  document.getElementById('standingsSearch').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    const filtered = q ? rows.filter(r => r.display_name.toLowerCase().includes(q)) : rows;
    document.getElementById('survivorsList').innerHTML = survivorsRowsHTML(filtered);
  });
}
