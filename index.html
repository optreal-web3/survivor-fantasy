<style>

    --text:#F1F3F8; --text-dim:#8B93A8;
    --alive:#4ADE80; --alive-dim:rgba(74,222,128,0.12);

    --caution:#FBBF24; --caution-dim:rgba(251,191,36,0.12);
    --purple:#8B5CF6; --purple-rgb:139,92,246; --purple-dim:rgba(var(--purple-rgb),0.12); --accent-ink:#fff;
    --border:#262838;
    --bg-grad-end:#242424;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;min-height:100vh;min-height:100dvh;background-image:linear-gradient(180deg, var(--bg) 0%, var(--bg-grad-end) 100%);background-attachment:fixed;}
  .wrap{max-width:640px;margin:0 auto;padding:18px 14px 100px;width:100%;}
  h1,h2{font-family:'Archivo Black',sans-serif;font-weight:400;letter-spacing:0.2px;margin:0;text-transform:uppercase;}
  h1{font-size:26px;line-height:1.15;}
  h2{font-size:20px;line-height:1.15;}
  h3{font-size:11.5px;line-height:1.2;color:var(--purple);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:0;}
  p{line-height:1.5;color:var(--text-dim);margin:6px 0 0;font-size:14.5px;}
  .scoreboard{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .scoreboard .week{font-family:'Archivo Black',sans-serif;font-size:32px;color:var(--purple);line-height:1;}
  .scoreboard .week-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;width:100%;}
  .card.feature{border-color:var(--alive);background:linear-gradient(135deg, rgba(74,222,128,0.08), rgba(var(--purple-rgb),0.06)), var(--surface);box-shadow:0 0 0 1px rgba(74,222,128,0.15) inset;}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  button{font-family:'Inter',sans-serif;font-weight:700;font-size:14.5px;background:var(--purple);color:var(--accent-ink);border:none;border-radius:8px;padding:12px 14px;cursor:pointer;width:100%;touch-action:manipulation;}
  button.secondary{background:transparent;color:var(--text);border:1px solid var(--border);}
  button.danger{background:var(--elim);color:#1a0505;}
  button.small{width:auto;padding:10px 12px;font-size:13px;}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  button:active{transform:translateY(1px);}
  input,select{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px;border-radius:8px;font-size:16px;font-family:'Inter',sans-serif;margin-top:5px;}
  label{font-size:12.5px;color:var(--text-dim);display:block;margin-top:11px;line-height:1.4;}
  .pill{font-size:10.5px;padding:4px 9px;border-radius:5px;font-weight:700;white-space:nowrap;text-transform:uppercase;letter-spacing:0.5px;border:1px solid transparent;}
  .pill.alive{background:var(--alive-dim);color:var(--alive);border-color:var(--alive);}
  .pill.elim{background:var(--elim-dim);color:var(--elim);border-color:var(--elim);}
  .pill.pending{background:var(--pending-dim);color:var(--pending);border-color:var(--pending);}
  .pill.caution{background:var(--caution-dim);color:var(--caution);border-color:var(--caution);}
  .bottom-nav{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;display:flex;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50;}
  @media (min-width:660px){ .bottom-nav{border-left:1px solid var(--border);border-right:1px solid var(--border);border-radius:12px 12px 0 0;bottom:0;} }
  .bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;color:var(--text-dim);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;text-align:center;line-height:1.1;cursor:pointer;touch-action:manipulation;border-radius:8px;}
  .bnav-item.active{color:var(--purple);}
  .bnav-item .icon{line-height:1;}
  .bnav-item .icon svg{width:20px;height:20px;display:block;}
  @media (max-width:360px){ .bnav-item{font-size:8.5px;} .bnav-item .icon svg{width:18px;height:18px;} }
  .slot-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;}
  .slot-label{font-family:'Inter',sans-serif;font-weight:800;font-size:13px;color:var(--purple);text-transform:uppercase;letter-spacing:0.5px;}
  .result-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:14.5px;cursor:pointer;touch-action:manipulation;}
  .result-item:last-child{border-bottom:none;}
  .kickoff-tag{font-size:11.5px;font-weight:700;}
  .lb-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:14.5px;gap:8px;}
  .lb-row:last-child{border-bottom:none;}
  .divider{border:none;border-top:1px solid var(--border);margin:14px 0;}
  .note{font-size:12px;color:var(--text-dim);background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-top:12px;line-height:1.5;border:1px solid var(--border);}
  .banner{background:var(--elim-dim);border:1px solid var(--elim);color:var(--text);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;line-height:1.5;}
  .center{text-align:center;padding:60px 20px;color:var(--text-dim);}
  .stat{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;padding:6px 0;font-size:14px;}
  .stat b{color:var(--text);font-weight:700;}
  .recap-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14.5px;}

  .recap-row .recap-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
  .recap-row .recap-score{flex:0 0 auto;font-weight:700;white-space:nowrap;}

  .scoring-table td:last-child, .scoring-table th:last-child{text-align:right;white-space:nowrap;}

  @media (min-width:640px){ .scores-grid{grid-template-columns:1fr 1fr;} }

  .scoreInput{width:64px;flex:0 0 auto;margin:0;padding:6px 8px;font-size:13px;text-align:right;}
  .est-pill{font-size:9.5px;padding:2px 7px;border-radius:5px;font-weight:800;white-space:nowrap;text-transform:uppercase;letter-spacing:0.4px;background:var(--pending-dim);color:var(--pending);border:1px solid var(--pending);flex:0 0 auto;}
  .muted-link{background:none;border:none;color:var(--text-dim);font-size:13px;padding:6px 0;text-decoration:underline;cursor:pointer;width:auto;}
  .confirm-box{border-top:1px solid var(--border);margin-top:8px;padding-top:8px;}
  .faq-item{border-bottom:1px solid var(--border);padding:11px 0;}
  .faq-item:last-child{border-bottom:none;}
  .faq-q{font-weight:700;font-size:14px;cursor:pointer;color:var(--text);display:flex;justify-content:space-between;align-items:center;gap:10px;touch-action:manipulation;}
  .faq-q::after{content:'+';color:var(--purple);font-size:18px;font-weight:400;flex:0 0 auto;}
  .faq-q.open::after{content:'−';}
  .faq-a{display:none;margin-top:8px;font-size:13.5px;color:var(--text-dim);line-height:1.5;}
  .faq-a.open{display:block;}
  .history-text{color:var(--text);line-height:1.9;}
  .history-sep{color:var(--purple);margin:0 2px;}
  .week-tag{font-size:10.5px;color:var(--text-dim);font-weight:700;white-space:nowrap;}
  .history-empty{font-size:13px;color:var(--text-dim);padding:6px 0;font-style:italic;}
  .app-header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:14px;}
  .app-header .brand-icon{width:150px;height:150px;object-fit:contain;display:block;}
  .app-header.hub-header .brand-icon{width:250px;height:250px;}
  .app-header h1{font-size:22px;line-height:1.2;}
  @media (max-width:400px){ .app-header{gap:6px;margin-bottom:10px;} .app-header h1{font-size:22px;} .app-header .brand-icon{width:130px;height:130px;} .app-header.hub-header .brand-icon{width:180px;height:180px;} }
  .name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .icon-btn{width:26px;height:26px;padding:0;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--text-dim);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .icon-btn svg{width:14px;height:14px;display:block;}
  .icon-btn:active{transform:translateY(1px);}
  .flair-pill{font-size:10px;font-weight:800;padding:3px 8px;border-radius:5px;border:1px solid var(--tile-color,var(--border));color:var(--tile-color,var(--text-dim));white-space:nowrap;letter-spacing:0.4px;}
  .flair-icon{width:25px;height:25px;border-radius:6px;object-fit:cover;flex:0 0 auto;border:1px solid var(--border);}
  .flair-division{margin-top:12px;}
  .flair-division:first-child{margin-top:0;}
  .flair-division-label{font-size:10px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;}
  .flair-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  @media (max-width:420px){ .flair-grid{grid-template-columns:repeat(3,1fr);} }
  .flair-tile{border:1.5px solid var(--border);border-radius:8px;padding:9px 4px;font-family:'Inter',sans-serif;font-weight:800;font-size:12px;letter-spacing:0.3px;background:var(--surface-2);color:var(--tile-color,var(--text));width:100%;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;gap:5px;}
  .flair-tile.selected{border-color:var(--tile-color,var(--purple));box-shadow:0 0 0 1px var(--tile-color,var(--purple)) inset;}
  .flair-tile img{width:18px;height:18px;border-radius:4px;object-fit:cover;flex:0 0 auto;}
  .footer-links{margin-top:24px;padding-top:16px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:14px;font-size:13px;}
  .footer-links a, .footer-links .flink{color:var(--text-dim);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;font-family:'Inter';font-weight:400;width:auto;touch-action:manipulation;}
  .footer-contact{margin-top:10px;font-size:12px;color:var(--text-dim);}
  .hero-banner{position:relative;width:100%;height:10vh;height:clamp(55px,10dvh,240px);display:flex;align-items:center;justify-content:flex-end;padding-right:20px;overflow:hidden;border-bottom:3px solid transparent;margin-bottom:14px;}
  .hero-banner::before{content:'';position:absolute;inset:0;background-image:var(--hb-texture, none);background-size:40px 40px;background-repeat:repeat;pointer-events:none;}
  .hero-banner img{position:relative;max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain;display:block;}
  .legend-quote{clear:both;font-family:'Inter',sans-serif;font-weight:600;text-transform:none;font-size:17px;line-height:1.4;color:var(--purple);font-style:italic;margin:16px 0;padding:14px;border-left:3px solid var(--purple);background:var(--purple-dim);border-radius:0 8px 8px 0;}
  @media (max-width:400px){ h1{font-size:21px;} .scoreboard .week{font-size:27px;} .wrap{padding:14px 10px 90px;} }
  .back-link{background:rgba(var(--purple-rgb),0.1);border:1.5px solid var(--purple);color:var(--purple);font-family:'Inter',sans-serif;font-weight:800;font-size:12px;padding:5px 12px;margin:0;border-radius:20px;cursor:pointer;text-transform:uppercase;letter-spacing:0.5px;width:auto;touch-action:manipulation;display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;animation:hubGlow 2.4s ease-in-out infinite;}
  .back-link:active{transform:translateY(1px);}
  @keyframes hubGlow{ 0%,100%{box-shadow:0 0 0 0 rgba(var(--purple-rgb),0.35);} 50%{box-shadow:0 0 10px 2px rgba(var(--purple-rgb),0.55);} }
  .contest-title-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:nowrap;max-width:100%;}
</style>
</head>

<script>
const SUPABASE_URL = 'https://caehjxogikaekpcrxcoo.supabase.co';
const SUPABASE_KEY = 'sb_publishable__CUibPnjUkkg8LZ6B-ecFA_cY0TJp9P';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------- GLOBAL STATE ----------
let session = null, profile = null;
let contests = [];          // every non-draft contest, for the Hub list
let myEntries = {};         // contest_id -> this player's contest_entries row (only contests they've joined)
let currentContestId = null, currentContest = null, currentEntry = null;
let currentWeek = null, lineupSlots = [], myPicks = [], myAllPicks = [], usedPlayerIds = new Set();
let recentWeekNumber = null, recentWeekPicks = [], recentWeekRow = null, recentWeekClosesAt = null;
let weekGamesMap = {};
let finalizedWeekNumbers = []; // ascending list of week_numbers finalized in the CURRENT contest
// The most recent NOT-yet-finalized week (contest-wide, not player-specific) that already has
// at least one pick in it -- i.e. the week currently being played out / scored live, if any.
// null when there's no such week (e.g. the open week hasn't kicked off yet, or every reached
// week is already finalized). Set by loadFinalizedWeeks(). Lets the Home "Weekly high scores"
// card and the Standings "high scores" card show real-time/estimated scores during the
// weekend instead of waiting until the admin finalizes the week.
let liveWeekNumber = null;
let hsWeekIndex = -1; // index into displayWeekNumbers() currently shown on the Contest Home high-scores slider
const weekTop5Cache = {}; // `${contestId}:${weekNumber}` -> top-5 [{name,total}] array, memoized (finalized weeks only -- see getWeekTop5)
const weekTopPlayersCache = {}; // `${contestId}:${weekNumber}` -> top-5 [{name,position,team,score,pickers}] NFL-player array, memoized (finalized weeks only)
// Which week's score-entry grid is currently shown on the Admin tab -- persists across
// re-renders so it doesn't jump around while editing. Reset to null (re-derived fresh) whenever
// a contest is (re-)entered or a week gets finalized -- see loadContestData() and renderAdmin().
let adminScoreWeek = null;
let screen = 'loading', activeTab = 'hub';
let otpSent = false, pendingEmail = null, pendingName = null, otpCooldownUntil = 0;
let otpResendTimer = null; // interval id for the "Resend code" countdown on the code-entry screen
let nflTeams = []; // reference data: all 32 teams (code/name/division/colors/hero_logo_path), loaded once per session

const app = document.getElementById('app');
const bannerEl = document.getElementById('banner');
let bannerTimeout = null;
function showBanner(msg){
  clearTimeout(bannerTimeout);
  bannerEl.innerHTML = `<div class="banner">${esc(msg)}</div>`;
  bannerTimeout = setTimeout(clearBanner, 10000);
}
function clearBanner(){ clearTimeout(bannerTimeout); bannerTimeout = null; bannerEl.innerHTML = ''; }
function esc(s){ const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
function guard(fn){ return async (...a) => { try { await fn(...a); } catch(e){ showBanner(e.message || String(e)); } }; }

// Monochrome tab icons -- plain line-art SVGs (no built-in color) so each
// tab just inherits the surrounding text color: grey when inactive, the
// app's blue accent when active. Keeps the tab row in the app's own
// palette instead of full-color emoji.
const ICON_PATHS = {
  home: '<path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.8V19a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.8"/><path d="M9.5 20v-6h5v6"/>',
  picks: '<g transform="rotate(-30 12 12)"><path d="M4 12c2-5 6-8 8-8s6 3 8 8c-2 5-6 8-8 8s-6-3-8-8Z"/><path d="M6.5 12h11"/><path d="M10 10.3v3.4"/><path d="M12 10v4"/><path d="M14 10.3v3.4"/></g>',
  standings: '<path d="M4 20V13"/><path d="M12 20V5"/><path d="M20 20v-9"/>',
  prizes: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9"/><path d="M9.7 9.7c0-1.1.9-1.9 2.3-1.9s2.3.8 2.3 1.7c0 2.6-4.6 1.4-4.6 4 0 1 .9 1.9 2.3 1.9s2.3-.8 2.3-1.9"/>',
  faq: '<circle cx="12" cy="12" r="8.5"/><path d="M9.3 9.6a2.7 2.7 0 1 1 4.3 2.2c-.9.6-1.6 1.1-1.6 2.3"/><circle cx="12" cy="16.7" r="0.9" fill="currentColor" stroke="none"/>',
  legend: '<path d="M12 6.2c-1.9-1.3-4.3-2-6.8-2v12.6c2.5 0 4.9.7 6.8 2 1.9-1.3 4.3-2 6.8-2V4.2c-2.5 0-4.9.7-6.8 2Z"/><path d="M12 6.2v12.6"/>',
  pencil: '<path d="M4 20l.7-3.9L15.8 5a1.6 1.6 0 0 1 2.3 0l0.9 0.9a1.6 1.6 0 0 1 0 2.3L7.9 19.3 4 20Z"/><path d="M14.1 6.7l3.2 3.2"/>',
  flair: '<ellipse cx="12" cy="12" rx="9" ry="5.5"/><path d="M5.5 12h13"/><path d="M9 10v1.2M9 13.8v1.2M12 9.3v1.4M12 13.3v1.4M15 10v1.2M15 13.8v1.2"/>',
  admin: '<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-2-1.2L14 3h-4l-.5 2.6a7.4 7.4 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 2 1.2L10 21h4l.5-2.6a7.4 7.4 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z"/>'
};
function tabIcon(key){
  return `<svg class="ticon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[key] || ''}</svg>`;
}

function teamByCode(code){ return nflTeams.find(t => t.code === code) || null; }

// Returns a base64-free data URI for the hero banner's repeating sparkle
// texture, contrast-adapted to the given primary_hex so the same "muted
// but visible" effect holds across every team instead of washing out on
// lighter/more saturated primaries. Uses perceived brightness (0-255,
// standard YIQ-style weighting) to pick white-on-dark vs black-on-light
// stars, then scales opacity up the closer that color sits to a mid grey
// (where a fixed-opacity overlay has the least natural contrast) and back
// down toward the extremes (near-black/near-white, where a light touch is
// already plenty visible).
// Floor raised 2026-09-14: several teams' primary_hex sits at a pure
// extreme (#000000 for ATL/CAR/CIN/LV/PIT, a saturated low-luminance red
// for KC), which drove distanceFromExtreme toward 0 and left the star
// pattern rendering at (or near) the old 0.05 floor -- effectively
// invisible against a same-color background. The floor/scale below were
// raised so even the extreme-color case still shows a clearly visible,
// still-subtle sparkle.
function heroTextureDataURI(hex){
  const h = (hex || '').replace('#', '');
  const r = parseInt(h.substring(0, 2), 16) || 0;
  const g = parseInt(h.substring(2, 4), 16) || 0;
  const b = parseInt(h.substring(4, 6), 16) || 0;
  const brightness = (r * 299 + g * 587 + b * 114) / 1000; // 0 (black) - 255 (white)
  const light = brightness > 150;
  const distanceFromExtreme = light ? (255 - brightness) : brightness; // 0-~150
  const opacity = Math.min(0.09 + (distanceFromExtreme / 150) * 0.08, 0.17).toFixed(2);
  const fill = light ? '#000000' : '#ffffff';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><g transform="translate(8,8)" fill="${fill}" fill-opacity="${opacity}"><path d="M12 0L14.2 9.8L24 12L14.2 14.2L12 24L9.8 14.2L0 12L9.8 9.8Z"/></g></svg>`;
  return `data:image/svg+xml,${encodeURIComponent(svg)}`;
}

// Full-width hero banner: a solid block in the flair team's primary_hex, a
// secondary_hex bottom accent stripe, and a contrast-adaptive sparkle
// texture (see heroTextureDataURI) -- this trio renders for ANY picked
// flair team, logo image or not. A right-justified, height-cropped logo
// graphic is layered on top only when that team has a hero_logo_path set
// (progressive enhancement -- optional, not required for the banner to
// show). Fixed 2026-09-14: an earlier version of this function only
// rendered anything at all when hero_logo_path was set, so clearing every
// team's hero_logo_path (removing the real per-team logo images) also
// blanked the entire banner -- color, stripe, and texture included. That
// was never the intent (the user wanted only the PNG logos gone, not the
// color/texture banner), so the logo image is now the only optional part.
// Lives in the fixed #heroBanner mount just above .wrap (outside its
// 640px max-width), so it's full-bleed on desktop as well as mobile.
// Called after profile loads/changes.
function renderHeroBanner(){
  const el = document.getElementById('heroBanner');
  if(!el) return;
  const team = profile && profile.flair_team ? teamByCode(profile.flair_team) : null;
  if(!team){
    el.innerHTML = '';
    return;
  }
  const texture = heroTextureDataURI(team.primary_hex);
  const logoImg = team.hero_logo_path ? `<img src="images/flair/${team.hero_logo_path}" alt="${esc(team.name)}">` : '';
  el.innerHTML = `<div class="hero-banner" style="background-color:${team.primary_hex};border-bottom-color:${team.secondary_hex};--hb-texture:url('${texture}');">${logoImg}</div>`;
}

// Converts a '#rrggbb' hex string into a bare "r, g, b" triplet, for
// building CSS custom properties usable inside rgba(var(--x-rgb), alpha).
function hexToRgbTriplet(hex){
  const h = (hex || '').replace('#', '');
  const r = parseInt(h.substring(0, 2), 16) || 0;
  const g = parseInt(h.substring(2, 4), 16) || 0;
  const b = parseInt(h.substring(4, 6), 16) || 0;
  return `${r}, ${g}, ${b}`;
}

// Re-themes the app's accent color (buttons, section headers, the week
// counter, FAQ toggle, back-link pill/glow, etc.) to the current flair
// team's secondary_hex, falling back to the original purple when no flair
// is chosen. Deliberately independent of hero_logo_path/renderHeroBanner
// -- every team already has a secondary_hex regardless of banner-image
// rollout, so this works the moment a flair is picked. Does NOT touch
// --pending/--pending-dim, which stay fixed purple: that pair means
// "entry awaiting approval" specifically and must stay visually distinct
// from a team color a player happens to have picked. Sets --accent-ink
// (the button text color) to dark or light based on the accent's own
// brightness, since several teams' secondary colors are near-white and
// white-on-white button text would otherwise be unreadable.
function applyThemeAccent(){
  const team = profile && profile.flair_team ? teamByCode(profile.flair_team) : null;
  const hex = team ? team.secondary_hex : '#8B5CF6';
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16) || 0;
  const g = parseInt(h.substring(2, 4), 16) || 0;
  const b = parseInt(h.substring(4, 6), 16) || 0;
  const brightness = (r * 299 + g * 587 + b * 114) / 1000;
  const root = document.documentElement.style;
  root.setProperty('--purple', hex);
  root.setProperty('--purple-rgb', hexToRgbTriplet(hex));
  root.setProperty('--accent-ink', brightness > 150 ? '#0A0B12' : '#ffffff');
}

// Flair picker: a grid of all 32 teams (grouped by division), each tile

function renderFlairPicker(area){

async function saveFlair(code){
  const { error } = await sb.rpc('update_flair_team', { p_team: code });
  if(error){ showBanner(error.message); return; }
  profile.flair_team = code;
  renderHeroBanner();
  applyThemeAccent();
  showBanner(code ? 'Flair updated.' : 'Flair cleared.');
  render();
}
// Summing float scores (esp. across several weeks) can land on things like
// 289.29999999999995 -- round to 1 decimal for display, drop the .0 when
// it's a whole number.
function fmtPts(n){
  const r = Math.round((Number(n) + Number.EPSILON) * 10) / 10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}

function ctDate(iso){
  return new Intl.DateTimeFormat('en-US', {timeZone:'America/Chicago', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date(iso));
}
function ctTime(iso){
  return new Intl.DateTimeFormat('en-US', {timeZone:'America/Chicago', weekday:'short', hour:'numeric', minute:'2-digit'}).format(new Date(iso)) + ' CT';
}
function isSameDayCT(iso){ return ctDate(iso) === ctDate(new Date().toISOString()); }

// Hub-level: who am I, and what contests exist / have I joined.
async function loadProfile(){
  const { data } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  profile = data;
}
async function loadContests(){
  const { data } = await sb.from('contests').select('*').in('status', ['open','active','completed']).order('created_at');
  contests = data || [];
}
async function loadMyEntries(){

// Contest-level: everything scoped to currentContestId, loaded once a
// contest is entered from the Hub (or created).
async function loadCurrentContest(){

  currentContest = data;
  lineupSlots = ((data && data.roster_slots) || []).slice().sort((a,b) => a.sort_order - b.sort_order);

}
async function loadUsedPlayers(){

  usedPlayerIds = new Set((data||[]).map(p => p.nfl_player_id));
}
async function loadMyAllPicks(){

    .eq('contest_id', currentContestId).eq('player_id', session.user.id).order('week_number');

}
async function loadWeekGames(){
  if(!currentWeek){ weekGamesMap = {}; return; }

  weekGamesMap = {};

}
// Contest Home's "recap" needs the most recent week the player has ANY
// picks in *within this contest*, independent of currentWeek -- this is
// what keeps last week's lineup/score visible after the week flips over.
async function loadRecentWeek(){
  const { data } = await sb.from('picks_with_scores').select('*')
    .eq('contest_id', currentContestId).eq('player_id', session.user.id)
    .order('week_number', { ascending: false }).limit(50);
  if(!data || !data.length){ recentWeekNumber = null; recentWeekPicks = []; recentWeekRow = null; recentWeekClosesAt = null; return; }
  recentWeekNumber = data[0].week_number;
  recentWeekPicks = data.filter(p => p.week_number === recentWeekNumber);
  const [{ data: cwRow }, { data: wkRow }] = await Promise.all([
    sb.from('contest_weeks').select('*').eq('contest_id', currentContestId).eq('week_number', recentWeekNumber).maybeSingle(),
    sb.from('weeks').select('closes_at').eq('week_number', recentWeekNumber).maybeSingle()
  ]);
  recentWeekRow = cwRow;
  recentWeekClosesAt = wkRow ? wkRow.closes_at : null;
}
// Which week (if any) is "live" -- open (not yet finalized) but already has at least one pick
// in it, i.e. currently being played out / scored. Used by the Home "Weekly high scores" card
// and Standings so they can show real-time/estimated numbers during the weekend instead of
// waiting for the admin to finalize the week.
// Perf note (2026-09-15): this used to find liveWeekNumber by looping over every open
// (not-yet-finalized) week, newest-first, and awaiting one COUNT query per week until it found
// one with picks in it. For a contest with several weeks scheduled out (normal once a season's
// underway), that's a chain of sequential round trips to the DB before the loop ever reaches
// the actual live week -- the biggest single contributor to the "Standings/Prizes/entering a
// contest feels slow" delays. Replaced with one query that pulls week_number for every pick in
// any open week at once, then picks the newest week_number that shows up -- same result, one
// round trip no matter how many open weeks exist.
async function loadFinalizedWeeks(){
  const [{ data: finalizedRows }, { data: openRows }] = await Promise.all([
    sb.from('contest_weeks').select('week_number').eq('contest_id', currentContestId).eq('is_finalized', true).order('week_number'),
    sb.from('contest_weeks').select('week_number').eq('contest_id', currentContestId).eq('is_finalized', false).order('week_number', { ascending: false })
  ]);
  finalizedWeekNumbers = (finalizedRows || []).map(w => w.week_number);
  const openWeekNumbers = (openRows || []).map(w => w.week_number); // already newest-first
  liveWeekNumber = null;
  if(openWeekNumbers.length){
    const { data: picksInOpenWeeks } = await sb.from('picks').select('week_number')
      .eq('contest_id', currentContestId).in('week_number', openWeekNumbers);
    const weeksWithPicks = new Set((picksInOpenWeeks || []).map(p => p.week_number));
    liveWeekNumber = openWeekNumbers.find(w => weeksWithPicks.has(w)) ?? null;
  }
  // Default the slider to the most recent displayable week (the live one if there is one,
  // otherwise the most recent finalized week); keep the current position if it's still valid
  // (e.g. after a re-render).
  if(hsWeekIndex < 0 || hsWeekIndex >= displayWeekNumbers().length) hsWeekIndex = displayWeekNumbers().length - 1;
}
// finalizedWeekNumbers plus the live in-progress week (if any and not already finalized) --
// used only by the Home/Standings "high scores" displays, which are fine showing an
// estimate. Cumulative Standings totals and eliminations stay on finalizedWeekNumbers alone.
function displayWeekNumbers(){
  return (liveWeekNumber !== null && !finalizedWeekNumbers.includes(liveWeekNumber))
    ? finalizedWeekNumbers.concat([liveWeekNumber])
    : finalizedWeekNumbers;
}
// Shared by the Contest Home slider, Standings' "latest week" card, and the
// Prizes weekly-history accordion -- one place that turns a week's picks
// into a top-5 [{name,total}] list, memoized per contest+week since
// finalized weeks never change once scored.
// bypassCache: pass true for a week that's still live (scores change every ~15 min as
// sync-player-stats runs) so a stale memoized value doesn't stick around across re-renders.
// Finalized weeks never change once scored, so they're safe to cache indefinitely.
async function getWeekTop5(weekNumber, bypassCache){
  const cacheKey = `${currentContestId}:${weekNumber}`;
  if(!bypassCache && weekTop5Cache[cacheKey]) return weekTop5Cache[cacheKey];
  const { data } = await sb.from('picks_with_scores').select('player_id, score, profiles(display_name)')
    .eq('contest_id', currentContestId).eq('week_number', weekNumber);
  const totals = {};
  (data || []).forEach(p => {
    if(!totals[p.player_id]) totals[p.player_id] = { name: p.profiles?.display_name || '', total: 0 };
    totals[p.player_id].total += Number(p.score) || 0;
  });
  const top5 = Object.values(totals).sort((a,b) => b.total - a.total).slice(0, 5);
  if(!bypassCache) weekTop5Cache[cacheKey] = top5;
  return top5;
}
function weekTop5ListHTML(top5){
  return top5.length ? top5.map((t,i) => `<div class="lb-row"><span>#${i+1} ${esc(t.name)}</span><b style="color:var(--purple);">${fmtPts(t.total)} pts</b></div>`).join('')
    : '<p>No scores yet.</p>';
}
// Top 5 individual NFL players (not entrants) for a given week, by that
// player's own score, plus which of this contest's entrants picked them (a
// real NFL player is very often drafted by more than one entrant in the
// same week) -- this is the "Chosen Stars of the Week" card. A real
// player's weekly score is one fact stored once in week_player_scores
// (global, shared across every contest), so `picks_with_scores` already
// carries the right value for every entrant in THIS contest who drafted
// him -- this dedupes by nfl_player_id, collects every picker's display
// name, and takes the top 5 by score. Memoized per contest+week same as
// getWeekTop5 (bypassCache for the live in-progress week -- see there).
async function getWeekTopPlayers(weekNumber, bypassCache){
  const cacheKey = `${currentContestId}:${weekNumber}`;
  if(!bypassCache && weekTopPlayersCache[cacheKey]) return weekTopPlayersCache[cacheKey];
  const { data } = await sb.from('picks_with_scores').select('nfl_player_id, nfl_player_name, position, team, score, profiles(display_name)')
    .eq('contest_id', currentContestId).eq('week_number', weekNumber);
  const byPlayer = {};
  (data || []).forEach(p => {
    if(p.score === null) return;
    if(!byPlayer[p.nfl_player_id]) byPlayer[p.nfl_player_id] = { name: p.nfl_player_name, position: p.position, team: p.team, score: Number(p.score) || 0, pickers: [] };
    byPlayer[p.nfl_player_id].pickers.push(p.profiles?.display_name || '');
  });
  const top5 = Object.values(byPlayer).sort((a,b) => b.score - a.score).slice(0, 5);
  if(!bypassCache) weekTopPlayersCache[cacheKey] = top5;
  return top5;
}
function weekTopPlayersListHTML(top5){
  return top5.length ? top5.map((p,i) => `
    <div class="lb-row" style="align-items:flex-start;">
      <span>
        <div>#${i+1} ${esc(p.name)} <span style="color:var(--text-dim);">${p.position}${p.team ? ' · ' + esc(p.team) : ''}</span></div>
        <div class="player-score-pickers" style="margin-top:3px;padding-top:0;border-top:none;">Picked by: ${p.pickers.length ? p.pickers.map(esc).join(', ') : '—'}</div>
      </span>
      <b style="color:var(--purple);white-space:nowrap;">${fmtPts(p.score)} pts</b>
    </div>`).join('')
    : '<p>No scores yet.</p>';
}
// Called once, right after entering (or creating, or re-entering) a
// contest from the Hub -- loads everything renderHome/renderPicks/etc need.
// Perf note (2026-09-15): loadCurrentContest/refreshCurrentEntry/loadCurrentWeek each only
// depend on currentContestId/session (already set by the time this runs), not on each other's
// results -- they used to run one after another for no reason, adding three sequential round
// trips before the second batch could even start. Running them together cuts that to one.
async function loadContestData(){
  adminScoreWeek = null; // re-derive fresh (defaulting to the oldest unfinalized week) each time a contest is (re-)entered
  await Promise.all([loadCurrentContest(), refreshCurrentEntry(), loadCurrentWeek()]);
  await Promise.all([loadMyPicks(), loadUsedPlayers(), loadMyAllPicks(), loadWeekGames(), loadRecentWeek(), loadFinalizedWeeks()]);
}

// ---------- AUTH ----------
// Switched from clickable magic links to a typed one-time code (2026-09-14):
// a magic link could be silently consumed by an email client's own "link
// preview" prefetch before the player ever tapped it, which looked like a
// dead/looping sign-in with no clear cause (see supabase-setup.md). A typed
// code can't be prefetched -- nothing but the player ever "enters" it.
// signInWithOtp itself is unchanged by this switch; only the Magic Link
// email template (Supabase dashboard, not this file) and how we verify the
// response differ. sendLoginCode also powers "Resend code" -- same call,
// a fresh code each time.
// Note: the code's actual digit count is set server-side (Supabase Auth ->
// Email OTP length) and isn't hardcoded here -- this project has sent both
// 6 and 8 digits at different times, so the UI below accepts a range
// instead of assuming one exact length.
async function sendLoginCode(email, displayName){
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { data: { display_name: displayName } }
  });
  if(error) throw error;
  pendingEmail = email;
  pendingName = displayName;
  otpSent = true;
  otpCooldownUntil = Date.now() + 60000; // matches Supabase's default per-email resend cooldown
  render();
}
async function verifyLoginCode(code){
  const { error } = await sb.auth.verifyOtp({ email: pendingEmail, token: code, type: 'email' });
  if(error) throw error;
  // onAuthStateChange (below) picks up the new session and moves us into the app.
}
async function signOut(){
  await sb.auth.signOut();
  session = null; profile = null; contests = []; myEntries = {};
  currentContestId = null; currentContest = null; currentEntry = null;
  screen = 'auth'; activeTab = 'hub';
  otpSent = false; pendingEmail = null; pendingName = null; otpCooldownUntil = 0;
  clearInterval(otpResendTimer);
  renderHeroBanner();
  applyThemeAccent();
  render();
}

  if(screen === 'loading'){ app.innerHTML = `<div class="center">Loading…</div>`; return; }

  if(screen === 'app'){

    return renderContestShell();

}

    <p>Enter your name and email below and we'll send a one-time code to sign in — no password to remember. Codes expire after 10 minutes, so check your inbox once you hit send (and check your spam folder too — mark it "Not spam" if it lands there instead).</p>

// Code-entry screen shown right after a code is sent (or resent). Keeps
// pendingEmail/pendingName around so "Resend code" doesn't need the player
// to retype anything, and disables the resend button behind a countdown
// matching Supabase's own per-email rate limit so a too-fast resend tap
// doesn't just trade one confusing error for another.
function renderOtpEntry(){
  app.innerHTML = `
    <div class="app-header"><img class="brand-icon" src="images/degen-king-games-survivor.png" alt="Degen King Games"></div>
    <div class="card">
      <h3>Enter your code</h3>
      <p>We sent a one-time code to <strong>${esc(pendingEmail)}</strong>. Check your spam folder and mark it "Not spam" if it's not in your inbox within a minute or two. The code expires in 10 minutes.</p>
      <label>One-time code</label>
      <input id="otpInput" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="Enter code" autocomplete="one-time-code" />
      <button id="verifyBtn" style="margin-top:16px;">Verify &amp; sign in</button>
      <button class="secondary" id="resendBtn" style="margin-top:10px;">Resend code</button>
      <button class="secondary" id="backBtn" style="margin-top:10px;">Use a different email</button>
    </div>`;

  const input = document.getElementById('otpInput');
  const verifyBtn = document.getElementById('verifyBtn');
  const resendBtn = document.getElementById('resendBtn');
  input.focus();
  input.addEventListener('input', () => { input.value = input.value.replace(/\D/g, '').slice(0, 10); });
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter') verifyBtn.click(); });

  clearInterval(otpResendTimer);
  const tickResend = () => {
    const remaining = Math.ceil((otpCooldownUntil - Date.now()) / 1000);
    if(remaining > 0){
      resendBtn.disabled = true;
      resendBtn.textContent = `Resend code (${remaining}s)`;
    } else {
      resendBtn.disabled = false;
      resendBtn.textContent = 'Resend code';
      clearInterval(otpResendTimer);
    }
  };
  tickResend();
  otpResendTimer = setInterval(tickResend, 1000);

  verifyBtn.onclick = guard(async () => {
    const code = input.value.trim();
    if(code.length < 6){ showBanner('Enter the full code from your email.'); return; }
    await verifyLoginCode(code);
  });
  resendBtn.onclick = guard(async () => {
    if(resendBtn.disabled) return;
    await sendLoginCode(pendingEmail, pendingName);
    showBanner('New code sent.');
  });
  document.getElementById('backBtn').onclick = () => {
    clearInterval(otpResendTimer);
    otpSent = false; pendingEmail = null; pendingName = null;
    render();
  };
}

function contestCardHTML(c){
  const entry = myEntries[c.id];
  const feeLabel = c.is_free ? 'Free' : (c.entry_fee ? `$${Number(c.entry_fee).toLocaleString()} entry` : 'Paid');
  const statusLabel = { open: 'Open for signups', active: 'In progress', completed: 'Completed' }[c.status] || c.status;
  const signupClosed = !!(c.signup_closes_at && new Date(c.signup_closes_at) < new Date());
  const pendingApprovalPill = !c.platform_approved ? `<span class="pill pending" style="margin-left:6px;">AWAITING APPROVAL</span>` : '';

  let actionHTML;
  if(entry){
    const statusPill = !entry.is_approved
      ? `<span class="pill pending">PENDING</span>`
      : entry.alive ? `<span class="pill alive">ALIVE</span>` : `<span class="pill elim">OUT WK ${entry.eliminated_week}</span>`;
    actionHTML = `<span class="row" style="gap:8px;width:auto;flex-wrap:nowrap;">${statusPill}<button class="small" data-enter="${c.id}">Enter</button></span>`;
  } else if(!c.platform_approved){
    actionHTML = `<button class="small secondary" disabled>Awaiting approval</button>`;
  } else if(c.status !== 'open' || signupClosed){
    actionHTML = `<button class="small secondary" disabled>Signups closed</button>`;
  } else {
    actionHTML = `<button class="small" data-join="${c.id}">Join</button>`;
  }

  return `
    <div class="lb-row" style="flex-wrap:wrap;">
      <span>
        <div style="color:var(--text);font-weight:700;">${esc(c.name)}${pendingApprovalPill}</div>
        <div style="color:var(--text-dim);font-size:12px;margin-top:2px;">${esc(String(c.sport).toUpperCase())} · ${feeLabel} · ${statusLabel}</div>
      </span>
      ${actionHTML}
    </div>`;
}

// Contest Home is a status/profile view scoped to the current contest:
// alive state and a recap of the most recently *played* week (independent
// of whether a new week has opened). It never depends on currentWeek/
// closes_at on its own, so it has nothing to "flip" out from under a
// player -- the recap simply stays until a newer week's picks replace it.
// Building this week's lineup, and this contest's pick history (moved here
// 2026-09-15 so players can see who's already used on the same page where
// they're picking), both live on the Picks tab (see renderPicks below).
async function renderHome(body){
  const { data: contestRow } = await sb.from('contests').select('*').eq('id', currentContestId).maybeSingle();
  if(contestRow) currentContest = contestRow;
  const threshold = contestRow?.weekly_threshold ?? 100;

  let statusHTML = '';
  if(!currentEntry){
    const signupClosed = !!(contestRow?.signup_closes_at && new Date(contestRow.signup_closes_at) < new Date());
    const canJoin = contestRow?.status === 'open' && !signupClosed;
    statusHTML = `
      <div class="card">
        <h3>You haven't joined this contest</h3>
        <p>${canJoin ? "Join below to start picking." : "Signups for this contest aren't currently open."}</p>
        ${canJoin ? '<button id="joinFromHomeBtn" style="margin-top:10px;">Join this contest</button>' : ''}
      </div>`;
  } else if(!currentEntry.alive){
    // Second-chance rebuy (added 2026-09-15): a player who's eliminated can
    // self-serve request a rebuy for one week after their own elimination
    // (eliminated_week + 1), as long as that's still within
    // contests.second_chance_min_week -- see request_second_chance() for
    // the exact server-side rule this mirrors. The request just flags it
    // for the commissioner to confirm (Admin tab) once they've verified
    // re-payment -- it doesn't reinstate the player on its own.
    const scMinWeek = contestRow?.second_chance_min_week ?? 5;
    const scDeadlineWeek = currentEntry.eliminated_week + 1;
    const scWindowOpen = !!currentWeek && currentEntry.eliminated_week <= scMinWeek && currentWeek.week_number <= scDeadlineWeek;
    if(currentEntry.second_chance_requested_at){
      statusHTML = `
        <div class="card">
          <h3>You're out</h3>
          <p>Eliminated in week ${currentEntry.eliminated_week}.</p>
          <p>Second-chance rebuy requested — waiting on the admin to confirm your payment.</p>
          <button class="small secondary" id="cancelScBtn" style="margin-top:10px;">Cancel request</button>
        </div>`;
    } else if(!currentEntry.second_chance_used && scWindowOpen){
      statusHTML = `
        <div class="card">
          <h3>You're out</h3>
          <p>Eliminated in week ${currentEntry.eliminated_week}.</p>
          <button id="useSecondChanceBtn" style="margin-top:10px;">Use second-chance rebuy</button>
          <p class="estimate-note">Available through week ${scDeadlineWeek} only — same entry fee, added to the prize pool.</p>
          <div id="scConfirmArea"></div>
        </div>`;
    } else {
      statusHTML = `<div class="card"><h3>You're out</h3><p>Eliminated in week ${currentEntry.eliminated_week}. Thanks for playing — check the standings tab for where things landed.</p></div>`;
    }
  } else if(!currentEntry.is_approved){
    statusHTML = `<div class="card"><h3>Pending approval</h3><p>Your entry hasn't been approved yet — check with this contest's admin.</p></div>`;
  } else if(currentWeek){
    statusHTML = `<div class="card"><h3>You're alive</h3><p>Head to the Picks tab to build your lineup for week ${currentWeek.week_number}.</p></div>`;
  } else {
    statusHTML = `<div class="card"><h3>You're alive</h3><p>There's no open week right now — check back once the next one opens.</p></div>`;
  }

  let recapHTML = '';
  if(recentWeekNumber){
    const isFinal = !!recentWeekRow?.is_finalized;
    const recapSlotsHTML = lineupSlots.map(slot => {
      const pick = recentWeekPicks.find(p => p.slot === slot.slot);
      if(!pick){
        return `<div class="recap-row"><span class="slot-label">${slot.slot}</span><span class="recap-name" style="color:var(--text-dim);">Not filled</span></div>`;
      }
      const scoreColor = pick.result === 'pass' ? 'var(--alive)' : pick.result === 'fail' ? 'var(--elim)' : 'var(--text-dim)';
      const scoreText = pick.score !== null ? `${fmtPts(pick.score)} pts` : 'Pending';
      const estTag = (pick.score !== null && pick.source === 'computed') ? ' <span class="est-pill" title="Auto-filled from live NFL stats — the commissioner hasn\'t reviewed it yet">Est.</span>' : '';
      return `
        <div class="recap-row">
          <span class="slot-label">${slot.slot}</span>
          <span class="recap-name">${esc(pick.nfl_player_name)} <span style="color:var(--text-dim);">(${esc(pick.team)})</span></span>
          <span class="recap-score" style="color:${scoreColor};">${scoreText}${estTag}</span>
        </div>`;
    }).join('');

    // Reflect scores the moment the admin saves them (picks_with_scores
    // already carries whatever's in week_player_scores), not just once the
    // whole week is finalized -- so this sums whatever's scored so far
    // rather than gating on every slot being done.
    const scoredCount = recentWeekPicks.filter(p => p.score !== null).length;
    const currentTotal = scoredCount > 0 ? recentWeekPicks.reduce((sum,p) => sum + (Number(p.score) || 0), 0) : null;
    const fullyScored = scoredCount === lineupSlots.length && lineupSlots.length > 0;

    // Sync-cadence + last-updated note (2026-09-14): scores refresh on a
    // 15-minute cron gated to each week's own real game window (see
    // supabase-setup.md's "Automated scoring" section) -- this tells
    // players when that window closes for THIS week (closes_at + the
    // sync's 24h post-window buffer) and when a score here last changed,
    // computed from whichever pick in this week has the newest
    // score_updated_at (now exposed by picks_with_scores).
    const syncWindowEndIso = recentWeekClosesAt ? new Date(new Date(recentWeekClosesAt).getTime() + 24*60*60*1000).toISOString() : null;
    const lastScoreUpdate = recentWeekPicks.reduce((max,p) => {
      if(!p.score_updated_at) return max;
      const t = new Date(p.score_updated_at);
      return (!max || t > max) ? t : max;
    }, null);

    recapHTML = `
      <div class="card">
        <h3>Week ${recentWeekNumber} recap</h3>
        ${!isFinal ? '<p>Scoring in progress — the admin hasn\'t finalized this week yet.</p>' : ''}
        ${recapSlotsHTML}
        ${currentTotal !== null ? `
          <div class="stat" style="margin-top:10px;"><span>${isFinal ? 'Total' : 'Current total'}</span><b style="color:${currentTotal >= threshold ? 'var(--alive)' : 'var(--elim)'}">${fmtPts(currentTotal)} pts</b></div>
          ${!isFinal ? `<p class="estimate-note">${fullyScored ? 'Estimated' : 'Projected'} — not final until the week is finalized.</p>` : ''}
          ${!isFinal ? `<p class="estimate-note">Scores refresh automatically every 15 minutes during game days. Last updated ${ctTime(lastScoreUpdate.toISOString())}.` : ''}</p>` : ''}
        <div class="stat" style="margin-top:${currentTotal !== null ? '4px' : '10px'};"><span>Threshold to advance</span><b>${threshold}+ pts</b></div>
        ${dkScoringHTML('recap')}
      </div>`;
  }

  const highScoresHTML = await renderHighScoresCardHTML();

  body.innerHTML = `
    <div class="scoreboard">
      <div>${playerNameHeaderHTML()}</div>
      <div style="text-align:right;"><div class="week-label">Week</div><div class="week">${currentWeek ? currentWeek.week_number : (recentWeekNumber ?? '—')}</div></div>
    </div>
    <div id="nameEditArea"></div>
    <div id="flairEditArea"></div>
    ${statusHTML}
    ${recapHTML}
    ${highScoresHTML}
  `;
  wireHighScoresCard(body);
  wireNameEdit(body);
  wireFlairPicker(body);
  wireDkScoringAccordion();
  const joinBtn = document.getElementById('joinFromHomeBtn');
  if(joinBtn){
    joinBtn.onclick = guard(async () => {
      const { error } = await sb.rpc('join_contest', { p_contest_id: currentContestId });
      if(error){ showBanner(error.message); return; }
      await loadMyEntries();
      await loadContestData();
      render();
    });
  }
  // Second-chance rebuy: request (with an inline confirm step, since it
  // implies committing to pay the entry fee again) or cancel a pending one.
  const useScBtn = document.getElementById('useSecondChanceBtn');
  if(useScBtn){
    useScBtn.onclick = () => {
      const area = document.getElementById('scConfirmArea');
      area.innerHTML = `
        <div class="confirm-box">
          <p style="color:var(--text);">This lets the admin know you want to buy back in for the same entry fee — they'll confirm once you've paid. Continue?</p>
          <div class="row" style="gap:8px;margin-top:6px;">
            <button class="small secondary" id="scCancelConfirm" style="flex:1;">Cancel</button>
            <button class="small" id="scConfirmRequest" style="flex:1;">Request rebuy</button>
          </div>
        </div>`;
      document.getElementById('scCancelConfirm').onclick = () => { area.innerHTML = ''; };
      document.getElementById('scConfirmRequest').onclick = guard(async () => {
        const { error } = await sb.rpc('request_second_chance', { p_contest_id: currentContestId });
        if(error){ showBanner(error.message); return; }
        showBanner('Second-chance rebuy requested — the admin will confirm once you\'ve paid.');
        await refreshCurrentEntry();
        render();
      });
    };
  }
  const cancelScBtn = document.getElementById('cancelScBtn');
  if(cancelScBtn){
    cancelScBtn.onclick = guard(async () => {
      const { error } = await sb.rpc('cancel_second_chance_request', { p_contest_id: currentContestId });
      if(error){ showBanner(error.message); return; }
      showBanner('Request canceled.');
      await refreshCurrentEntry();
      render();
    });
  }
}

// Weekly high-scores card, used on Contest Home with prev/next arrows
// through every finalized week in this contest, PLUS (2026-09-15) the
// live in-progress week if there is one -- scores update as
// sync-player-stats runs every 15 minutes, tagged "Live" until the admin
// finalizes that week. Scores live permanently on the finalized `picks`
// rows (nothing ever deletes them), so this is just a read + client-side
// sum -- no separate storage needed.
async function renderHighScoresCardHTML(){
  const weeks = displayWeekNumbers();
  if(!weeks.length){
    return `<div class="card"><h3>Weekly high scores</h3><p>Nothing to show yet — once this week's games get underway (or the admin finalizes a week), scores will show up here.</p></div>`;
  }
  if(hsWeekIndex < 0 || hsWeekIndex >= weeks.length) hsWeekIndex = weeks.length - 1;
  const wk = weeks[hsWeekIndex];
  const isLive = wk === liveWeekNumber && !finalizedWeekNumbers.includes(wk);
  const [top5, topPlayers] = await Promise.all([getWeekTop5(wk, isLive), getWeekTopPlayers(wk, isLive)]);
  const liveTag = isLive ? ' <span class="est-pill" title="Live and unofficial — updates as scores sync every 15 minutes, not final until the admin finalizes the week">Live</span>' : '';
  return `
    <div class="card">
      <div class="row">
        <h3>Week ${wk} high scores${liveTag}</h3>
        <span class="row" style="gap:6px;width:auto;">
          <button class="small secondary" id="hsPrev" ${hsWeekIndex <= 0 ? 'disabled' : ''}>‹</button>
          <button class="small secondary" id="hsNext" ${hsWeekIndex >= weeks.length - 1 ? 'disabled' : ''}>›</button>
        </span>
      </div>
      <div style="margin-top:8px;">${weekTop5ListHTML(top5)}</div>
      <div class="divider"></div>
      <h3>Chosen Stars of the Week</h3>
      <p style="margin-top:2px;">Top 5 individual NFL scores among everyone's picks this week.</p>
      <div style="margin-top:8px;">${weekTopPlayersListHTML(topPlayers)}</div>
    </div>`;
}
function wireHighScoresCard(body){
  const prev = document.getElementById('hsPrev'), next = document.getElementById('hsNext');
  if(prev) prev.onclick = async () => { hsWeekIndex--; await renderHome(body); };
  if(next) next.onclick = async () => { hsWeekIndex++; await renderHome(body); };
}

// Picks is the action tab: building/locking this week's lineup within the
// current contest.
async function renderPicks(body){
  if(!currentWeek){
    body.innerHTML = `
      <div class="card"><h3>No active week</h3><p>There's no open week right now — check back once the next one opens.</p></div>
      ${renderPickHistoryHTML()}
    `;
    wirePickHistoryAccordion();
    return;
  }
  const { data: contestRow } = await sb.from('contests').select('*').eq('id', currentContestId).maybeSingle();
  if(contestRow) currentContest = contestRow;
  const threshold = contestRow?.weekly_threshold ?? 100;
  const now = new Date();
  const windowOpen = now <= new Date(currentWeek.closes_at);

  let statusHTML = '';
  if(!currentEntry){
    statusHTML = `<div class="card"><h3>You haven't joined this contest</h3><p>Join from the Home tab to start picking.</p></div>`;
  } else if(!currentEntry.alive){
    statusHTML = `<div class="card"><h3>You're out</h3><p>Eliminated in week ${currentEntry.eliminated_week}. Thanks for playing — check the standings tab for where things landed.</p></div>`;
  } else if(!currentEntry.is_approved){
    statusHTML = `<div class="card"><h3>Pending approval</h3><p>Your entry hasn't been approved yet — check with this contest's admin.</p></div>`;
  } else if(!windowOpen){
    statusHTML = `<div class="card"><h3>Picks are closed</h3><p>Week ${currentWeek.week_number} closed ${ctTime(currentWeek.closes_at)}.</p></div>`;
  }

  const canPick = !!(currentEntry?.alive && currentEntry?.is_approved && windowOpen);

  const slotsHTML = lineupSlots.map(slot => {
    const pick = myPicks.find(p => p.slot === slot.slot);
    if(pick){
      // Match Contest Home's coloring: only a finalized pass/fail result gets
      // alive/elim colors -- a pending or still-computed score (result is
      // null before finalization) stays neutral instead of defaulting to
      // "fail" red, which is what this used to do.
      const scoreColor = pick.result === 'pass' ? 'var(--alive)' : pick.result === 'fail' ? 'var(--elim)' : 'var(--text-dim)';
      const estTag = (pick.score !== null && pick.source === 'computed') ? ' <span class="est-pill" title="Auto-filled from live NFL stats — the commissioner hasn\'t reviewed it yet">Est.</span>' : '';
      return `
        <div class="slot-card">
          <div class="row"><span class="slot-label">${slot.slot}</span><span class="pill alive">LOCKED</span></div>
          <p style="color:var(--text);margin-top:4px;">${esc(pick.nfl_player_name)} <span style="color:var(--text-dim)">(${esc(pick.team)})</span></p>
          ${pick.score !== null ? `<p>Score: <strong style="color:${scoreColor};">${fmtPts(pick.score)}</strong>${estTag}</p>` : `<p>Score pending</p>`}
        </div>`;
    }
    if(!canPick){
      return `<div class="slot-card"><span class="slot-label">${slot.slot}</span><p>Not filled</p></div>`;
    }
    return `
      <div class="slot-card">
        <span class="slot-label">${slot.slot}</span>
        <input placeholder="Search ${slot.position}..." class="slotSearch" data-slot="${slot.slot}" data-position="${slot.position}" autocomplete="off"/>
        <div class="results" id="results-${slot.slot}"></div>
      </div>`;
  }).join('');

  const totalScored = myPicks.length && myPicks.every(p => p.score !== null) && myPicks.length === lineupSlots.length
    ? myPicks.reduce((sum,p) => sum + Number(p.score), 0)
    : null;

  body.innerHTML = `
    <div class="scoreboard">
      <div>${playerNameHeaderHTML()}</div>
      <div style="text-align:right;"><div class="week-label">Week</div><div class="week">${currentWeek.week_number}</div></div>
    </div>
    <div id="nameEditArea"></div>
    <div id="flairEditArea"></div>
    ${statusHTML}
    <div class="card ${myPicks.length === lineupSlots.length && lineupSlots.length > 0 ? 'feature' : ''}">
      <h3>Your lineup</h3>
      <div class="note">Once locked, a pick can't be changed. Slots lock independently — you can fill them one at a time up until your selected player's kickoff time.</div>
      ${myPicks.length === lineupSlots.length && lineupSlots.length > 0 ? '<span class="pill alive" style="margin-top:6px;display:inline-block;">Team locked in</span>' : ''}
      ${slotsHTML}
      <div class="stat" style="margin-top:10px;"><span>Threshold to advance</span><b>${threshold}+ pts</b></div>
      ${totalScored !== null ? `<div class="stat"><span>Your total this week</span><b style="color:${totalScored >= threshold ? 'var(--alive)' : 'var(--elim)'}">${fmtPts(totalScored)} pts</b></div>` : ''}
      ${totalScored !== null && myPicks.some(p => p.source === 'computed') ? '<p class="estimate-note">Includes auto-filled ("Est.") score(s) not yet reviewed by the commissioner.</p>' : ''}
    </div>
    ${renderPickHistoryHTML()}
  `;

  document.querySelectorAll('.slotSearch').forEach(input => {
    let debounce;
    input.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => runSearch(input.dataset.slot, input.dataset.position, input.value), 250);
    });
  });
  wireNameEdit(body);
  wireFlairPicker(body);
  wirePickHistoryAccordion();
}

async function runSearch(slot, position, query){
  const resultsEl = document.getElementById(`results-${slot}`);
  if(!query || query.length < 2){ resultsEl.innerHTML = ''; return; }
  const { data } = await sb.from('nfl_players').select('id, full_name, team')
    .eq('position', position).eq('active', true).ilike('full_name', `%${query}%`).limit(30);
  const now = Date.now();
  const options = (data || [])
    .filter(p => !usedPlayerIds.has(p.id))
    .map(p => ({ ...p, kickoff: weekGamesMap[p.team] || null }))
    .filter(p => p.kickoff && new Date(p.kickoff).getTime() > now)
    .sort((a,b) => a.full_name.localeCompare(b.full_name))
    .slice(0, 12);

  if(options.length === 0){
    resultsEl.innerHTML = `<p style="margin-top:8px;">No available, not-yet-started ${position}s match "${esc(query)}".</p>`;
    return;
  }
  resultsEl.innerHTML = options.map(p => {
    const color = isSameDayCT(p.kickoff) ? 'var(--elim)' : 'var(--alive)';
    return `<div class="result-item" data-id="${p.id}" data-name="${esc(p.full_name)}" data-team="${esc(p.team)}">
      <span>${esc(p.full_name)} <span style="color:var(--text-dim)">(${esc(p.team)})</span></span>
      <span class="kickoff-tag" style="color:${color}">${ctTime(p.kickoff)}</span>
    </div>`;
  }).join('');
  resultsEl.querySelectorAll('.result-item').forEach(el => {
    el.onclick = () => {
      const { id, name, team } = el.dataset;
      showPickConfirm(slot, id, name, team);
    };
  });
}

function showPickConfirm(slot, id, name, team){
  const resultsEl = document.getElementById(`results-${slot}`);
  resultsEl.innerHTML = `
    <div class="confirm-box">
      <p style="color:var(--text);">Lock in <strong>${esc(name)}</strong> (${esc(team)}) for ${slot}? This can't be changed once submitted.</p>
      <div class="row" style="gap:8px;margin-top:6px;">
        <button class="small secondary" id="cancelPick" style="flex:1;">Cancel</button>
        <button class="small" id="confirmPick" style="flex:1;">Confirm pick</button>
      </div>
    </div>`;
  document.getElementById('cancelPick').onclick = () => { resultsEl.innerHTML = ''; };
  document.getElementById('confirmPick').onclick = guard(async () => {
    const { error } = await sb.rpc('submit_slot_pick', { p_contest_id: currentContestId, p_week: currentWeek.week_number, p_slot: slot, p_player_ref: id });
    if(error){ showBanner(error.message); return; }
    await Promise.all([loadMyPicks(), loadUsedPlayers(), loadMyAllPicks(), loadRecentWeek()]);
    render();
  });
}

async function renderStandings(body){
  body.innerHTML = `<div class="center">Loading standings…</div>`;
  const [ , { data: contestRow } ] = await Promise.all([
    loadFinalizedWeeks(),
    sb.from('contests').select('*').eq('id', currentContestId).maybeSingle()
  ]);
  if(contestRow) currentContest = contestRow;
  const threshold = contestRow?.weekly_threshold ?? 100;
  const lastFinalizedWeek = finalizedWeekNumbers.length ? finalizedWeekNumbers[finalizedWeekNumbers.length - 1] : null;
  // The live in-progress week (if any) counts toward the ranking too, same
  // "push real-time scores" idea as the Home tab's high-scores card -- no
  // separate "Week N high scores" card here anymore, that lives on Home.
  const isLive = liveWeekNumber !== null && !finalizedWeekNumbers.includes(liveWeekNumber);
  const rankWeeks = displayWeekNumbers();

  // Perf note (2026-09-15): eliminatedHTML's query, entriesData, and allPicks used to each be
  // awaited one after another even though none of them depend on each other or on the contest
  // row fetched above -- fired together instead, same idea as loadContestData's fix.
  const [{ data: eliminated }, { data: entriesData }, { data: allPicks }] = await Promise.all([
    lastFinalizedWeek
      ? sb.from('contest_entries').select('eliminated_week, profiles!inner(display_name)')
          .eq('contest_id', currentContestId).eq('is_approved', true).eq('eliminated_week', lastFinalizedWeek)
      : Promise.resolve({ data: null }),
    sb.from('contest_entries').select('profile_id, alive, eliminated_week, profiles!inner(display_name)')
      .eq('contest_id', currentContestId).eq('is_approved', true),
    rankWeeks.length
      ? sb.from('picks_with_scores').select('player_id, week_number, score')
          .eq('contest_id', currentContestId).in('week_number', rankWeeks)
      : Promise.resolve({ data: null })
  ]);

  let eliminatedHTML = '';
  if(lastFinalizedWeek){
    eliminatedHTML = `
      <div class="card">
        <h3>Eliminated week ${lastFinalizedWeek}</h3>
        ${(eliminated||[]).map(e => `<div class="lb-row"><span>${esc(e.profiles.display_name)}</span><span class="pill elim">ELIMINATED</span></div>`).join('') || '<p>No one was eliminated this week.</p>'}
      </div>`;
  }

  // Cumulative points: sum every scored pick across all finalized weeks plus
  // the live in-progress week (if any), per player -- so the ranking moves
  // in real time as scores sync in, not just after each week is finalized.
  // liveTotalsMap tracks just the live week's total per player, which is
  // what decides the Caution/Alive pill below (a weekly threshold check,
  // not a cumulative one).
  let totalsMap = {}, liveTotalsMap = {};
  (allPicks || []).forEach(p => {
    totalsMap[p.player_id] = (totalsMap[p.player_id] || 0) + (Number(p.score) || 0);
    if(isLive && p.week_number === liveWeekNumber){
      liveTotalsMap[p.player_id] = (liveTotalsMap[p.player_id] || 0) + (Number(p.score) || 0);
    }
  });
  const rows = (entriesData || []).map(r => {
    const total = totalsMap[r.profile_id] || 0;
    let statusClass, statusLabel;
    if(!r.alive){
      // Definitive: only ever set by commissioner_finalize_week once a week's scores are locked in.
      statusClass = 'elim'; statusLabel = `ELIMINATED · WK ${r.eliminated_week}`;
    } else if(isLive){
      const liveTotal = liveTotalsMap[r.profile_id] || 0;
      statusClass = liveTotal >= threshold ? 'alive' : 'caution';
      statusLabel = liveTotal >= threshold ? 'ALIVE' : 'CAUTION';
    } else {
      statusClass = 'alive'; statusLabel = 'ALIVE';
    }
    return { id: r.profile_id, display_name: r.profiles.display_name, alive: r.alive, eliminated_week: r.eliminated_week, total, statusClass, statusLabel };
  }).sort((a,b) => (b.alive - a.alive) || (b.total - a.total) || a.display_name.localeCompare(b.display_name));

  function survivorsRowsHTML(list){
    return list.map(r => `
      <div class="lb-row">
        <span>${esc(r.display_name)}</span>
        <span class="row" style="gap:8px;width:auto;">
          <b style="color:var(--purple);">${fmtPts(r.total)} pts</b>
          <span class="pill ${r.statusClass}">${r.statusLabel}</span>
        </span>
      </div>`).join('') || '<p>No approved players yet.</p>';
  }

  const liveNote = isLive ? `<p class="estimate-note">Live and unofficial — includes week ${liveWeekNumber} scores as they sync in, updated every ~15 minutes. Rankings and Caution/Alive status may shift until the admin finalizes the week.</p>` : '';

  body.innerHTML = `
    ${eliminatedHTML}
    <div class="card">
      <h3>Standings</h3>
      <p>Ranked by cumulative points across every finalized week${isLive ? ' plus the current live week' : ''} in this contest.</p>
      ${liveNote}
      <input id="standingsSearch" placeholder="Search players..." style="margin-top:10px;"/>
      <div id="survivorsList" style="margin-top:6px;">${survivorsRowsHTML(rows)}</div>
    </div>`;

  document.getElementById('standingsSearch').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    const filtered = q ? rows.filter(r => r.display_name.toLowerCase().includes(q)) : rows;
    document.getElementById('survivorsList').innerHTML = survivorsRowsHTML(filtered);
  });
}

async function renderPrizes(body){
  body.innerHTML = `<div class="center">Loading…</div>`;
  const [ , [{ data: contestRow }, { count }, { count: aliveCount }, { count: secondChanceCount }] ] = await Promise.all([
    loadFinalizedWeeks(),
    Promise.all([
      sb.from('contests').select('*').eq('id', currentContestId).single(),
      sb.from('contest_entries').select('profile_id', { count: 'exact', head: true }).eq('contest_id', currentContestId).eq('is_approved', true),
      sb.from('contest_entries').select('profile_id', { count: 'exact', head: true }).eq('contest_id', currentContestId).eq('is_approved', true).eq('alive', true),
      sb.from('contest_entries').select('profile_id', { count: 'exact', head: true }).eq('contest_id', currentContestId).eq('second_chance_used', true)
    ])
  ]);
  currentContest = contestRow;
  const fee = contestRow.entry_fee || 0;
  const total = fee * ((count || 0) + (secondChanceCount || 0));
  const organizer = total * contestRow.organizer_pct / 100;
  const weekly = total * contestRow.weekly_pct / 100;
  const grand = total * contestRow.grand_pct / 100;
  const weeks = contestRow.weekly_prize_end_week || 1;
  const perWeek = weekly / weeks;
  const survivors = aliveCount || 0;
  const perSurvivor = survivors > 0 ? grand / survivors : 0;
  const money = n => '$' + n.toLocaleString(undefined, { maximumFractionDigits: 2 });

  body.innerHTML = `
    <div class="card">
      <h3>Prize pool</h3>
      <div class="stat"><span>Entry fee</span><b>${fee ? money(fee) : '—'}</b></div>
      <div class="stat"><span>Approved entrants</span><b>${count || 0}</b></div>
      ${secondChanceCount ? `<div class="stat"><span>Second-chance buy-ins</span><b>${secondChanceCount}</b></div>` : ''}
      <div class="stat"><span>Total pool</span><b>${money(total)}</b></div>
      <div class="divider"></div>
      <div class="stat"><span>Grand prize pool (${contestRow.grand_pct}%)</span><b>${money(grand)}</b></div>
      <div class="stat"><span>&nbsp;&nbsp;→ if the season ended today (${survivors} still alive)</span><b>${survivors > 0 ? `${money(perSurvivor)} each` : '—'}</b></div>
      <div class="stat"><span>Weekly prizes (${contestRow.weekly_pct}%)</span><b>${money(weekly)} total</b></div>
      <div class="stat"><span>&nbsp;&nbsp;→ per week, weeks 1–${weeks}</span><b>${money(perWeek)}</b></div>
      <div class="note">Weekly prizes are paid weeks 1 through ${weeks}. Totals update automatically as more players are approved.</div>
      <div class="note">The grand prize pays 100% to whoever is still alive at the end — split evenly if more than one player survives to the finish.</div>
      <div class="note">For transparency: ${contestRow.organizer_pct}% of entry fees (${money(organizer)}) goes toward running this contest — hosting, tools, and the time spent operating it week to week.</div>
    </div>
    <div class="card">
      <h3>Weekly high score history</h3>
      <p>Top 5 scores for every finalized week in this contest — the reference for awarding weekly prizes.</p>
      ${finalizedWeekNumbers.length ? finalizedWeekNumbers.slice().reverse().map(w => `
        <div class="faq-item">
          <div class="faq-q whs-q" data-week="${w}">Week ${w}</div>
          <div class="faq-a" id="whs-a-${w}"><p>Loading…</p></div>
        </div>`).join('') : '<p>No weeks finalized yet.</p>'}
    </div>`;

  document.querySelectorAll('.whs-q').forEach(el => {
    el.onclick = async () => {
      const w = el.dataset.week;
      const ans = document.getElementById(`whs-a-${w}`);
      const open = ans.classList.toggle('open');
      el.classList.toggle('open', open);
      if(open && !ans.dataset.loaded){
        const top5 = await getWeekTop5(Number(w));
        ans.innerHTML = weekTop5ListHTML(top5);
        ans.dataset.loaded = '1';
      }
    };
  });
}
