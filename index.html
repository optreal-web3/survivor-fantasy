<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0B12">
<title>Survivor Fantasy Challenge | surfan.win</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0A0B12; --surface:#12131C; --surface-2:#1A1B28;
    --text:#F1F3F8; --text-dim:#8B93A8;
    --alive:#4ADE80; --alive-dim:rgba(74,222,128,0.12);
    --elim:#F76464; --elim-dim:rgba(247,100,100,0.12);
    --pending:#8B5CF6; --pending-dim:rgba(139,92,246,0.12);
    --purple:#8B5CF6;
    --border:#262838;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;min-height:100vh;min-height:100dvh;background-image:radial-gradient(circle at 15% 0%, rgba(139,92,246,0.08), transparent 40%),radial-gradient(circle at 85% 10%, rgba(139,92,246,0.06), transparent 35%);}
  .wrap{max-width:640px;margin:0 auto;padding:18px 14px 100px;width:100%;}
  h1,h2{font-family:'Archivo Black',sans-serif;font-weight:400;letter-spacing:0.2px;margin:0;text-transform:uppercase;}
  h1{font-size:26px;line-height:1.15;}
  h2{font-size:20px;line-height:1.15;}
  h3{font-size:11.5px;line-height:1.2;color:var(--pending);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:0;}
  p{line-height:1.5;color:var(--text-dim);margin:6px 0 0;font-size:14.5px;}
  .scoreboard{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .scoreboard .week{font-family:'Archivo Black',sans-serif;font-size:32px;color:var(--pending);line-height:1;}
  .scoreboard .week-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;width:100%;}
  .card.feature{border-color:var(--alive);background:linear-gradient(135deg, rgba(74,222,128,0.06), rgba(139,92,246,0.05));box-shadow:0 0 0 1px rgba(74,222,128,0.15) inset;}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  button{font-family:'Inter',sans-serif;font-weight:700;font-size:14.5px;background:var(--purple);color:#fff;border:none;border-radius:8px;padding:12px 14px;cursor:pointer;width:100%;touch-action:manipulation;}
  button.secondary{background:transparent;color:var(--text);border:1px solid var(--border);}
  button.danger{background:var(--elim);color:#1a0505;}
  button.small{width:auto;padding:10px 12px;font-size:13px;}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  button:active{transform:translateY(1px);}
  input,select{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px;border-radius:8px;font-size:16px;font-family:'Inter',sans-serif;margin-top:5px;}
  label{font-size:12.5px;color:var(--text-dim);display:block;margin-top:11px;line-height:1.4;}
  .pill{font-size:10.5px;padding:4px 9px;border-radius:5px;font-weight:700;white-space:nowrap;text-transform:uppercase;letter-spacing:0.5px;border:1px solid transparent;}
  .pill.alive{background:var(--alive-dim);color:var(--alive);border-color:var(--alive);}
  .pill.elim{background:var(--elim-dim);color:var(--elim);border-color:var(--elim);}
  .pill.pending{background:var(--pending-dim);color:var(--pending);border-color:var(--pending);}
  .bottom-nav{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;display:flex;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50;}
  @media (min-width:660px){ .bottom-nav{border-left:1px solid var(--border);border-right:1px solid var(--border);border-radius:12px 12px 0 0;bottom:0;} }
  .bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;color:var(--text-dim);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;text-align:center;line-height:1.1;cursor:pointer;touch-action:manipulation;border-radius:8px;}
  .bnav-item.active{color:var(--pending);}
  .bnav-item .icon{line-height:1;}
  .bnav-item .icon svg{width:20px;height:20px;display:block;}
  @media (max-width:360px){ .bnav-item{font-size:8.5px;} .bnav-item .icon svg{width:18px;height:18px;} }
  .slot-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;}
  .slot-label{font-family:'Inter',sans-serif;font-weight:800;font-size:13px;color:var(--pending);text-transform:uppercase;letter-spacing:0.5px;}
  .result-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:14.5px;cursor:pointer;touch-action:manipulation;}
  .result-item:last-child{border-bottom:none;}
  .kickoff-tag{font-size:11.5px;font-weight:700;}
  .lb-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:14.5px;gap:8px;}
  .lb-row:last-child{border-bottom:none;}
  .divider{border:none;border-top:1px solid var(--border);margin:14px 0;}
  .note{font-size:12px;color:var(--text-dim);background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-top:12px;line-height:1.5;border:1px solid var(--border);}
  .banner{background:var(--elim-dim);border:1px solid var(--elim);color:var(--text);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;line-height:1.5;}
  .center{text-align:center;padding:60px 20px;color:var(--text-dim);}
  .stat{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;padding:6px 0;font-size:14px;}
  .stat b{color:var(--text);font-weight:700;}
  .recap-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .recap-row:last-child{border-bottom:none;}
  .recap-row .slot-label{flex:0 0 32px;font-size:10.5px;}
  .recap-row .recap-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
  .recap-row .recap-score{flex:0 0 auto;font-weight:700;white-space:nowrap;font-size:13px;}
  .estimate-note{font-size:11.5px;color:var(--text-dim);font-style:italic;margin:2px 0 0;}
  .tablewrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:400px;}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--border);}
  th{color:var(--text-dim);font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;}
  .scores-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  @media (min-width:640px){ .scores-grid{grid-template-columns:1fr 1fr;} }
  .player-score-card{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--surface-2);}
  .player-score-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .player-score-name{font-weight:700;font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .player-score-tag{font-size:12px;font-weight:600;color:var(--text-dim);}
  .player-score-pickers{font-size:11.5px;color:var(--text-dim);margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);line-height:1.4;}
  .scoreInput{width:64px;flex:0 0 auto;margin:0;padding:6px 8px;font-size:13px;text-align:right;}
  .muted-link{background:none;border:none;color:var(--text-dim);font-size:13px;padding:6px 0;text-decoration:underline;cursor:pointer;width:auto;}
  .confirm-box{border-top:1px solid var(--border);margin-top:8px;padding-top:8px;}
  .faq-item{border-bottom:1px solid var(--border);padding:11px 0;}
  .faq-item:last-child{border-bottom:none;}
  .faq-q{font-weight:700;font-size:14px;cursor:pointer;color:var(--text);display:flex;justify-content:space-between;align-items:center;gap:10px;touch-action:manipulation;}
  .faq-q::after{content:'+';color:var(--pending);font-size:18px;font-weight:400;flex:0 0 auto;}
  .faq-q.open::after{content:'−';}
  .faq-a{display:none;margin-top:8px;font-size:13.5px;color:var(--text-dim);line-height:1.5;}
  .faq-a.open{display:block;}
  .history-group{margin-top:14px;}
  .history-group:first-of-type{margin-top:10px;}
  .history-pos{font-weight:800;font-size:11.5px;color:var(--pending);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:4px;}
  .history-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);}
  .history-item:last-child{border-bottom:none;}
  .used-name{font-size:13.5px;color:var(--text);}
  .week-tag{font-size:10.5px;color:var(--text-dim);font-weight:700;white-space:nowrap;}
  .history-empty{font-size:13px;color:var(--text-dim);padding:6px 0;font-style:italic;}
  .app-header{display:flex;align-items:center;gap:12px;margin-bottom:10px;min-height:50px;}
  .app-header .avatar-circle{width:50px;height:50px;border-radius:50%;object-fit:cover;object-position:center 25%;flex:0 0 auto;}
  .app-header h1{font-size:19px;line-height:1.2;}
  @media (max-width:400px){ .app-header h1{font-size:15px;} .app-header .avatar-circle{width:42px;height:42px;} }
  .name-row{display:flex;align-items:center;gap:8px;}
  .icon-btn{width:26px;height:26px;padding:0;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--text-dim);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .icon-btn svg{width:14px;height:14px;display:block;}
  .icon-btn:active{transform:translateY(1px);}
  .footer-links{margin-top:24px;padding-top:16px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:14px;font-size:13px;}
  .footer-links a, .footer-links .flink{color:var(--text-dim);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;font-family:'Inter';font-weight:400;width:auto;touch-action:manipulation;}
  .footer-contact{margin-top:10px;font-size:12px;color:var(--text-dim);}
  .hero-banner{width:100%;border-radius:10px;margin-bottom:14px;display:block;}
  .legend-portrait{float:left;width:130px;max-width:38%;height:auto;border-radius:8px;margin:2px 14px 10px 0;}
  @media (max-width:400px){ .legend-portrait{width:105px;margin:2px 10px 8px 0;} }
  .legend-quote{clear:both;font-family:'Archivo Black',sans-serif;text-transform:none;font-size:17px;line-height:1.4;color:var(--pending);font-style:italic;margin:16px 0;padding:14px;border-left:3px solid var(--pending);background:var(--pending-dim);border-radius:0 8px 8px 0;}
  @media (max-width:400px){ h1{font-size:21px;} .scoreboard .week{font-size:27px;} .wrap{padding:14px 10px 90px;} }
</style>
</head>
<body>
<div class="wrap">
  <div id="banner"></div>
  <div id="app"><div class="center">Loading…</div></div>
</div>

<script>
const SUPABASE_URL = 'https://caehjxogikaekpcrxcoo.supabase.co';
const SUPABASE_KEY = 'sb_publishable__CUibPnjUkkg8LZ6B-ecFA_cY0TJp9P';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let session = null, profile = null;
let currentWeek = null, lineupSlots = [], myPicks = [], myAllPicks = [], usedPlayerIds = new Set();
let recentWeekNumber = null, recentWeekPicks = [], recentWeekRow = null;
let weekGamesMap = {};
let finalizedWeekNumbers = []; // ascending list of week_numbers with is_finalized = true
let hsWeekIndex = -1; // index into finalizedWeekNumbers currently shown on the Home high-scores slider
const weekTop5Cache = {}; // week_number -> top-5 [{name,total}] array, memoized for the session
const weekTopPlayersCache = {}; // week_number -> top-5 [{name,position,team,score}] NFL-player array, memoized
let screen = 'loading', activeTab = 'home';
let magicLinkSent = false;

const app = document.getElementById('app');
const bannerEl = document.getElementById('banner');
function showBanner(msg){ bannerEl.innerHTML = `<div class="banner">${esc(msg)}</div>`; }
function clearBanner(){ bannerEl.innerHTML = ''; }
function esc(s){ const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
function guard(fn){ return async (...a) => { try { await fn(...a); } catch(e){ showBanner(e.message || String(e)); } }; }

// Monochrome tab icons -- plain line-art SVGs (no built-in color) so each
// tab just inherits the surrounding text color: grey when inactive, the
// app's blue accent when active. Keeps the tab row in the app's own
// palette instead of full-color emoji.
const ICON_PATHS = {
  home: '<path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.8V19a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.8"/><path d="M9.5 20v-6h5v6"/>',
  picks: '<g transform="rotate(-30 12 12)"><path d="M4 12c2-5 6-8 8-8s6 3 8 8c-2 5-6 8-8 8s-6-3-8-8Z"/><path d="M6.5 12h11"/><path d="M10 10.3v3.4"/><path d="M12 10v4"/><path d="M14 10.3v3.4"/></g>',
  standings: '<path d="M4 20V13"/><path d="M12 20V5"/><path d="M20 20v-9"/>',
  prizes: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9"/><path d="M9.7 9.7c0-1.1.9-1.9 2.3-1.9s2.3.8 2.3 1.7c0 2.6-4.6 1.4-4.6 4 0 1 .9 1.9 2.3 1.9s2.3-.8 2.3-1.9"/>',
  faq: '<circle cx="12" cy="12" r="8.5"/><path d="M9.3 9.6a2.7 2.7 0 1 1 4.3 2.2c-.9.6-1.6 1.1-1.6 2.3"/><circle cx="12" cy="16.7" r="0.9" fill="currentColor" stroke="none"/>',
  legend: '<path d="M12 6.2c-1.9-1.3-4.3-2-6.8-2v12.6c2.5 0 4.9.7 6.8 2 1.9-1.3 4.3-2 6.8-2V4.2c-2.5 0-4.9.7-6.8 2Z"/><path d="M12 6.2v12.6"/>',
  pencil: '<path d="M4 20l.7-3.9L15.8 5a1.6 1.6 0 0 1 2.3 0l0.9 0.9a1.6 1.6 0 0 1 0 2.3L7.9 19.3 4 20Z"/><path d="M14.1 6.7l3.2 3.2"/>'
};
function tabIcon(key){
  return `<svg class="ticon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[key] || ''}</svg>`;
}

// "Playing as <name>" header + its pencil-to-edit affordance, shared by
// Home and Picks. The edit form renders into a separate #nameEditArea
// below the scoreboard rather than inline, so it isn't squeezed into the
// narrow left column next to "Week N".
function playerNameHeaderHTML(){
  return `
    <div class="week-label">Playing as</div>
    <div class="name-row">
      <h2>${esc(profile.display_name)}</h2>
      <button class="icon-btn" id="editNameBtn" type="button" title="Edit display name" aria-label="Edit display name">${tabIcon('pencil')}</button>
    </div>`;
}
function wireNameEdit(body){
  const btn = document.getElementById('editNameBtn');
  const area = document.getElementById('nameEditArea');
  if(!btn || !area) return;
  btn.onclick = () => {
    area.innerHTML = `
      <div class="card">
        <h3>Edit display name</h3>
        <p>Shown to other players — this doesn't change your email or sign-in.</p>
        <input id="nameEditInput" value="${esc(profile.display_name)}" maxlength="40" placeholder="Display name" style="margin-top:8px;"/>
        <div class="row" style="gap:8px;margin-top:10px;">
          <button class="small secondary" id="nameCancelBtn" style="flex:1;">Cancel</button>
          <button class="small" id="nameSaveBtn" style="flex:1;">Save name</button>
        </div>
      </div>`;
    const input = document.getElementById('nameEditInput');
    input.focus();
    input.select();
    document.getElementById('nameCancelBtn').onclick = () => { area.innerHTML = ''; };
    document.getElementById('nameSaveBtn').onclick = guard(async () => {
      const val = input.value.trim();
      if(!val){ showBanner("Display name can't be empty."); return; }
      const { error } = await sb.rpc('update_display_name', { p_new_name: val });
      if(error){ showBanner(error.message); return; }
      profile.display_name = val;
      showBanner('Display name updated.');
      renderShell();
    });
  };
}
// Summing float scores (esp. across several weeks) can land on things like
// 289.29999999999995 -- round to 1 decimal for display, drop the .0 when
// it's a whole number.
function fmtPts(n){
  const r = Math.round((Number(n) + Number.EPSILON) * 10) / 10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}

function ctDate(iso){
  return new Intl.DateTimeFormat('en-US', {timeZone:'America/Chicago', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date(iso));
}
function ctTime(iso){
  return new Intl.DateTimeFormat('en-US', {timeZone:'America/Chicago', weekday:'short', hour:'numeric', minute:'2-digit'}).format(new Date(iso)) + ' CT';
}
function isSameDayCT(iso){ return ctDate(iso) === ctDate(new Date().toISOString()); }

// ---------- DATA LOADING ----------
async function loadProfile(){
  const { data } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  profile = data;
}
async function loadCurrentWeek(){
  const { data } = await sb.from('weeks').select('*').gt('closes_at', new Date().toISOString()).order('week_number').limit(1).maybeSingle();
  currentWeek = data;
}
async function loadLineupSlots(){
  const { data } = await sb.from('lineup_slots').select('*').order('sort_order');
  lineupSlots = data || [];
}
async function loadMyPicks(){
  if(!currentWeek) { myPicks = []; return; }
  const { data } = await sb.from('picks_with_scores').select('*').eq('player_id', session.user.id).eq('week_number', currentWeek.week_number);
  myPicks = data || [];
}
async function loadUsedPlayers(){
  const { data } = await sb.from('picks').select('nfl_player_id').eq('player_id', session.user.id);
  usedPlayerIds = new Set((data||[]).map(p => p.nfl_player_id));
}
async function loadMyAllPicks(){
  const { data } = await sb.from('picks').select('nfl_player_name, position, team, week_number, locked_at')
    .eq('player_id', session.user.id).order('week_number');
  myAllPicks = data || [];
}
async function loadWeekGames(){
  if(!currentWeek){ weekGamesMap = {}; return; }
  const { data } = await sb.from('games').select('team, kickoff_at').eq('week_number', currentWeek.week_number);
  weekGamesMap = {};
  (data||[]).forEach(g => weekGamesMap[g.team] = g.kickoff_at);
}
// Home's "recap" needs the most recent week the player has ANY picks in,
// independent of currentWeek -- this is what keeps last week's lineup/score
// visible on Home after the week flips over, instead of vanishing the
// instant closes_at passes.
async function loadRecentWeek(){
  const { data } = await sb.from('picks_with_scores').select('*').eq('player_id', session.user.id)
    .order('week_number', { ascending: false }).limit(50);
  if(!data || !data.length){ recentWeekNumber = null; recentWeekPicks = []; recentWeekRow = null; return; }
  recentWeekNumber = data[0].week_number;
  recentWeekPicks = data.filter(p => p.week_number === recentWeekNumber);
  const { data: weekRow } = await sb.from('weeks').select('*').eq('week_number', recentWeekNumber).maybeSingle();
  recentWeekRow = weekRow;
}
async function loadFinalizedWeeks(){
  const { data } = await sb.from('weeks').select('week_number').eq('is_finalized', true).order('week_number');
  finalizedWeekNumbers = (data || []).map(w => w.week_number);
  // Default the Home slider to the most recent finalized week; keep the
  // current position if it's still valid (e.g. after a re-render).
  if(hsWeekIndex < 0 || hsWeekIndex >= finalizedWeekNumbers.length) hsWeekIndex = finalizedWeekNumbers.length - 1;
}
// Shared by the Home slider, Standings' "latest week" card, and the Prizes
// weekly-history accordion -- one place that turns a week's picks into a
// top-5 [{name,total}] list, memoized per week_number since finalized weeks
// never change once scored.
async function getWeekTop5(weekNumber){
  if(weekTop5Cache[weekNumber]) return weekTop5Cache[weekNumber];
  const { data } = await sb.from('picks_with_scores').select('player_id, score, profiles(display_name)').eq('week_number', weekNumber);
  const totals = {};
  (data || []).forEach(p => {
    if(!totals[p.player_id]) totals[p.player_id] = { name: p.profiles?.display_name || '', total: 0 };
    totals[p.player_id].total += Number(p.score) || 0;
  });
  const top5 = Object.values(totals).sort((a,b) => b.total - a.total).slice(0, 5);
  weekTop5Cache[weekNumber] = top5;
  return top5;
}
function weekTop5ListHTML(top5){
  return top5.length ? top5.map((t,i) => `<div class="lb-row"><span>#${i+1} ${esc(t.name)}</span><b style="color:var(--pending);">${fmtPts(t.total)} pts</b></div>`).join('')
    : '<p>No scores yet.</p>';
}
// Top 5 individual NFL players (not entrants) for a given week, by that
// player's own score. A real player's weekly score is one fact stored once
// in week_player_scores (see supabase-setup.md), so `picks_with_scores`
// already carries the right value for every entrant who drafted him --
// this just dedupes by nfl_player_id and takes the top 5. Memoized per
// week_number same as getWeekTop5, since a finalized week's scores don't change.
async function getWeekTopPlayers(weekNumber){
  if(weekTopPlayersCache[weekNumber]) return weekTopPlayersCache[weekNumber];
  const { data } = await sb.from('picks_with_scores').select('nfl_player_id, nfl_player_name, position, team, score').eq('week_number', weekNumber);
  const byPlayer = {};
  (data || []).forEach(p => {
    if(p.score === null || byPlayer[p.nfl_player_id]) return;
    byPlayer[p.nfl_player_id] = { name: p.nfl_player_name, position: p.position, team: p.team, score: Number(p.score) || 0 };
  });
  const top5 = Object.values(byPlayer).sort((a,b) => b.score - a.score).slice(0, 5);
  weekTopPlayersCache[weekNumber] = top5;
  return top5;
}
function weekTopPlayersListHTML(top5){
  return top5.length ? top5.map((p,i) => `<div class="lb-row"><span>#${i+1} ${esc(p.name)} <span style="color:var(--text-dim);">${p.position}${p.team ? ' · ' + esc(p.team) : ''}</span></span><b style="color:var(--pending);">${fmtPts(p.score)} pts</b></div>`).join('')
    : '<p>No scores yet.</p>';
}

// ---------- AUTH ----------
async function sendMagicLink(email, displayName){
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: {
      emailRedirectTo: window.location.origin + window.location.pathname,
      data: { display_name: displayName }
    }
  });
  if(error) throw error;
  magicLinkSent = true;
  render();
}
async function signOut(){
  await sb.auth.signOut();
  session = null; profile = null;
  screen = 'auth'; magicLinkSent = false;
  render();
}

}

// Home is now a status/profile view: alive state, a recap of the most
// recently *played* week (independent of whether a new week has opened),
// and season-long pick history. It never depends on currentWeek/opens_at/
// closes_at, so it has nothing to "flip" out from under a player -- the
// recap simply stays until a newer week's picks replace it. Building this
// week's lineup lives on the Picks tab (see renderPicks below).
async function renderHome(body){
  const { data: settingsRow } = await sb.from('league_settings').select('weekly_threshold').eq('id', 1).single();
  const threshold = settingsRow?.weekly_threshold ?? 100;

  let statusHTML = '';
  if(!profile.alive){
    statusHTML = `<div class="card"><h3>You're out</h3><p>Eliminated in week ${profile.eliminated_week}. Thanks for playing — check the standings tab for where things landed.</p></div>`;
  } else if(!profile.is_approved){
    statusHTML = `<div class="card"><h3>Pending approval</h3><p>Your entry hasn't been approved yet — check with the admin.</p></div>`;
  } else if(currentWeek){
    statusHTML = `<div class="card"><h3>You're alive</h3><p>Head to the Picks tab to build your lineup for week ${currentWeek.week_number}.</p></div>`;
  } else {
    statusHTML = `<div class="card"><h3>You're alive</h3><p>There's no open week right now — check back once the next one opens.</p></div>`;
  }

  let recapHTML = '';
  if(recentWeekNumber){
    const isFinal = !!recentWeekRow?.is_finalized;
    const recapSlotsHTML = lineupSlots.map(slot => {
      const pick = recentWeekPicks.find(p => p.slot === slot.slot);
      if(!pick){
        return `<div class="recap-row"><span class="slot-label">${slot.slot}</span><span class="recap-name" style="color:var(--text-dim);">Not filled</span></div>`;
      }
      const scoreColor = pick.result === 'pass' ? 'var(--alive)' : pick.result === 'fail' ? 'var(--elim)' : 'var(--text-dim)';
      const scoreText = pick.score !== null ? `${fmtPts(pick.score)} pts` : 'Pending';
      return `
        <div class="recap-row">
          <span class="slot-label">${slot.slot}</span>
          <span class="recap-name">${esc(pick.nfl_player_name)} <span style="color:var(--text-dim);">(${esc(pick.team)})</span></span>
          <span class="recap-score" style="color:${scoreColor};">${scoreText}</span>
        </div>`;
    }).join('');

    // Reflect scores the moment the admin saves them (picks_with_scores
    // already carries whatever's in week_player_scores), not just once the
    // whole week is finalized -- so this sums whatever's scored so far
    // rather than gating on every slot being done.
    const scoredCount = recentWeekPicks.filter(p => p.score !== null).length;
    const currentTotal = scoredCount > 0 ? recentWeekPicks.reduce((sum,p) => sum + (Number(p.score) || 0), 0) : null;
    const fullyScored = scoredCount === lineupSlots.length && lineupSlots.length > 0;

    recapHTML = `
      <div class="card">
        <h3>Week ${recentWeekNumber} recap</h3>
        ${!isFinal ? '<p>Scoring in progress — the admin hasn\'t finalized this week yet.</p>' : ''}
        ${recapSlotsHTML}
        ${currentTotal !== null ? `
          <div class="stat" style="margin-top:10px;"><span>${isFinal ? 'Total' : 'Current total'}</span><b style="color:${currentTotal >= threshold ? 'var(--alive)' : 'var(--elim)'}">${fmtPts(currentTotal)} pts</b></div>
          ${!isFinal ? `<p class="estimate-note">${fullyScored ? 'Estimated' : 'Projected'} — not final until the week is finalized.</p>` : ''}
        ` : ''}
        <div class="stat" style="margin-top:${currentTotal !== null ? '4px' : '10px'};"><span>Threshold to advance</span><b>${threshold}+ pts</b></div>
      </div>`;
  }

  const highScoresHTML = await renderHighScoresCardHTML();

  body.innerHTML = `
    <div class="scoreboard">
      <div>${playerNameHeaderHTML()}</div>
      <div style="text-align:right;"><div class="week-label">Week</div><div class="week">${currentWeek ? currentWeek.week_number : (recentWeekNumber ?? '—')}</div></div>
    </div>
    <div id="nameEditArea"></div>
    ${statusHTML}
    ${recapHTML}
    ${highScoresHTML}
    ${renderPickHistoryHTML()}
  `;
  wireHighScoresCard(body);
  wireNameEdit(body);
}

// Weekly high-scores card, used on Home with prev/next arrows through every
// finalized week. Scores live permanently on the finalized `picks` rows
// (nothing ever deletes them), so this is just a read + client-side sum --
// no separate storage needed.
async function renderHighScoresCardHTML(){
  if(!finalizedWeekNumbers.length){
    return `<div class="card"><h3>Weekly high scores</h3><p>Nothing finalized yet — once the admin finalizes a week, that week's top 5 scores will show up here.</p></div>`;
  }
  const wk = finalizedWeekNumbers[hsWeekIndex];
  const [top5, topPlayers] = await Promise.all([getWeekTop5(wk), getWeekTopPlayers(wk)]);
  return `
    <div class="card">
      <div class="row">
        <h3>Week ${wk} high scores</h3>
        <span class="row" style="gap:6px;width:auto;">
          <button class="small secondary" id="hsPrev" ${hsWeekIndex <= 0 ? 'disabled' : ''}>‹</button>
          <button class="small secondary" id="hsNext" ${hsWeekIndex >= finalizedWeekNumbers.length - 1 ? 'disabled' : ''}>›</button>
        </span>
      </div>
      <div style="margin-top:8px;">${weekTop5ListHTML(top5)}</div>
      <div class="divider"></div>
      <h3>Top NFL performers</h3>
      <div style="margin-top:8px;">${weekTopPlayersListHTML(topPlayers)}</div>
    </div>`;
}
function wireHighScoresCard(body){
  const prev = document.getElementById('hsPrev'), next = document.getElementById('hsNext');
  if(prev) prev.onclick = async () => { hsWeekIndex--; await renderHome(body); };
  if(next) next.onclick = async () => { hsWeekIndex++; await renderHome(body); };
}

// Picks is the action tab: building/locking this week's lineup. This is
// the old renderHome's lineup-builder logic, unchanged, just relocated off
// of Home.
async function renderPicks(body){
  if(!currentWeek){
    body.innerHTML = `<div class="card"><h3>No active week</h3><p>There's no open week right now — check back once the next one opens.</p></div>`;
    return;
  }
  const { data: settingsRow } = await sb.from('league_settings').select('weekly_threshold').eq('id', 1).single();
  const threshold = settingsRow?.weekly_threshold ?? 100;
  const now = new Date();
  const windowOpen = now <= new Date(currentWeek.closes_at);

  let statusHTML = '';
  if(!profile.alive){
    statusHTML = `<div class="card"><h3>You're out</h3><p>Eliminated in week ${profile.eliminated_week}. Thanks for playing — check the standings tab for where things landed.</p></div>`;
  } else if(!profile.is_approved){
    statusHTML = `<div class="card"><h3>Pending approval</h3><p>Your entry hasn't been approved yet — check with the admin.</p></div>`;
  } else if(!windowOpen){
    statusHTML = `<div class="card"><h3>Picks are closed</h3><p>Week ${currentWeek.week_number} closed ${ctTime(currentWeek.closes_at)}.</p></div>`;
  }

  const slotsHTML = lineupSlots.map(slot => {
    const pick = myPicks.find(p => p.slot === slot.slot);
    if(pick){
      return `
        <div class="slot-card">
          <div class="row"><span class="slot-label">${slot.slot}</span><span class="pill alive">LOCKED</span></div>
          <p style="color:var(--text);margin-top:4px;">${esc(pick.nfl_player_name)} <span style="color:var(--text-dim)">(${esc(pick.team)})</span></p>
          ${pick.score !== null ? `<p>Score: <strong style="color:${pick.result==='pass'?'var(--alive)':'var(--elim)'}">${pick.score}</strong></p>` : `<p>Score pending</p>`}
        </div>`;
    }
    if(!profile.alive || !profile.is_approved || !windowOpen) {
      return `<div class="slot-card"><span class="slot-label">${slot.slot}</span><p>Not filled</p></div>`;
    }
    return `
      <div class="slot-card">
        <span class="slot-label">${slot.slot}</span>
        <input placeholder="Search ${slot.position}..." class="slotSearch" data-slot="${slot.slot}" data-position="${slot.position}" autocomplete="off"/>
        <div class="results" id="results-${slot.slot}"></div>
      </div>`;
  }).join('');

  const totalScored = myPicks.every(p => p.score !== null) && myPicks.length === lineupSlots.length
    ? myPicks.reduce((sum,p) => sum + Number(p.score), 0)
    : null;

  body.innerHTML = `
    <div class="scoreboard">
      <div>${playerNameHeaderHTML()}</div>
      <div style="text-align:right;"><div class="week-label">Week</div><div class="week">${currentWeek.week_number}</div></div>
    </div>
    <div id="nameEditArea"></div>
    ${statusHTML}
    <div class="card ${myPicks.length === lineupSlots.length && lineupSlots.length > 0 ? 'feature' : ''}">
      <h3>Your lineup</h3>
      <div class="note">Once locked, a pick can't be changed. Slots lock independently — you can fill them one at a time up until your selected player's kickoff time.</div>
      ${myPicks.length === lineupSlots.length && lineupSlots.length > 0 ? '<span class="pill alive" style="margin-top:6px;display:inline-block;">Team locked in</span>' : ''}
      ${slotsHTML}
      <div class="stat" style="margin-top:10px;"><span>Threshold to advance</span><b>${threshold}+ pts</b></div>
      ${totalScored !== null ? `<div class="stat"><span>Your total this week</span><b style="color:${totalScored >= threshold ? 'var(--alive)' : 'var(--elim)'}">${fmtPts(totalScored)} pts</b></div>` : ''}
    </div>
  `;

  document.querySelectorAll('.slotSearch').forEach(input => {
    let debounce;
    input.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => runSearch(input.dataset.slot, input.dataset.position, input.value), 250);
    });
  });
  wireNameEdit(body);
}

async function runSearch(slot, position, query){
  const resultsEl = document.getElementById(`results-${slot}`);
  if(!query || query.length < 2){ resultsEl.innerHTML = ''; return; }
  const { data } = await sb.from('nfl_players').select('id, full_name, team')
    .eq('position', position).eq('active', true).ilike('full_name', `%${query}%`).limit(30);
  const now = Date.now();
  const options = (data || [])
    .filter(p => !usedPlayerIds.has(p.id))
    .map(p => ({ ...p, kickoff: weekGamesMap[p.team] || null }))
    .filter(p => p.kickoff && new Date(p.kickoff).getTime() > now)
    .sort((a,b) => a.full_name.localeCompare(b.full_name))
    .slice(0, 12);

  if(options.length === 0){
    resultsEl.innerHTML = `<p style="margin-top:8px;">No available, not-yet-started ${position}s match "${esc(query)}".</p>`;
    return;
  }
  resultsEl.innerHTML = options.map(p => {
    const color = isSameDayCT(p.kickoff) ? 'var(--elim)' : 'var(--alive)';
    return `<div class="result-item" data-id="${p.id}" data-name="${esc(p.full_name)}" data-team="${esc(p.team)}">
      <span>${esc(p.full_name)} <span style="color:var(--text-dim)">(${esc(p.team)})</span></span>
      <span class="kickoff-tag" style="color:${color}">${ctTime(p.kickoff)}</span>
    </div>`;
  }).join('');
  resultsEl.querySelectorAll('.result-item').forEach(el => {
    el.onclick = () => {
      const { id, name, team } = el.dataset;
      showPickConfirm(slot, id, name, team);
    };
  });
}

function showPickConfirm(slot, id, name, team){
  const resultsEl = document.getElementById(`results-${slot}`);
  resultsEl.innerHTML = `
    <div class="confirm-box">
      <p style="color:var(--text);">Lock in <strong>${esc(name)}</strong> (${esc(team)}) for ${slot}? This can't be changed once submitted.</p>
      <div class="row" style="gap:8px;margin-top:6px;">
        <button class="small secondary" id="cancelPick" style="flex:1;">Cancel</button>
        <button class="small" id="confirmPick" style="flex:1;">Confirm pick</button>
      </div>
    </div>`;
  document.getElementById('cancelPick').onclick = () => { resultsEl.innerHTML = ''; };
  document.getElementById('confirmPick').onclick = guard(async () => {
    const { error } = await sb.rpc('submit_slot_pick', { p_week: currentWeek.week_number, p_slot: slot, p_player_ref: id });
    if(error){ showBanner(error.message); return; }
    await Promise.all([loadMyPicks(), loadUsedPlayers(), loadMyAllPicks(), loadRecentWeek()]);
    renderShell();
  });
}

async function renderStandings(body){
  body.innerHTML = `<div class="center">Loading standings…</div>`;
  await loadFinalizedWeeks();
  const lastFinalizedWeek = finalizedWeekNumbers.length ? finalizedWeekNumbers[finalizedWeekNumbers.length - 1] : null;

  let topScoresHTML = '', eliminatedHTML = '';
  if(lastFinalizedWeek){
    const top5 = await getWeekTop5(lastFinalizedWeek);
    topScoresHTML = `
      <div class="card">
        <h3>Week ${lastFinalizedWeek} high scores</h3>
        ${weekTop5ListHTML(top5)}
      </div>`;

    const { data: eliminated } = await sb.from('profiles').select('display_name')
      .eq('is_approved', true).eq('eliminated_week', lastFinalizedWeek);
    eliminatedHTML = `
      <div class="card">
        <h3>Eliminated week ${lastFinalizedWeek}</h3>
        ${(eliminated||[]).map(e => `<div class="lb-row"><span>${esc(e.display_name)}</span><span class="pill elim">OUT</span></div>`).join('') || '<p>No one was eliminated this week.</p>'}
      </div>`;
  }

  // Cumulative points: sum every scored pick across all finalized weeks,
  // per player -- read-only client-side aggregation over data that's
  // already there, no new columns or tables needed.
  const { data: profilesData } = await sb.from('profiles').select('id, display_name, alive, eliminated_week').eq('is_approved', true);
  let totalsMap = {};
  if(finalizedWeekNumbers.length){
    const { data: allPicks } = await sb.from('picks_with_scores').select('player_id, score').in('week_number', finalizedWeekNumbers);
    (allPicks || []).forEach(p => { totalsMap[p.player_id] = (totalsMap[p.player_id] || 0) + (Number(p.score) || 0); });
  }
  const rows = (profilesData || []).map(r => ({ ...r, total: totalsMap[r.id] || 0 })).sort((a,b) =>
    (b.alive - a.alive) || (b.total - a.total) || a.display_name.localeCompare(b.display_name)
  );

  function survivorsRowsHTML(list){
    return list.map(r => `
      <div class="lb-row">
        <span>${esc(r.display_name)}</span>
        <span class="row" style="gap:8px;width:auto;">
          <b style="color:var(--pending);">${fmtPts(r.total)} pts</b>
          <span class="pill ${r.alive ? 'alive' : 'elim'}">${r.alive ? 'ALIVE' : `OUT · WK ${r.eliminated_week}`}</span>
        </span>
      </div>`).join('') || '<p>No approved players yet.</p>';
  }

  body.innerHTML = `
    ${topScoresHTML}
    ${eliminatedHTML}
    <div class="card">
      <h3>Standings</h3>
      <p>Ranked by cumulative points across every finalized week.</p>
      <input id="standingsSearch" placeholder="Search players..." style="margin-top:10px;"/>
      <div id="survivorsList" style="margin-top:6px;">${survivorsRowsHTML(rows)}</div>
    </div>`;

  document.getElementById('standingsSearch').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    const filtered = q ? rows.filter(r => r.display_name.toLowerCase().includes(q)) : rows;
    document.getElementById('survivorsList').innerHTML = survivorsRowsHTML(filtered);
  });
}

async function renderPrizes(body){
  body.innerHTML = `<div class="center">Loading…</div>`;
  await loadFinalizedWeeks();
  const [{ data: settings }, { count }, { count: aliveCount }, { count: secondChanceCount }] = await Promise.all([
    sb.from('league_settings').select('*').eq('id', 1).single(),
    sb.from('profiles').select('id', { count: 'exact', head: true }).eq('is_approved', true),
    sb.from('profiles').select('id', { count: 'exact', head: true }).eq('is_approved', true).eq('alive', true),
    sb.from('profiles').select('id', { count: 'exact', head: true }).eq('second_chance_used', true)
  ]);
  const fee = settings.entry_fee || 0;
  const total = fee * ((count || 0) + (secondChanceCount || 0));
  const organizer = total * settings.organizer_pct / 100;
  const weekly = total * settings.weekly_pct / 100;
  const grand = total * settings.grand_pct / 100;
  const weeks = settings.weekly_prize_end_week || 1;
  const perWeek = weekly / weeks;
  const survivors = aliveCount || 0;
  const perSurvivor = survivors > 0 ? grand / survivors : 0;
  const money = n => '$' + n.toLocaleString(undefined, { maximumFractionDigits: 2 });

  body.innerHTML = `
    <div class="card">
      <h3>Prize pool</h3>
      <div class="stat"><span>Entry fee</span><b>${fee ? money(fee) : '—'}</b></div>
      <div class="stat"><span>Approved entrants</span><b>${count || 0}</b></div>
      ${secondChanceCount ? `<div class="stat"><span>Second-chance buy-ins</span><b>${secondChanceCount}</b></div>` : ''}
      <div class="stat"><span>Total pool</span><b>${money(total)}</b></div>
      <div class="divider"></div>
      <div class="stat"><span>Grand prize pool (${settings.grand_pct}%)</span><b>${money(grand)}</b></div>
      <div class="stat"><span>&nbsp;&nbsp;→ if the season ended today (${survivors} still alive)</span><b>${survivors > 0 ? `${money(perSurvivor)} each` : '—'}</b></div>
      <div class="stat"><span>Weekly prizes (${settings.weekly_pct}%)</span><b>${money(weekly)} total</b></div>
      <div class="stat"><span>&nbsp;&nbsp;→ per week, weeks 1–${weeks}</span><b>${money(perWeek)}</b></div>
      <div class="note">Weekly prizes are paid weeks 1 through ${weeks}. Totals update automatically as more players are approved.</div>
      <div class="note">The grand prize pays 100% to whoever is still alive at the end — split evenly if more than one player survives to the finish.</div>
      <div class="note">For transparency: ${settings.organizer_pct}% of entry fees (${money(organizer)}) goes toward running the league — hosting, tools, and the time spent operating it week to week.</div>
    </div>
    <div class="card">
      <h3>Weekly high score history</h3>
      <p>Top 5 scores for every finalized week — the reference for awarding weekly prizes.</p>
      ${finalizedWeekNumbers.length ? finalizedWeekNumbers.slice().reverse().map(w => `
        <div class="faq-item">
          <div class="faq-q whs-q" data-week="${w}">Week ${w}</div>
          <div class="faq-a" id="whs-a-${w}"><p>Loading…</p></div>
        </div>`).join('') : '<p>No weeks finalized yet.</p>'}
    </div>`;

  document.querySelectorAll('.whs-q').forEach(el => {
    el.onclick = async () => {
      const w = el.dataset.week;
      const ans = document.getElementById(`whs-a-${w}`);
      const open = ans.classList.toggle('open');
      el.classList.toggle('open', open);
      if(open && !ans.dataset.loaded){
        const top5 = await getWeekTop5(Number(w));
        ans.innerHTML = weekTop5ListHTML(top5);
        ans.dataset.loaded = '1';
      }
    };
  });
}

  { q: "Do I need a new sign-in link every time I want to lock in a pick?",
    a: "No — once you click your link, this device stays signed in. You'll only need a new one if you switch devices or browsers, sign out, or clear your browser's data." },

async function renderAdmin(body){
  body.innerHTML = `<div class="center">Loading…</div>`;
  const [{ data: settings }, { data: players }, { data: weekRow }] = await Promise.all([
    sb.from('league_settings').select('*').eq('id', 1).single(),
    sb.from('profiles').select('id, display_name, is_approved, alive, eliminated_week, second_chance_used, is_commissioner').order('display_name'),
    currentWeek ? sb.from('weeks').select('is_finalized').eq('week_number', currentWeek.week_number).single() : Promise.resolve({data:null})
  ]);
  const weekForScores = currentWeek ? currentWeek.week_number : 1;
  const isFinalized = weekRow?.is_finalized || false;

  let scoresTableHTML;
  if(isFinalized){
    const { data: picksThatWeek } = await sb.from('picks_with_scores')
      .select('player_id, score, profiles(display_name, alive)').eq('week_number', weekForScores);
    const totals = {};
    (picksThatWeek || []).forEach(p => {
      if(!totals[p.player_id]) totals[p.player_id] = { name: p.profiles?.display_name || '', total: 0, alive: p.profiles?.alive };
      totals[p.player_id].total += Number(p.score) || 0;
    });
    const rows = Object.values(totals).sort((a,b) => b.total - a.total);
    scoresTableHTML = `
      <div class="tablewrap"><table>
        <tr><th>Player</th><th>Total</th><th>Result</th></tr>
        ${rows.map(r => `<tr><td>${esc(r.name)}</td><td>${fmtPts(r.total)}</td><td><span class="pill ${r.alive?'alive':'elim'}">${r.alive?'ALIVE':'OUT'}</span></td></tr>`).join('')}
      </table></div>
      <div class="note">This week is finalized — showing final totals. Editing scores or re-finalizing (after fixing a mistake) is still possible below.</div>`;
  } else {
    // A real NFL player's score for the week is one fact, not one fact per
    // entrant who drafted him -- so this groups by nfl_player_id, not by
    // entrant, and the admin enters each player's score exactly once no
    // matter how many people picked him. `commissioner_set_player_score`
    // then applies it to every one of those entrants' picks at once.
    const [{ data: picksForWeek }, { data: weekScores }] = await Promise.all([
      sb.from('picks').select('nfl_player_id, nfl_player_name, position, team, profiles(display_name)').eq('week_number', weekForScores),
      sb.from('week_player_scores').select('nfl_player_id, score').eq('week_number', weekForScores)
    ]);
    const scoreByNflId = {};
    (weekScores || []).forEach(s => { scoreByNflId[s.nfl_player_id] = s.score; });

    const byNflPlayer = {};
    (picksForWeek || []).forEach(pk => {
      if(!byNflPlayer[pk.nfl_player_id]){
        byNflPlayer[pk.nfl_player_id] = {
          name: pk.nfl_player_name, position: pk.position, team: pk.team,
          score: scoreByNflId[pk.nfl_player_id] ?? null, pickers: []
        };
      }
      byNflPlayer[pk.nfl_player_id].pickers.push(pk.profiles?.display_name || '');
    });
    const POSITION_ORDER = ['QB','RB','WR','TE'];
    const playerRows = Object.entries(byNflPlayer).map(([nflPlayerId, v]) => ({ nflPlayerId, ...v }))
      .sort((a, b) => (POSITION_ORDER.indexOf(a.position) - POSITION_ORDER.indexOf(b.position)) || a.name.localeCompare(b.name));

    scoresTableHTML = playerRows.length ? `
      <div class="scores-grid">
        ${playerRows.map(pr => `
          <div class="player-score-card">
            <div class="player-score-head">
              <span class="player-score-name">${esc(pr.name)} <span class="player-score-tag">${pr.position}${pr.team ? ' · ' + esc(pr.team) : ''}</span></span>
              <input type="number" step="0.1" class="scoreInput" data-nfl-id="${pr.nflPlayerId}" value="${pr.score ?? ''}"/>
            </div>
            <div class="player-score-pickers">Picked by: ${pr.pickers.map(esc).join(', ')}</div>
          </div>`).join('')}
      </div>` : '<p>No picks submitted for this week yet.</p>';
  }

  body.innerHTML = `
    <div class="card">
      <h3>League settings</h3>
      <label>Signup closes at</label>
      <input id="s_signup" type="datetime-local" value="${settings.signup_closes_at ? settings.signup_closes_at.slice(0,16) : ''}" />
      <label>Weekly point threshold / Weekly prizes through week</label>
      <div class="row">
        <input id="s_threshold" type="number" value="${settings.weekly_threshold}" style="width:auto;flex:1;min-width:0;" placeholder="Threshold"/>
        <input id="s_wpew" type="number" value="${settings.weekly_prize_end_week ?? ''}" style="width:auto;flex:1;min-width:0;" placeholder="Through wk"/>
      </div>
      <label>Entry fee / Grand % / Weekly % / Organizer %</label>
      <div class="row">
        <input id="s_fee" type="number" step="0.01" value="${settings.entry_fee ?? ''}" style="width:auto;flex:1;min-width:0;" placeholder="Fee"/>
        <input id="s_grand" type="number" value="${settings.grand_pct}" style="width:auto;flex:1;min-width:0;" placeholder="Grand %"/>
        <input id="s_week" type="number" value="${settings.weekly_pct}" style="width:auto;flex:1;min-width:0;" placeholder="Weekly %"/>
        <input id="s_org" type="number" value="${settings.organizer_pct}" style="width:auto;flex:1;min-width:0;" placeholder="Organizer %"/>
      </div>
      <button id="saveSettings" style="margin-top:14px;">Save league settings</button>
    </div>

    <div class="card">
      <h3>Players</h3>
      ${(() => {
        const commissionerCount = players.filter(x => x.is_commissioner).length;
        return players.map(p => {
          const eligibleForSecondChance = !p.alive && !p.second_chance_used && p.eliminated_week && p.eliminated_week <= 5;
          const isLastCommissioner = p.is_commissioner && commissionerCount <= 1;
          return `
          <div class="lb-row">
            <span>${esc(p.display_name)} ${!p.alive ? `<span class="pill elim">OUT WK ${p.eliminated_week}</span>` : ''} ${p.is_commissioner ? `<span class="pill">Admin</span>` : ''}</span>
            <span class="row" style="gap:6px;width:auto;">
              ${eligibleForSecondChance ? `<button class="small secondary" data-secondchance="${p.id}">2nd Chance</button>` : ''}
              <button class="small ${p.is_approved ? 'secondary' : ''}" data-approve="${p.id}" data-current="${p.is_approved}">${p.is_approved ? 'Approved' : 'Approve'}</button>
              <button class="small secondary" data-admin="${p.id}" data-current="${p.is_commissioner}" ${isLastCommissioner ? 'disabled title="Can\'t revoke the last remaining admin"' : ''}>${p.is_commissioner ? 'Revoke admin' : 'Make admin'}</button>
            </span>
          </div>`;
        }).join('') || '<p>No players yet.</p>';
      })()}
    </div>

    <div class="card">
      <h3>Week ${weekForScores} scores</h3>
      ${scoresTableHTML}
      ${!isFinalized ? '<button id="saveScores" style="margin-top:12px;">Save scores</button>' : ''}
      <button id="finalizeWeek" style="margin-top:10px;">${isFinalized ? 'Re-finalize' : 'Finalize'} week ${weekForScores}</button>
      <div id="finalizeConfirm"></div>
    </div>
  `;

  document.querySelectorAll('[data-secondchance]').forEach(btn => {
    btn.onclick = guard(async () => {
      const { error } = await sb.rpc('commissioner_grant_second_chance', { p_player_id: btn.dataset.secondchance });
      if(error) throw error;
      showBanner('Second chance granted.');
      renderAdmin(body);
    });
  });

  document.getElementById('saveSettings').onclick = guard(async () => {
    const signup = document.getElementById('s_signup').value;
    await sb.rpc('commissioner_update_weekly_threshold', { p_threshold: parseFloat(document.getElementById('s_threshold').value) });
    await sb.rpc('commissioner_set_signup_deadline', { p_deadline: signup ? new Date(signup).toISOString() : null });
    await sb.rpc('commissioner_update_prize_settings', {
      p_entry_fee: parseFloat(document.getElementById('s_fee').value) || null,
      p_organizer_pct: parseFloat(document.getElementById('s_org').value),
      p_weekly_pct: parseFloat(document.getElementById('s_week').value),
      p_grand_pct: parseFloat(document.getElementById('s_grand').value),
      p_weekly_prize_end_week: parseInt(document.getElementById('s_wpew').value) || null
    });
    renderAdmin(body);
  });

  document.querySelectorAll('[data-approve]').forEach(btn => {
    btn.onclick = guard(async () => {
      const id = btn.dataset.approve;
      const current = btn.dataset.current === 'true';
      const { error } = await sb.rpc('commissioner_set_player_approved', { p_player_id: id, p_approved: !current });
      if(error) throw error;
      renderAdmin(body);
    });
  });

  document.querySelectorAll('[data-admin]').forEach(btn => {
    btn.onclick = guard(async () => {
      const id = btn.dataset.admin;
      const current = btn.dataset.current === 'true';
      const { error } = await sb.rpc(current ? 'commissioner_revoke_admin' : 'commissioner_grant_admin', { p_player_id: id });
      if(error) throw error;
      showBanner(current ? 'Admin revoked.' : 'Admin granted.');
      renderAdmin(body);
    });
  });

  const saveScoresBtn = document.getElementById('saveScores');
  if(saveScoresBtn){
    saveScoresBtn.onclick = guard(async () => {
      const inputs = document.querySelectorAll('.scoreInput');
      for(const inp of inputs){
        const val = inp.value === '' ? null : parseFloat(inp.value);
        const { error } = await sb.rpc('commissioner_set_player_score', { p_week: weekForScores, p_nfl_player_id: inp.dataset.nflId, p_score: val });
        if(error) throw error;
      }
      showBanner('Scores saved.');
      renderAdmin(body);
    });
  }
  const finalizeBtn = document.getElementById('finalizeWeek');
  if(finalizeBtn){
    finalizeBtn.onclick = () => {
      document.getElementById('finalizeConfirm').innerHTML = `
        <div class="confirm-box">
          <p style="color:var(--text);">Finalize week ${weekForScores}? This eliminates anyone below threshold or with an incomplete team.</p>
          <div class="row" style="gap:8px;margin-top:6px;">
            <button class="small secondary" id="cancelFinalize" style="flex:1;">Cancel</button>
            <button class="small danger" id="confirmFinalize" style="flex:1;">Confirm finalize</button>
          </div>
        </div>`;
      document.getElementById('cancelFinalize').onclick = () => { document.getElementById('finalizeConfirm').innerHTML = ''; };
      document.getElementById('confirmFinalize').onclick = guard(async () => {
        const { error } = await sb.rpc('commissioner_finalize_week', { p_week: weekForScores });
        if(error) throw error;
        showBanner(`Week ${weekForScores} finalized.`);
        await loadAllData();
        renderShell();
      });
    };
  }
}

sb.auth.onAuthStateChange(async (event, s) => {
  if(s){
    session = s;
    await loadAllData();
    screen = 'app';
    render();
  }
});

(async () => {
  const { data: { session: existing } } = await sb.auth.getSession();
  if(existing){
    session = existing;
    await loadAllData();
    screen = 'app';
  } else {
    screen = 'auth';
  }
  render();
})();
</script>
